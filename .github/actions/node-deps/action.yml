name: Setup Node dependencies
description: Configure the repository Node toolchain and install locked npm dependencies.

inputs:
  node-version:
    description: Node.js major or exact version.
    required: false
    default: "26"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - name: Install
      shell: bash
      run: npm ci
