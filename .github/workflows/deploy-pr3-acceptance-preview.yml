name: Deploy PR3 acceptance preview

on:
  pull_request:
    branches: [sync/v7-live-gc]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr3-acceptance-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sync/v8-history-archive' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR3 head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build preview
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: CF_PAGES=1 npm run build

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 2; }

      - name: Deploy Cloudflare preview
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: exam-study-app
          PREVIEW_BRANCH: acceptance-v8
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA"
          npx wrangler@4 pages deployment list \
            --project-name "$PROJECT_NAME" \
            --environment preview \
            --json > /tmp/pages-deployments.json
          node <<'NODE'
          const fs = require('fs');
          const deployments = JSON.parse(fs.readFileSync('/tmp/pages-deployments.json', 'utf8'));
          const latest = Array.isArray(deployments) ? deployments[0] : null;
          const url = latest?.url || 'https://acceptance-v8.exam-study-app.pages.dev';
          console.log(`ACCEPTANCE_PREVIEW_URL=${url}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## PR3 acceptance preview\n\n${url}\n\nSource: \`${process.env.GITHUB_HEAD_REF}\` @ \`${process.env.GITHUB_SHA}\`\n`);
          NODE
