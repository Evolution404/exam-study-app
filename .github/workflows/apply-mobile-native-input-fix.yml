name: Apply mobile native input containment fix

on:
  push:
    branches:
      - fix/mobile-native-input-overflow-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mobile-native-input-overflow-20260917
          fetch-depth: 0
      - name: Apply shrink-safe native input layout
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/app/styles/base.css')
          text = base.read_text()
          marker = 'button,input,textarea { font:inherit; }\n'
          replacement = marker + '\n/* Native date/time controls keep an intrinsic width in Safari/WebKit.\n   They must always be allowed to shrink inside responsive grid/flex tracks. */\ninput:is([type="date"],[type="datetime-local"],[type="time"],[type="month"],[type="week"]) { min-width:0; max-width:100%; }\n'
          if text.count(marker) != 1:
              raise SystemExit(f'base marker count={text.count(marker)}')
          base.write_text(text.replace(marker, replacement, 1))

          search = Path('src/app/search/search-main-2.css')
          text = search.read_text()
          old = '.search-filter-range,.search-filter-date-range{display:grid;gap:6px;color:var(--color-text-muted);font-size:10px}\n.search-filter-range>span:last-child,.search-filter-date-range>div{display:grid;grid-template-columns:1fr 1fr;gap:7px}'
          new = '.search-filter-range,.search-filter-date-range{min-width:0;display:grid;gap:6px;color:var(--color-text-muted);font-size:10px}\n.search-filter-range>span:last-child,.search-filter-date-range>div{min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}'
          if text.count(old) != 1:
              raise SystemExit(f'search date grid marker count={text.count(old)}')
          search.write_text(text.replace(old, new, 1))

          bank = Path('src/app/bank/bank-main-3.css')
          text = bank.read_text()
          old = '.bank-custom-range label{display:grid;gap:5px;color:var(--color-text-muted);font-size:9px}'
          new = '.bank-custom-range label{min-width:0;display:grid;gap:5px;color:var(--color-text-muted);font-size:9px}'
          if text.count(old) != 1:
              raise SystemExit(f'bank date label marker count={text.count(old)}')
          bank.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/apply-mobile-native-input-fix.yml
          git add src/app/styles/base.css src/app/search/search-main-2.css src/app/bank/bank-main-3.css
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: contain native date controls on narrow screens"
          git push origin HEAD:fix/mobile-native-input-overflow-20260917
