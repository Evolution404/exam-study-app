name: PR27 Answer Detail Regression

on:
  push:
    branches:
      - fix/question-detail-answer-duplication

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/question-detail-answer-duplication
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply answer-detail regression fix
        run: |
          node <<'NODE'
          const fs = require('fs');

          const detailPath = 'src/app/bank/question-detail.tsx';
          let detail = fs.readFileSync(detailPath, 'utf8');
          const oldShort = '{detailSolution.kind === "short" && <section className="search-answer-card"><strong>参考答案</strong><p>{detailSolution.referenceText}</p></section>}';
          const newShort = '{detailSolution.kind === "short" && <section className="search-answer-card"><strong>参考答案</strong><p>{detailSolution.referenceText}</p>{answer && <p>{answerLabel}：{answer.submitted ? answer.selected.length ? [...answer.selected].sort().join("") : "不会" : "未作答"}</p>}</section>}';
          const oldGeneric = '<section className="search-answer-card"><strong>正确答案：{answerText(question)}</strong><p><MathText text={answerText(question)} languageText={question.stem} /></p>{answer && <p>{answerLabel}：{answer.submitted ? answer.selected.length ? question.type === "计算" ? formatCalculationAnswers(answer.selected) : [...answer.selected].sort().join("") : "不会" : "未作答"}</p>}</section>';
          const newGeneric = '{detailSolution.kind !== "short" && <section className="search-answer-card"><strong>正确答案</strong><p><MathText text={answerText(question)} languageText={question.stem} /></p>{answer && <p>{answerLabel}：{answer.submitted ? answer.selected.length ? question.type === "计算" ? formatCalculationAnswers(answer.selected) : [...answer.selected].sort().join("") : "不会" : "未作答"}</p>}</section>}';
          if (!detail.includes(oldShort)) throw new Error('short answer detail block not found');
          if (!detail.includes(oldGeneric)) throw new Error('generic answer detail block not found');
          detail = detail.replace(oldShort, newShort).replace(oldGeneric, newGeneric);
          fs.writeFileSync(detailPath, detail);

          const testPath = 'scripts/tests/test-search-filters.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const sourceMarker = 'const questionManagerSource = fs.readFileSync(new URL("../../src/app/bank/bank-library/question-manager.tsx", import.meta.url), "utf8");\n';
          if (!test.includes(sourceMarker)) throw new Error('question manager source marker not found');
          test = test.replace(sourceMarker, sourceMarker + 'const questionDetailSource = fs.readFileSync(new URL("../../src/app/bank/question-detail.tsx", import.meta.url), "utf8");\n');
          const assertionMarker = 'assert.match(practiceViewSource, /本题按自评记录，参考答案见上方。/, "简答结果框不得重复整段参考答案");\n';
          if (!test.includes(assertionMarker)) throw new Error('short answer assertion marker not found');
          const assertions = [
            'assert.doesNotMatch(questionDetailSource, /<strong>正确答案：\\{answerText\\(question\\)\\}<\\/strong>/, "题目详情不得把正确答案正文同时塞进标题和正文");',
            'assert.match(questionDetailSource, /detailSolution\\.kind !== "short" && <section className="search-answer-card"><strong>正确答案<\\/strong><p><MathText text=\\{answerText\\(question\\)\\}/, "非简答题详情必须只用一个正确答案标题和一份正文");',
            'assert.match(questionDetailSource, /detailSolution\\.kind === "short" && <section className="search-answer-card"><strong>参考答案<\\/strong><p>\\{detailSolution\\.referenceText\\}<\\/p>/, "简答题详情必须只保留一个参考答案卡片");',
            'assert.equal((questionDetailSource.match(/answerText\\(question\\)/g) ?? []).length, 1, "题目详情标准答案正文只能渲染一次");',
          ].join('\n') + '\n';
          test = test.replace(assertionMarker, assertionMarker + assertions);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Fast checks
        run: npm run test:fast
      - name: CSS architecture
        run: node scripts/tools/check-css-architecture.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          rm .github/workflows/pr27-answer-detail-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/bank/question-detail.tsx scripts/tests/test-search-filters.ts .github/workflows/pr27-answer-detail-regression.yml
          git commit -m "fix: render question detail answer once"
          git push origin HEAD:fix/question-detail-answer-duplication
