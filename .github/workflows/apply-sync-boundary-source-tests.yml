name: Apply sync boundary source tests

on:
  push:
    branches: [refactor/sync-ui-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[sync-test-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/sync-ui-boundary
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply test migration when needed
        run: |
          if grep -q 'sync application owns the v7 change-set implementation dependency' scripts/tests/test-sync-event-ui.ts; then
            echo 'sync boundary source tests already migrated'
          else
            node scripts/tools/fix-sync-boundary-source-tests.mjs
          fi
      - run: npm run test:sync-event-ui
      - run: npm run test:v7-ui
      - run: npm run test:answer-ui
      - name: Commit migrated tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/tests/test-sync-event-ui.ts scripts/tests/test-v7-ui-data-flow.ts
          git diff --cached --quiet && exit 0
          git commit -m 'test(sync): align source tests with application boundary [sync-test-generated]'
          git push origin HEAD:refactor/sync-ui-boundary
