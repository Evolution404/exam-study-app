name: Temporary latest-only semantic audit
on:
  push:
    branches: [refactor/remove-obsolete-compat]
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - name: Semantic compatibility terms
        run: |
          echo '=== priority exact residues ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'questionSolution\(|legacyAnswerForSolution|readBlobWireSize|normalizeSyncCheckpointV7|normalizeStateAliases|storedSize[[:space:]]*\?\?|practiceRunStats.*\?\?' src scripts || true
          echo '=== readBlob callsites ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'readBlob(' src scripts || true
          echo '=== SyncV7BlobExpectation callsites ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=dist 'SyncV7BlobExpectation' src scripts || true
          echo '=== old-data wording in production ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist --exclude='*.map' 'legacy|migrat|compatibil|one[- ]shot|旧数据|旧本地|历史回填|历史迁移' src || true
          echo '=== persisted Question answer references ==='
          grep -RInE --exclude-dir=node_modules --exclude-dir=dist '\b(question|canonical|mutation\.question)\.answer\b|QuestionV7[^\n]*answer' src scripts || true