name: Temporary latest-only final verifier
on:
  push:
    branches: [refactor/remove-obsolete-compat]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Apply final semantic cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'src/lib/question/question-utils.ts',
              '/** Strict accessor for the current canonical question format. */\nexport function questionSolution(question: Pick<QuestionV7, "solution">): QuestionSolution {\n  return question.solution;\n}\n\n',
              '',
              'remove redundant questionSolution accessor',
          )

          p = Path('src/lib/db/v7-types.ts')
          text = p.read_text()
          aliases = {
              'LegacyBankFolder': 'BaseBankFolder',
              'LegacyQuestionGroup': 'BaseQuestionGroup',
              'LegacySyncTombstone': 'BaseSyncTombstone',
              'LegacySyncFile': 'BaseSyncFile',
              'LegacySyncMeta': 'BaseSyncMeta',
              'LegacyBank': 'BaseBank',
              'LegacyNote': 'BaseNote',
          }
          for old, new in aliases.items():
              if old not in text: raise SystemExit(f'missing v7 type alias {old}')
              text = text.replace(old, new)
          p.write_text(text)

          replace_once(
              'src/lib/sync/github-sync-v7.ts',
              ' * facade with compatibility aliases.\n',
              ' * facade with convenience exports.\n',
              'sync facade comment',
          )

          replace_once(
              'src/lib/sync/sync-v8-history.ts',
              '  // v9-only: older checkpoints exist solely in unmigrated vaults, which the\n  // client rejects at the head; the one-time migration decodes them itself.\n  if (!isRecord(header) || header.formatVersion !== SYNC_V9_CHECKPOINT_FORMAT) {\n    throw new Error("远程检查点格式不是 v9，请先执行 v8→v9 数据仓库迁移。");\n  }',
              '  // Current clients accept only the v9 checkpoint envelope.\n  if (!isRecord(header) || header.formatVersion !== SYNC_V9_CHECKPOINT_FORMAT) {\n    throw new Error("远程检查点格式不是 v9；当前客户端只接受 v9 数据。");\n  }',
              'strict v9 checkpoint error',
          )

          p = Path('src/lib/sync/sync-v7-codec.ts')
          text = p.read_text()
          replacements = {
              ' * the same content share one identity, and legacy plain-JSON objects written\n * before this codec stay readable forever.  Browsers without\n * CompressionStream simply keep writing plain JSON (the fallback format), so\n': ' * the same content share one identity. Browsers without CompressionStream\n * use plain JSON as the current wire format, so\n',
              '/** Encode logical JSON bytes for upload/storage: DEFLATE when possible, else\n *  the bytes unchanged (identical to the pre-codec wire format). */': '/** Encode logical JSON bytes for upload/storage: DEFLATE when possible, else\n *  keep the logical JSON bytes unchanged. */',
              '/** Decode stored/uploaded sync bytes back to the logical JSON bytes.  The zlib\n *  sniff makes this format-autodetecting: compressed and legacy plain objects\n *  decode through the same call. */': '/** Decode stored/uploaded sync bytes back to the logical JSON bytes. The zlib\n *  sniff lets compressed and current plain-JSON objects use the same call. */',
          }
          for old, new in replacements.items():
              if text.count(old) != 1: raise SystemExit(f'codec wording mismatch: {old[:40]}')
              text = text.replace(old, new)
          p.write_text(text)

          replace_once(
              'src/lib/sync/sync-v7-orchestrator.ts',
              '  // Legacy image-only writes can still add one fallback change-set during\n  // upload, so the variable must be able to switch to the push layout below.\n',
              '  // Image uploads can add a pending change-set during upload, so the\n  // variable must be able to switch to the push layout below.\n',
              'image upload comment',
          )

          replace_once(
              'src/platform/runtime.ts',
              '        // Keep this order stable: synchronous legacy getters read mirrors after\n',
              '        // Keep this order stable: synchronous config getters read mirrors after\n',
              'runtime getter comment',
          )

          p = Path('src/platform/github-transport.ts')
          text = p.read_text()
          old = '''/**
           * Normalize a persisted endpoint for the active platform. Only the old
           * same-origin default is migrated in native iOS; arbitrary user endpoints
           * remain untouched.
           */'''
          new = '''/** Resolve the configured endpoint, or use the active platform default. */'''
          if text.count(old) != 1: raise SystemExit('transport comment mismatch')
          text = text.replace(old, new)
          old_line = '  if (transport.defaultApiBaseUrl === GITHUB_RELAY_URL && value === GITHUB_WEB_RELAY_PATH) return GITHUB_RELAY_URL;\n'
          if text.count(old_line) != 1: raise SystemExit('transport persisted-default conversion mismatch')
          text = text.replace(old_line, '')
          p.write_text(text)

          p = Path('scripts/tests/test-platform-transport.ts')
          text = p.read_text()
          old = 'assert.equal(resolveGitHubApiBaseUrl(GITHUB_WEB_RELAY_PATH, nativeTransport), GITHUB_RELAY_URL);\nassert.equal(resolveGitHubApiBaseUrl("https://custom.example", nativeTransport), "https://custom.example");'
          new = 'assert.equal(resolveGitHubApiBaseUrl(undefined, nativeTransport), GITHUB_RELAY_URL);\nassert.equal(resolveGitHubApiBaseUrl(GITHUB_WEB_RELAY_PATH, nativeTransport), GITHUB_WEB_RELAY_PATH);\nassert.equal(resolveGitHubApiBaseUrl("https://custom.example", nativeTransport), "https://custom.example");'
          if text.count(old) != 1: raise SystemExit('transport test mismatch')
          p.write_text(text.replace(old, new))

          replace_once(
              'src/app/error-boundary.tsx',
              ' * Rendered outside AppShell so a failed IndexedDB migration still leaves the\n',
              ' * Rendered outside AppShell so a failed IndexedDB initialization still leaves the\n',
              'error boundary comment',
          )
          replace_once(
              'src/app/error-boundary.tsx',
              '启动或数据库迁移遇到问题。',
              '启动或数据库初始化遇到问题。',
              'error boundary message',
          )
          replace_once(
              'src/main.tsx',
              '  // A failed migration used to reject before React mounted, leaving a blank\n  // page. Keep this fallback outside AppShell so the user can retry without\n',
              '  // Bootstrap can reject before React mounts. Keep this recovery screen\n  // outside AppShell so the user can retry without\n',
              'bootstrap recovery comment',
          )

          p = Path('src/lib/sync/github-v7-remote.ts')
          text = p.read_text()
          old_interface = '''export interface SyncV7BlobExpectation {
            size: number;
            sha256: string;
            /** Path of the object, when known: JSON-kind objects travel through the
             *  DEFLATE envelope and are inflated before the integrity check; assets and
             *  unknown paths are verified as raw bytes. */
            path?: string;
            /** Actual compressed wire size when known. */
            storedSize?: number;
          }'''
          new_interface = '''export interface SyncV7ContentExpectation {
            size: number;
            sha256: string;
            /** Path of the object, when known: JSON-kind objects travel through the
             *  DEFLATE envelope and are inflated before the integrity check; assets and
             *  unknown paths are verified as raw bytes. */
            path?: string;
          }

          export interface SyncV7BlobExpectation extends SyncV7ContentExpectation {
            /** Required actual stored/wire size for descriptor-addressed blob reads. */
            storedSize: number;
          }'''
          if text.count(old_interface) != 1: raise SystemExit('blob expectation interface mismatch')
          text = text.replace(old_interface, new_interface)
          old = '    const existing = await this.readBlob(existingSha, { size, sha256, path: input.path });'
          new = '    const existing = await this.readBlob(existingSha, { size, storedSize: stored.byteLength, sha256, path: input.path });'
          if text.count(old) != 1: raise SystemExit('idempotent blob read expectation mismatch')
          text = text.replace(old, new)

          start = text.index('  async readBlob(blobSha: string, expected: SyncV7BlobExpectation, options?: SyncV7BlobReadOptions): Promise<Uint8Array>;')
          end = text.index('  readImmutableBlob(', start)
          new_read_block = '''  private async readBlobContent(blobSha: string, expectation: SyncV7ContentExpectation, readOptions?: SyncV7BlobReadOptions, wireSizeHint?: number): Promise<Uint8Array> {
            assertSha1(blobSha, "blobSha");
            assertSize(expectation.size, "blob size");
            assertSha256(expectation.sha256, "blob sha256");
            const response = await this.request(blobPath(this.owner, this.repo, blobSha), { method: "GET" }, GITHUB_V7_RAW_MEDIA_TYPE);
            this.requireOk(response, `read blob ${blobSha}`);
            const contentLength = Number(response.headers.get("content-length"));
            const totalBytes = Number.isFinite(contentLength) && contentLength > 0
              ? contentLength
              : wireSizeHint === undefined ? expectation.size : wireSizeHint;
            let raw: Uint8Array;
            if (!response.body) {
              raw = new Uint8Array(await response.arrayBuffer());
              readOptions?.onProgress?.(raw.byteLength, totalBytes);
            } else {
              const reader = response.body.getReader();
              const chunks: Uint8Array[] = [];
              let loadedBytes = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (!value?.byteLength) continue;
                chunks.push(value);
                loadedBytes += value.byteLength;
                readOptions?.onProgress?.(loadedBytes, totalBytes);
              }
              raw = new Uint8Array(loadedBytes);
              let offset = 0;
              for (const chunk of chunks) { raw.set(chunk, offset); offset += chunk.byteLength; }
              if (!loadedBytes) readOptions?.onProgress?.(0, totalBytes);
            }
            let content: Uint8Array;
            try {
              content = isJsonSyncPath(expectation.path) ? await decodeSyncV7JsonBytes(raw) : raw;
            } catch {
              throw new SyncV7BlobIntegrityError("sha256", expectation.sha256, "unreadable deflate envelope");
            }
            if (content.byteLength !== expectation.size) throw new SyncV7BlobIntegrityError("size", expectation.size, content.byteLength);
            const sha256 = await digestHex(content);
            if (sha256 !== expectation.sha256) throw new SyncV7BlobIntegrityError("sha256", expectation.sha256, sha256);
            return content;
          }

          async readBlob(blobSha: string, expected: SyncV7BlobExpectation, options?: SyncV7BlobReadOptions): Promise<Uint8Array>;
          async readBlob(descriptor: SyncV7Descriptor, options?: SyncV7BlobReadOptions): Promise<Uint8Array>;
          async readBlob(blobShaOrDescriptor: string | SyncV7Descriptor, expectedOrOptions?: SyncV7BlobExpectation | SyncV7BlobReadOptions, options?: SyncV7BlobReadOptions): Promise<Uint8Array> {
            const blobSha = typeof blobShaOrDescriptor === "string" ? blobShaOrDescriptor : blobShaOrDescriptor.blobSha;
            const expectation = typeof blobShaOrDescriptor === "string" ? expectedOrOptions as SyncV7BlobExpectation | undefined : blobShaOrDescriptor;
            const readOptions = typeof blobShaOrDescriptor === "string" ? options : expectedOrOptions as SyncV7BlobReadOptions | undefined;
            if (!blobSha || !expectation) throw new TypeError("blob SHA, size, storedSize and sha256 are required");
            const path = typeof blobShaOrDescriptor === "string" ? expectation.path : blobShaOrDescriptor.path;
            if (typeof blobShaOrDescriptor !== "string") {
              const kind = inferKind(blobShaOrDescriptor.path);
              assertSyncV7Path(blobShaOrDescriptor.path, kind);
              if (/\/([a-f0-9]{64})\.(?:json|webp|jpg|jpeg|png|bin)$/.exec(blobShaOrDescriptor.path)?.[1] !== blobShaOrDescriptor.sha256) throw new SyncV7BlobIntegrityError("sha256", blobShaOrDescriptor.sha256, "path digest mismatch");
            }
            return this.readBlobContent(blobSha, { size: expectation.size, sha256: expectation.sha256, path }, readOptions, expectation.storedSize);
          }

          '''
          text = text[:start] + new_read_block + text[end:]
          old = '  async readImmutableContents(path: string, expected: SyncV7BlobExpectation): Promise<Uint8Array> {\n    assertSyncV7Path(path, inferKind(path));\n    return this.readBlob(await this.readContentsMetadata(path), { ...expected, path });\n  }'
          new = '  async readImmutableContents(path: string, expected: SyncV7ContentExpectation): Promise<Uint8Array> {\n    assertSyncV7Path(path, inferKind(path));\n    return this.readBlobContent(await this.readContentsMetadata(path), { ...expected, path });\n  }'
          if text.count(old) != 1: raise SystemExit('readImmutableContents contract mismatch')
          text = text.replace(old, new)
          p.write_text(text)

          p = Path('scripts/tests/test-github-v7-remote.ts')
          text = p.read_text()
          old = 'const loaded = await remote.readBlob(uploaded.blobSha, { size: segmentBytes.byteLength, sha256: digest(segmentBytes), path: segmentPath });\nassert.deepEqual([...loaded], [...segmentBytes]);\nawait assert.rejects(remote.readBlob(uploaded.blobSha, { size: segmentBytes.byteLength + 1, sha256: digest(segmentBytes), path: segmentPath }), SyncV7BlobIntegrityError);'
          new = 'const loaded = await remote.readBlob(uploaded.blobSha, { size: segmentBytes.byteLength, storedSize: uploaded.storedSize, sha256: digest(segmentBytes), path: segmentPath });\nassert.deepEqual([...loaded], [...segmentBytes]);\nawait assert.rejects(remote.readBlob(uploaded.blobSha, { size: segmentBytes.byteLength + 1, storedSize: uploaded.storedSize, sha256: digest(segmentBytes), path: segmentPath }), SyncV7BlobIntegrityError);'
          if text.count(old) != 1: raise SystemExit('remote test storedSize mismatch')
          p.write_text(text.replace(old, new))

          replace_once(
              'src/lib/practice/practice-metrics.ts',
              '// 未作答回退 abandonedAt/startedAt。结构化入参避免组件层与 db 层的类型耦合。',
              '// 未作答时依次采用 abandonedAt/startedAt。结构化入参避免组件层与 db 层的类型耦合。',
              'practice activity comment',
          )

          p = Path('scripts/tests/test-sync-v7-checkpoint-extra.ts')
          text = p.read_text()
          text = text.replace('const legacy = structuredClone(current) as SyncCheckpointV7 & { formatVersion: number };', 'const unsupported = structuredClone(current) as SyncCheckpointV7 & { formatVersion: number };')
          text = text.replace('legacy.formatVersion = 6;', 'unsupported.formatVersion = 6;')
          text = text.replace('validateSyncCheckpointV7(legacy)', 'validateSyncCheckpointV7(unsupported)')
          text = text.replace('JSON.stringify(legacy)', 'JSON.stringify(unsupported)')
          text = text.replace('"v6 checkpoint must be rejected after compatibility retirement"', '"v6 checkpoint must be rejected by the current-only validator"')
          p.write_text(text)
          PY
      - run: npm ci
      - run: npm run test:sync
      - run: npm run test:fast
      - run: npm run build
      - run: npm run lint:dead-code
      - run: node scripts/tools/check-architecture.mjs
      - run: node scripts/tools/check-export-surface.mjs
      - name: Workflow hygiene without verifier itself
        run: |
          mv .github/workflows/tmp-latest-only-semantic-audit.yml /tmp/tmp-latest-only-semantic-audit.yml
          node scripts/tools/check-workflow-hygiene.mjs
          mv /tmp/tmp-latest-only-semantic-audit.yml .github/workflows/tmp-latest-only-semantic-audit.yml
      - name: Verify current-only residues
        run: |
          git diff --check
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'questionSolution\(|legacyAnswerForSolution|readBlobWireSize|normalizeSyncCheckpointV7|normalizeStateAliases|storedSize[[:space:]]*\?\?' src scripts
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=dist '\b(question|canonical|mutation\.question)\.answer\b|QuestionV7[^\n]*answer' src scripts
          ! grep -RInE --exclude-dir=node_modules --exclude-dir=dist 'v8→v9 数据仓库迁移|LegacyBank|LegacyNote|LegacySync|same-origin default is migrated' src scripts
          test "$(find . -type f -name 'tmp-latest-only-*' ! -path './.github/workflows/tmp-latest-only-semantic-audit.yml' -print -quit)" = ""
      - name: Commit verified semantic cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts
          git diff --cached --check
          git commit -m "refactor: remove final historical compatibility semantics [latest-only-verified]"
          git push origin HEAD:refactor/remove-obsolete-compat