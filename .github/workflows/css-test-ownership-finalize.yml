name: CSS Test Ownership Finalize

on:
  push:
    branches: [refactor/search-residual-ownership]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[css-test-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/search-residual-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Update CSS source-shape ownership tests
        shell: python
        run: |
          from pathlib import Path

          recursive_scan = '''const appStylesRoot = new URL("../../src/app/", import.meta.url);
          const cssFiles = (await readdir(appStylesRoot, { recursive: true }))
            .filter((file) => file.endsWith(".css"))
            .sort();
          const styles = (await Promise.all(cssFiles.map((file) => readFile(new URL(file, appStylesRoot), "utf8")))).join("\\n");'''.replace('          ', '')

          p = Path('scripts/tests/test-note-markdown.ts')
          s = p.read_text()
          old_scan = '''const stylesRoot = new URL("../../src/app/styles/", import.meta.url);
          const styles = (await Promise.all((await readdir(stylesRoot))
            .filter((file) => file.endsWith(".css"))
            .sort()
            .map((file) => readFile(new URL(file, stylesRoot), "utf8")))).join("\\n");'''.replace('          ', '')
          if old_scan not in s:
              raise SystemExit('note-markdown legacy styles-only scan block not found')
          s = s.replace(old_scan, recursive_scan, 1)
          old_dark = '''// --- 防回退：夜间全站 input !important 不得污染透明输入框 --------------------
          // 夜间 input 规则强制深色底；搜索类输入框必须显式补 transparent!important。
          assert.match(
            styles,
            /html\\[data-theme="dark"\\] :is\\([^)]*\\.searchbox input[^)]*\\.search-home-query input[^)]*\\)\\{background:transparent!important\\}/,
            "夜间模式搜索类 input 保持透明底（容器/input 无色差）",
          );'''.replace('          ', '')
          new_dark = '''// --- 防回退：夜间通用 input 允许 feature 自己声明透明背景 --------------------
          assert.match(styles, /background:var\\(--dark-input-bg,var\\(--p-111813\\)\\)!important/, "夜间通用 input 背景支持 feature override");
          assert.match(styles, /\\.searchbox \\{[^}]*--dark-input-bg:transparent/, "快速搜索在 Search ownership 内声明透明夜间输入背景");
          assert.match(styles, /\\.search-home-query \\{[^}]*--dark-input-bg:transparent/, "搜索页主输入框在 Search ownership 内声明透明夜间输入背景");
          assert.doesNotMatch(styles, /html\\[data-theme="dark"\\][^{]*(?:\\.searchbox input|\\.search-home-query input)/, "Search 不得重新引入集中式 dark input patch");'''.replace('          ', '')
          if old_dark not in s:
              raise SystemExit('legacy centralized Search dark-input assertion not found')
          s = s.replace(old_dark, new_dark, 1)
          s = s.replace('/\\.search-home-query \\{ position:sticky; top:0; z-index:19/', '/\\.search-home-query \\{[^}]*position:sticky; top:0; z-index:19/')
          s = s.replace('/\\.search-home-query \\{ position:sticky; top:0; z-index:19; min-height:var\\(--search-query-h\\);[^}]*border-radius:15px/', '/\\.search-home-query \\{[^}]*position:sticky; top:0; z-index:19; min-height:var\\(--search-query-h\\);[^}]*border-radius:15px/')
          p.write_text(s)

          p = Path('scripts/tests/test-press-intent.ts')
          s = p.read_text()
          old_press_scan = '''const stylesRoot = new URL("../../src/app/styles/", import.meta.url);
          const styles = (await Promise.all((await readdir(stylesRoot))
            .filter((file) => file.endsWith(".css"))
            .sort()
            .map((file) => readFile(new URL(file, stylesRoot), "utf8")))).join("\\n");'''.replace('          ', '')
          if old_press_scan not in s:
              raise SystemExit('press-intent legacy styles-only scan block not found')
          s = s.replace(old_press_scan, recursive_scan, 1)
          old_assert = 'assert.match(styles, /\\.quick-sync-split \\.quick-sync\\.holding\\{color:var\\(--p-fff\\);background:var\\(--color-danger\\)\\}/, "holding the quick-sync button uses the tokenized white-on-danger surface");'
          new_assert = 'assert.match(styles, /\\.quick-sync\\.holding\\s*\\{[^}]*color:var\\(--color-danger\\)[^}]*background:var\\(--color-danger-soft\\)/, "holding the quick-sync button uses the semantic danger state");'
          if old_assert not in s:
              raise SystemExit('press-intent old tokenized white-on-danger assertion not found')
          p.write_text(s.replace(old_assert, new_assert, 1))
      - name: Verify migrated source-shape tests
        run: npm run test:note-markdown && npm run test:press-intent
      - name: Commit tests and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/css-test-ownership-finalize.yml
          git add scripts/tests/test-note-markdown.ts scripts/tests/test-press-intent.ts
          git commit -m "test(css): follow final feature ownership [css-test-finalized]"
          git push origin HEAD:refactor/search-residual-ownership
