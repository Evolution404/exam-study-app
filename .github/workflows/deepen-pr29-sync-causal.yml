name: Deepen PR29 sync safety causal

on:
  push:
    branches: [fix/ios-sync-local-install-progress]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-sync-local-install-progress
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Reuse verified patch with causal history fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/deepen-pr29-sync.yml').read_text()
          prefix = "          python3 - <<'PY'\n"
          suffix = "\n          PY\n"
          if prefix not in source:
              raise SystemExit('cannot locate original deterministic patch script')
          embedded = source.split(prefix, 1)[1].split(suffix, 1)[0]
          exec(compile(textwrap.dedent(embedded), 'deepen-pr29-sync.py', 'exec'))

          # The first fixture backdated run/attempt events to 2025 while their
          # bank/question dependencies were created in 2026. That intentionally
          # violates replay causality. Use normal event time and a future range
          # lower bound instead: ordinary ranged sync would exclude the record,
          # while explicit full restore must still recover it.
          p = Path('scripts/tests/test-sync-restore-question-types.ts')
          text = p.read_text()
          text = text.replace(
              '    bankId: bank.id, bankIds: [bank.id], questionIds: [fillQuestion.id],\n    startedAt: "2025-01-01T00:00:00.000Z", updatedAt: "2025-01-01T00:00:00.000Z",\n',
              '    bankId: bank.id, bankIds: [bank.id], questionIds: [fillQuestion.id],\n',
              1,
          )
          text = text.replace(
              '    correct: true, elapsedMs: 1000, createdAt: "2025-01-01T00:01:00.000Z",\n',
              '    correct: true, elapsedMs: 1000,\n',
              1,
          )
          text = text.replace('historySyncStart: "2026-01-01"', 'historySyncStart: "2027-01-01"', 1)
          p.write_text(text)

          # Full restore now deliberately ignores the configured history range,
          # but keep the result field for the UI contract; undefined means the
          # restore actually loaded all history.
          p = Path('src/lib/sync/sync-v7-orchestrator.ts')
          text = p.read_text()
          old_result = ', skippedArchivedPracticeRuns: downloaded.skippedArchivedPracticeRuns };'
          new_result = ', skippedArchivedPracticeRuns: downloaded.skippedArchivedPracticeRuns, historySyncStart: undefined };'
          if old_result not in text:
              raise SystemExit('full-restore result contract target missing')
          text = text.replace(old_result, new_result, 1)

          old_comment = '''// B5: serialize all in-realm callers of syncWithGitHub. Manual sync, auto-sync,\n// quick-sync and loadAttemptHistory all funnel here; a module-level mutex makes\n// concurrent calls share the single in-flight run instead of racing the claim /\n// install / head-CAS steps. (Cross-tab remains a Web Locks follow-up.)'''
          new_comment = '''// B5: coalesce all in-realm callers of syncWithGitHub. Manual sync, auto-sync,\n// quick-sync and loadAttemptHistory all funnel here; withSyncLock additionally\n// serializes pull/restore and extends the critical section across tabs/workers\n// whenever Web Locks are available.'''
          if old_comment not in text:
              raise SystemExit('cross-tab comment target missing')
          text = text.replace(old_comment, new_comment, 1)
          p.write_text(text)
          PY
      - run: npm ci
      - name: Incremental reconcile regression
        run: npm run test:sync-incremental-install
      - name: Full remote restore regression
        run: npm run test:sync-restore-question-types
      - name: Sync progress regression
        run: npm run test:sync-progress
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture and registration
        run: npm run test:architecture
      - name: Production build
        run: npm run build
      - name: Commit verified deep fixes
        shell: bash
        run: |
          git rm .github/workflows/deepen-pr29-sync.yml .github/workflows/deepen-pr29-sync-causal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db/db-v7-reconcile.ts src/lib/sync/sync-v7-orchestrator.ts scripts/tests/test-sync-incremental-install.ts scripts/tests/test-sync-restore-question-types.ts
          git commit -m "fix(sync): bound reconcile memory and harden full restore"
          git push origin HEAD:fix/ios-sync-local-install-progress
