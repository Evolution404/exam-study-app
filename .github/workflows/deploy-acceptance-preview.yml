name: Deploy acceptance preview

on:
  push:
    branches: [sync/v8-history-archive]
    paths-ignore: ['.preview/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acceptance-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR3 stack
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install, build and deploy preview
        id: preview
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: exam-study-app
          PREVIEW_BRANCH: acceptance-v8
        run: |
          set +e
          mkdir -p .preview
          exec > >(tee .preview/deploy.log) 2>&1
          echo "source_commit=$GITHUB_SHA"
          echo "source_branch=$GITHUB_REF_NAME"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: missing Cloudflare repository secrets"
            printf 'status=failed\nreason=missing-cloudflare-secrets\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt
            exit 2
          fi
          npm ci || { status=$?; printf 'status=failed\nreason=npm-ci\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt; exit "$status"; }
          npm run typecheck || { status=$?; printf 'status=failed\nreason=typecheck\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt; exit "$status"; }
          CF_PAGES=1 npm run build || { status=$?; printf 'status=failed\nreason=build\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt; exit "$status"; }
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA"
          status=$?
          if [ "$status" -ne 0 ]; then
            printf 'status=failed\nreason=cloudflare-deploy\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt
            exit "$status"
          fi
          npx wrangler@4 pages deployment list \
            --project-name "$PROJECT_NAME" \
            --environment preview \
            --json > /tmp/pages-deployments.json
          status=$?
          if [ "$status" -ne 0 ]; then
            printf 'status=failed\nreason=deployment-list\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt
            exit "$status"
          fi
          node <<'NODE'
          const fs = require('fs');
          const deployments = JSON.parse(fs.readFileSync('/tmp/pages-deployments.json', 'utf8'));
          const latest = Array.isArray(deployments) ? deployments[0] : null;
          const url = latest?.url || 'https://acceptance-v8.exam-study-app.pages.dev';
          fs.writeFileSync('.preview/acceptance-url.txt', `${url}\ncommit=${process.env.GITHUB_SHA}\nbranch=acceptance-v8\n`);
          fs.writeFileSync('.preview/deploy-status.txt', `status=success\nurl=${url}\ncommit=${process.env.GITHUB_SHA}\nbranch=acceptance-v8\n`);
          console.log(`ACCEPTANCE_PREVIEW_URL=${url}`);
          NODE

      - name: Publish preview diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .preview
          test -f .preview/deploy-status.txt || printf 'status=failed\nreason=workflow-stopped-before-deploy-step\ncommit=%s\n' "$GITHUB_SHA" > .preview/deploy-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .preview/deploy-status.txt .preview/deploy.log .preview/acceptance-url.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record acceptance preview deployment [skip ci]'
          git push origin HEAD:sync/v8-history-archive
