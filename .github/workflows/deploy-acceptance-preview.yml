name: Deploy acceptance preview

on:
  push:
    branches: [sync/v8-history-archive]
    paths-ignore: ['.preview/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acceptance-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR3 stack
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build preview
        run: CF_PAGES=1 npm run build

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 2; }

      - name: Deploy preview to existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: exam-study-app
          PREVIEW_BRANCH: acceptance-v8
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA"
          npx wrangler@4 pages deployment list \
            --project-name "$PROJECT_NAME" \
            --environment preview \
            --json > /tmp/pages-deployments.json
          node <<'NODE'
          const fs = require('fs');
          const deployments = JSON.parse(fs.readFileSync('/tmp/pages-deployments.json', 'utf8'));
          const latest = Array.isArray(deployments) ? deployments[0] : null;
          const url = latest?.url || 'https://acceptance-v8.exam-study-app.pages.dev';
          fs.mkdirSync('.preview', { recursive: true });
          fs.writeFileSync('.preview/acceptance-url.txt', `${url}\ncommit=${process.env.GITHUB_SHA}\nbranch=acceptance-v8\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Acceptance preview\n\n${url}\n\nCloudflare preview branch: \`acceptance-v8\`\n\nSource commit: \`${process.env.GITHUB_SHA}\`\n`);
          console.log(`ACCEPTANCE_PREVIEW_URL=${url}`);
          NODE

      - name: Publish preview URL marker
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .preview/acceptance-url.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: record acceptance preview URL [skip ci]'
          git push origin HEAD:sync/v8-history-archive
