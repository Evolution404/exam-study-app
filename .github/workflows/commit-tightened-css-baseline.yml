name: Commit tightened CSS baseline

on:
  push:
    branches:
      - fix/mobile-native-input-overflow-20260917

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mobile-native-input-overflow-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tighten CSS baseline
        run: |
          node scripts/tools/check-css-architecture.mjs
          git diff --check
          git diff -- scripts/tools/css-architecture-baseline.json
      - name: Commit baseline and remove one-shot workflow
        run: |
          git rm .github/workflows/commit-tightened-css-baseline.yml
          git add scripts/tools/css-architecture-baseline.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: tighten CSS architecture baseline"
          git push origin HEAD:fix/mobile-native-input-overflow-20260917
