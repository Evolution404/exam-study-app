name: Apply image sync boundary

on:
  push:
    branches: [refactor/sync-ui-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[image-sync-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/sync-ui-boundary
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migration
        run: |
          if grep -q 'downloadImageAssetFromGitHub' src/lib/sync/sync-application.ts; then
            echo 'image sync boundary already applied'
          else
            node scripts/tools/apply-sync-image-boundary.mjs
          fi
      - name: Report direct sync implementation imports
        run: grep -R -n -E '@/lib/sync/(github-sync|github-credentials|github-v7-remote|sync-v7-)' src/app || true
      - run: npm run typecheck
      - run: npm run test:architecture
      - name: Commit generated boundary changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/lib/sync/sync-application.ts src/app/bank/question-editor.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'refactor(sync): route image hydration through application [image-sync-generated]'
          git push origin HEAD:refactor/sync-ui-boundary
