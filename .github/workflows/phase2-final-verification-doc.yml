name: Phase 2 final verification doc

on:
  push:
    branches:
      - refactor/database-facts-projections-20260917

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-facts-projections-20260917
          fetch-depth: 0
      - name: Record verified Phase 2 gates
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = [
              (
                  Path('docs/HANDOFF.md'),
                  '- PR CI 的主测试 job 直接执行 `make test`；Chromium/WebKit 浏览器 smoke、Sync storage CI、Governance Audit、PR Preview 都是 Phase 2 最终门禁的一部分。\n',
                  '- PR CI 的主测试 job 直接执行 `make test`；Chromium/WebKit 浏览器 smoke、Sync storage CI、Governance Audit、PR Preview 都是 Phase 2 最终门禁的一部分。\n- 2026-09-17 Phase 2 代码验收基线 `1402459`：`make test`、Chromium、WebKit、Sync storage CI、Governance Audit、PR Preview 全部通过；依赖审计为 0 vulnerabilities。\n'
              ),
              (
                  Path('docs/DATABASE-ARCHITECTURE-REFACTOR-PLAN-2026-09-17.md'),
                  '- Phase 2 最终验收要求：`make test`、Chromium、WebKit、Sync storage CI、Governance Audit、PR Preview 在同一最新 HEAD 全绿。\n',
                  '- Phase 2 最终验收要求：`make test`、Chromium、WebKit、Sync storage CI、Governance Audit、PR Preview 在同一最新 HEAD 全绿。\n- 已验证代码基线 `1402459`：上述全部门禁通过，依赖审计 0 vulnerabilities；后续仅允许文档性收尾，仍不得进入 Phase 3。\n'
              ),
          ]
          for path, old, new in updates:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: verification insertion marker count={text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit docs and remove one-shot workflow
        run: |
          git rm .github/workflows/phase2-final-verification-doc.yml
          git add docs/HANDOFF.md docs/DATABASE-ARCHITECTURE-REFACTOR-PLAN-2026-09-17.md
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: record phase 2 verification"
          git push origin HEAD:refactor/database-facts-projections-20260917
