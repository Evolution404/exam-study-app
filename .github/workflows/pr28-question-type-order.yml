name: PR28 Question Type Order

on:
  push:
    branches:
      - fix/unify-question-type-order

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/unify-question-type-order
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply shared question type order
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # One canonical order for every UI surface and grouping operation.
          replace(
              "src/types/types.ts",
              'export type QuestionType = "判断" | "单选" | "多选" | "计算" | "填空" | "简答";\n',
              'export const QUESTION_TYPE_ORDER = ["单选", "多选", "判断", "计算", "填空", "简答"] as const;\nexport type QuestionType = (typeof QUESTION_TYPE_ORDER)[number];\n',
          )

          replace(
              "src/app/bank/question-editor.tsx",
              'import type { ContentBlock, QuestionSolution, QuestionV7, QuestionTypeV7 } from "@/lib/db/v7-types";\n',
              'import type { ContentBlock, QuestionSolution, QuestionV7, QuestionTypeV7 } from "@/lib/db/v7-types";\nimport { QUESTION_TYPE_ORDER } from "@/types/types";\n',
          )
          replace(
              "src/app/bank/question-editor.tsx",
              'const questionTypes: QuestionTypeV7[] = ["判断", "单选", "多选", "计算", "填空", "简答"];',
              'const questionTypes: QuestionTypeV7[] = [...QUESTION_TYPE_ORDER];',
          )

          replace(
              "src/app/practice/practice-setup.tsx",
              'import type { BankV7, QuestionTypeV7, ReviewRound } from "@/lib/db/v7-types";\n',
              'import type { BankV7, QuestionTypeV7, ReviewRound } from "@/lib/db/v7-types";\nimport { QUESTION_TYPE_ORDER } from "@/types/types";\n',
          )
          replace(
              "src/app/practice/practice-setup.tsx",
              'const questionTypes: QuestionTypeV7[] = ["单选", "多选", "判断", "计算", "填空", "简答"];',
              'const questionTypes: QuestionTypeV7[] = [...QUESTION_TYPE_ORDER];',
          )

          replace(
              "src/app/shell/helpers.ts",
              'import type { ActivePractice } from "@/types/types";\n',
              'import { QUESTION_TYPE_ORDER, type ActivePractice } from "@/types/types";\n',
          )
          replace(
              "src/app/shell/helpers.ts",
              'export const TYPE_ORDER: QuestionType[] = ["单选", "多选", "判断", "计算", "填空", "简答"];',
              'export const TYPE_ORDER: QuestionType[] = [...QUESTION_TYPE_ORDER];',
          )

          replace(
              "src/app/practice/practice-history.tsx",
              'import type { PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";\n',
              'import type { PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";\nimport { QUESTION_TYPE_ORDER } from "@/types/types";\n',
          )
          replace(
              "src/app/practice/practice-history.tsx",
              'const TYPE_ORDER: QuestionTypeV7[] = ["单选", "多选", "判断", "计算", "填空", "简答"];',
              'const TYPE_ORDER: QuestionTypeV7[] = [...QUESTION_TYPE_ORDER];',
          )

          replace(
              "src/lib/question/search-matching.ts",
              '/**\n * Pure search/index primitives shared by the search page, quick search and\n',
              'import { QUESTION_TYPE_ORDER, type QuestionType } from "../../types/types";\n\n/**\n * Pure search/index primitives shared by the search page, quick search and\n',
          )
          replace(
              "src/lib/question/search-matching.ts",
              'export type SearchQuestionType = "单选" | "多选" | "判断" | "计算" | "填空" | "简答";\nexport type SearchTypeTab = "全部" | SearchQuestionType;\n\nexport const SEARCH_TYPE_ORDER: readonly SearchQuestionType[] = ["单选", "多选", "判断", "计算", "填空", "简答"];',
              'export type SearchQuestionType = QuestionType;\nexport type SearchTypeTab = "全部" | SearchQuestionType;\n\nexport const SEARCH_TYPE_ORDER: readonly SearchQuestionType[] = QUESTION_TYPE_ORDER;',
          )

          replace(
              "src/app/bank/bank-library/question-manager.tsx",
              'import type { QuestionV7 } from "@/lib/db/v7-types";\n',
              'import type { QuestionV7 } from "@/lib/db/v7-types";\nimport { QUESTION_TYPE_ORDER } from "@/types/types";\n',
          )
          replace(
              "src/app/bank/bank-library/question-manager.tsx",
              'options={["全部", "单选", "多选", "判断", "填空", "简答", "计算"].map((value) => ({ value, label: value }))}',
              'options={["全部", ...QUESTION_TYPE_ORDER].map((value) => ({ value, label: value }))}',
          )

          replace(
              "src/app/bank/bank-library/bank-detail.tsx",
              'import { DashboardMetric, DashboardNumber, Distribution, PanelTitle, PriorityButton } from "./bank-dashboard-widgets";\n',
              'import { DashboardMetric, DashboardNumber, Distribution, PanelTitle, PriorityButton } from "./bank-dashboard-widgets";\nimport { QUESTION_TYPE_ORDER } from "@/types/types";\n\nconst QUESTION_TYPE_COLORS: Record<QuestionType, string> = {\n  单选: "#527f67",\n  多选: "#be8059",\n  判断: "#758b9d",\n  计算: "#8b6f9d",\n  填空: "#6f8a8f",\n  简答: "#a17865",\n};\n',
          )
          replace(
              "src/app/bank/bank-library/bank-detail.tsx",
              'const types = Object.fromEntries((["单选", "多选", "判断", "计算"] as QuestionType[]).map((type) => [type, questions.filter((question) => question.type === type).length])) as Record<QuestionType, number>;',
              'const types = Object.fromEntries(QUESTION_TYPE_ORDER.map((type) => [type, questions.filter((question) => question.type === type).length])) as Record<QuestionType, number>;',
          )
          replace(
              "src/app/bank/bank-library/bank-detail.tsx",
              '<Distribution label="单选" count={dashboard.types.单选} total={dashboard.total} color="#527f67" /><Distribution label="多选" count={dashboard.types.多选} total={dashboard.total} color="#be8059" /><Distribution label="判断" count={dashboard.types.判断} total={dashboard.total} color="#758b9d" /><Distribution label="计算" count={dashboard.types.计算} total={dashboard.total} color="#8b6f9d" />',
              '{QUESTION_TYPE_ORDER.map((type) => <Distribution key={type} label={type} count={dashboard.types[type]} total={dashboard.total} color={QUESTION_TYPE_COLORS[type]} />)}',
          )

          # Permanent regression contract: exact global order and no full six-type literal arrays outside its source of truth.
          replace(
              "scripts/tests/test-question-types.ts",
              'import { readFileSync } from "node:fs";\n',
              'import { readFileSync, readdirSync } from "node:fs";\nimport path from "node:path";\nimport { fileURLToPath } from "node:url";\nimport { QUESTION_TYPE_ORDER } from "../../src/types/types";\n',
          )
          replace(
              "scripts/tests/test-question-types.ts",
              'const vite = read("vite.config.ts");\n',
              'const vite = read("vite.config.ts");\nconst questionManager = read("src/app/bank/bank-library/question-manager.tsx");\nconst practiceSetup = read("src/app/practice/practice-setup.tsx");\nconst helpers = read("src/app/shell/helpers.ts");\nconst searchMatching = read("src/lib/question/search-matching.ts");\nconst bankDetail = read("src/app/bank/bank-library/bank-detail.tsx");\n',
          )
          replace(
              "scripts/tests/test-question-types.ts",
              'assert.match(editor, /questionTypes[^\\n]*"计算"/, "question editor must expose calculation questions");\nassert.match(editor, /"填空"/, "question editor must expose fill-in-the-blank questions");\nassert.match(editor, /"简答"/, "question editor must expose short-answer questions");\n',
              'assert.deepEqual([...QUESTION_TYPE_ORDER], ["单选", "多选", "判断", "计算", "填空", "简答"], "all question type surfaces must share the canonical order");\nassert.match(editor, /const questionTypes: QuestionTypeV7\\[\\] = \\[\\.\\.\\.QUESTION_TYPE_ORDER\\]/, "question editor must use the canonical question type order");\nassert.match(practiceSetup, /const questionTypes: QuestionTypeV7\\[\\] = \\[\\.\\.\\.QUESTION_TYPE_ORDER\\]/, "practice setup must use the canonical question type order");\nassert.match(helpers, /export const TYPE_ORDER: QuestionType\\[\\] = \\[\\.\\.\\.QUESTION_TYPE_ORDER\\]/, "practice overview and balanced sampling must use the canonical order");\nassert.match(history, /const TYPE_ORDER: QuestionTypeV7\\[\\] = \\[\\.\\.\\.QUESTION_TYPE_ORDER\\]/, "practice history grouping must use the canonical order");\nassert.match(searchMatching, /SEARCH_TYPE_ORDER: readonly SearchQuestionType\\[\\] = QUESTION_TYPE_ORDER/, "search tabs and result grouping must use the canonical order");\nassert.match(questionManager, /options=\\{\\["全部", \\.\\.\\.QUESTION_TYPE_ORDER\\]\\.map/, "question manager filter must put 全部 before the canonical type order");\nassert.match(bankDetail, /QUESTION_TYPE_ORDER\\.map\\(\\(type\\) => <Distribution/, "bank type distribution must include every question type in canonical order");\n\nconst srcRoot = fileURLToPath(new URL("../../src", import.meta.url));\nconst literalTypeArray = /\\[(?=[^\\]]{0,320}"单选")(?=[^\\]]{0,320}"多选")(?=[^\\]]{0,320}"判断")(?=[^\\]]{0,320}"计算")(?=[^\\]]{0,320}"填空")(?=[^\\]]{0,320}"简答")[^\\]]{0,320}\\]/gs;\nconst duplicateOrderFiles = readdirSync(srcRoot, { recursive: true, withFileTypes: true })\n  .filter((entry) => entry.isFile() && /\\.(?:ts|tsx)$/.test(entry.name))\n  .map((entry) => path.join(entry.parentPath, entry.name))\n  .filter((file) => !file.endsWith(path.join("src", "types", "types.ts")) && literalTypeArray.test(readFileSync(file, "utf8")));\nassert.deepEqual(duplicateOrderFiles, [], "full question-type lists must not duplicate or diverge from QUESTION_TYPE_ORDER");\n',
          )
          PY
      - name: Fast checks
        run: npm run test:fast
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/pr28-question-type-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/tests .github/workflows/pr28-question-type-order.yml
          git commit -m "fix: unify question type order"
          git push origin HEAD:fix/unify-question-type-order
