name: Phase 2 version label cleanup

on:
  push:
    branches:
      - refactor/database-facts-projections-20260917

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-facts-projections-20260917
          fetch-depth: 0
      - name: Remove stale version labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              Path('scripts/tests/test-ui-data-flow.ts'): [
                  ('invalid v7 checkpoint: missing run', 'invalid checkpoint: missing run'),
                  ('答题持久化入口只应调用一次 v7 record API', '答题持久化入口只应调用一次 record API'),
                  ('v7 UI/data-flow assertions passed', 'UI/data-flow assertions passed'),
              ],
              Path('scripts/tests/browser/helpers.mjs'): [
                  ('Pending change-sets (state pending|blocked) are the new sync queue; the v7\n  // event log no longer exists.',
                   'Pending change-sets (state pending|blocked) are the current sync queue;\n  // the historical event log no longer exists.'),
              ],
              Path('scripts/tests/browser/specs/desktop.mjs'): [
                  ('mock backend must hold the v8 head after a real sync',
                   'mock backend must hold the current head after a real sync'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              if re.search(r'(?<![A-Za-z0-9])[vV][78](?![A-Za-z0-9])', text):
                  raise SystemExit(f'{path}: stale v7/v8 label remains after cleanup')
              path.write_text(text)
          PY
          git diff --check
      - name: Commit cleanup and remove one-shot workflow
        run: |
          git rm .github/workflows/phase2-version-label-cleanup.yml
          git add scripts/tests/test-ui-data-flow.ts scripts/tests/browser/helpers.mjs scripts/tests/browser/specs/desktop.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: remove final versioned test labels"
          git push origin HEAD:refactor/database-facts-projections-20260917
