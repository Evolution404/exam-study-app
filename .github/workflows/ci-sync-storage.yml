name: Sync storage CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sync-v7-protocol
      - run: npx tsx scripts/tests/test-sync-v7-gc.ts
      - run: npx tsx scripts/tests/test-sync-v8-history.ts
