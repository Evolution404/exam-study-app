name: Sync storage CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sync-storage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:sync-protocol
      - run: npm run test:sync-gc
      - run: npm run test:sync-history
