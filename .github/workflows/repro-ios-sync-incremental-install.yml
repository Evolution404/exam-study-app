name: Reproduce iOS incremental install

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-sync-local-install-progress
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Apply final reconcile wiring
        run: python3 scripts/tools/finalize-ios-sync-reconcile.py
      - run: npm ci
      - name: Incremental install regression
        run: npm run test:sync-incremental-install
      - name: Sync progress regression
        run: npm run test:sync-progress
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture and test registration
        run: npm run test:architecture
      - name: Commit verified wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(sync): wire incremental reconcile progress"
          git push origin HEAD:fix/ios-sync-local-install-progress
