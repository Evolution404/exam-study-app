name: Reproduce iOS incremental install

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Reproduce ordinary delta triggering full restore
        run: npx tsx scripts/tests/test-sync-incremental-install.ts
