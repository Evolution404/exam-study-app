name: Regenerate XLSX Template Once

on:
  push:
    branches: [fix/xlsx-template-question-types]
    paths:
      - scripts/tools/generate-xlsx-template.mts
      - .github/workflows/regenerate-xlsx-template-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/xlsx-template-question-types
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Regenerate downloadable template
        run: npm run template:xlsx
      - name: Verify XLSX import and question types
        run: |
          npm run test:xlsx
          npm run test:question-types
      - name: Verify generated template content
        run: |
          node --input-type=module <<'NODE'
          import XLSX from 'xlsx';
          const workbook = XLSX.readFile('public/题库模板.xlsx', { cellFormula: true });
          const rows = XLSX.utils.sheet_to_json(workbook.Sheets['题库'], { header: 1, raw: false });
          const headers = rows[0] ?? [];
          if (!headers.includes('答案12')) throw new Error('模板缺少答案12列');
          const types = new Set(rows.slice(1).map((row) => row[1]).filter(Boolean));
          for (const type of ['单选', '多选', '判断', '计算', '填空', '简答']) {
            if (!types.has(type)) throw new Error(`模板缺少${type}示例`);
          }
          const instructions = XLSX.utils.sheet_to_json(workbook.Sheets['使用说明'], { header: 1, raw: false }).flat().join('\n');
          if (!instructions.includes('单选、多选、判断、计算、填空、简答')) throw new Error('使用说明未列出全部题型');
          if (!instructions.includes('||')) throw new Error('使用说明未说明填空题多答案分隔符');
          NODE
      - name: Commit regenerated workbook
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/题库模板.xlsx; then
            echo '模板二进制已是最新，无需提交。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/题库模板.xlsx
          git commit -m 'fix: regenerate current xlsx template'
          git push origin HEAD:fix/xlsx-template-question-types
