name: Immutable attempt cutover
on:
  push:
    branches: [refactor/database-projection-sync-v10-20260917]
    paths: [.github/workflows/immutable-attempt-cutover-one-shot.yml]
permissions:
  contents: write
jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-projection-sync-v10-20260917
          fetch-depth: 0
      - uses: ./.github/actions/node-deps
      - name: Remove mutable-attempt compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  if s.count(old)!=1:
                      raise SystemExit(f'{path}: expected exactly one match for {old[:80]!r}, got {s.count(old)}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('src/lib/sync/change-set-types.ts', [
            ('  | { kind: "attempt.create"; attempt: Attempt; reviewRoundId?: string }\n  | { kind: "attempt.update"; attempt: Attempt; reviewRoundId?: string }', '  | { kind: "attempt.create"; attempt: Attempt }'),
            ('      reviewRoundId?: string;\n    }\n  | {\n      kind: "practice.answer.updated";\n      attempt: Attempt;\n      answer: PracticeAnswer;\n      runId: string;\n      questionId: string;\n      reviewRoundId?: string;\n    }\n  | { kind: "practice.answer.deleted"; attemptId: string; runId: string; questionId: string; reviewRoundId?: string; deletedAt?: string }', '    }\n  | { kind: "practice.answer.deleted"; attemptId: string; runId: string; questionId: string; deletedAt?: string }'),
          ])
          patch('src/lib/sync/change-set-codec.ts', [
            ('  "attempt.create", "attempt.update", "attempt.delete", "practice.answer.submitted", "practice.answer.updated",', '  "attempt.create", "attempt.delete", "practice.answer.submitted",'),
            ('  if (value.kind === "attempt.create" || value.kind === "attempt.update") return hasObject("attempt");', '  if (value.kind === "attempt.create") return hasObject("attempt");'),
            ('  if (value.kind === "practice.answer.submitted" || value.kind === "practice.answer.updated") return hasObject("attempt") && hasObject("answer") && hasString("runId") && hasString("questionId");', '  if (value.kind === "practice.answer.submitted") return hasObject("attempt") && hasObject("answer") && hasString("runId") && hasString("questionId");'),
          ])
          patch('src/lib/sync/change-set-refs.ts', [
            ('    case "attempt.create": case "attempt.update": return [add("attempt", mutation.attempt.id), add("question", mutation.attempt.questionId)];', '    case "attempt.create": return [add("attempt", mutation.attempt.id), add("question", mutation.attempt.questionId)];'),
            ('    case "practice.answer.submitted": case "practice.answer.updated": return [add("attempt", mutation.attempt.id), add("practiceRun", mutation.runId), add("question", mutation.questionId)];', '    case "practice.answer.submitted": return [add("attempt", mutation.attempt.id), add("practiceRun", mutation.runId), add("question", mutation.questionId)];'),
          ])
          patch('src/lib/sync/change-set-planning.ts', [
            ('    case "attempt.create": case "attempt.update": return `保存作答记录 ${mutation.attempt.id}`;', '    case "attempt.create": return `保存作答记录 ${mutation.attempt.id}`;'),
            ('    case "practice.answer.updated": return `修改练习答案 ${mutation.questionId}`;\n', ''),
          ])
          patch('src/lib/sync/history-sync-range.ts', [
            ('    if (mutation.kind === "attempt.create" || mutation.kind === "attempt.update") return mutation.attempt.createdAt;', '    if (mutation.kind === "attempt.create") return mutation.attempt.createdAt;'),
            ('    if (mutation.kind === "practice.answer.submitted" || mutation.kind === "practice.answer.updated") return mutation.attempt.createdAt;', '    if (mutation.kind === "practice.answer.submitted") return mutation.attempt.createdAt;'),
          ])
          patch('src/lib/db/db-question-delete.ts', [
            ('          : mutation.kind === "attempt.create" || mutation.kind === "attempt.update" ? [mutation.attempt.questionId]', '          : mutation.kind === "attempt.create" ? [mutation.attempt.questionId]'),
          ])
          patch('src/app/sync/sync-event-manager.tsx', [
            ('  "attempt.update": "修改作答",\n', ''),
            ('  "practice.answer.updated": "修改练习答案",\n', ''),
          ])
          patch('src/lib/db/db-practice.ts', [
            ('      { kind: "practice.answer.submitted", attempt, answer, runId: input.runId, questionId: input.questionId, ...(reviewRoundId ? { reviewRoundId } : {}) },', '      { kind: "practice.answer.submitted", attempt, answer, runId: input.runId, questionId: input.questionId },'),
          ])

          # reducer: provenance lives on immutable Attempt only.
          p=Path('src/lib/sync/change-set-reducer.ts'); s=p.read_text()
          s=s.replace('  removeAttemptRound,\n','').replace('  upsertAttemptRound,\n','')
          old='''    case "attempt.create": case "attempt.update": {\n      ensureQuestion(projection, mutation.attempt.questionId);\n      if (mutation.kind === "attempt.create") rejectTombstoned(projection, "attempt", mutation.attempt.id);\n      if (mutation.attempt.elapsedMs < 0) fail("elapsedMs 不能为负数");\n      if (mutation.kind === "attempt.create" && byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 已存在`);\n      if (mutation.kind === "attempt.update" && !byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 不存在`);\n      setById(projection.attempts, mutation.attempt, mutation.kind === "attempt.create");\n      upsertAttemptRound(projection, mutation.attempt.id, mutation.reviewRoundId);\n      return;\n    }'''
          new='''    case "attempt.create": {\n      ensureQuestion(projection, mutation.attempt.questionId);\n      rejectTombstoned(projection, "attempt", mutation.attempt.id);\n      if (mutation.attempt.elapsedMs < 0) fail("elapsedMs 不能为负数");\n      if (mutation.attempt.reviewRoundId) ensureRound(projection, mutation.attempt.reviewRoundId);\n      if (byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 已存在`);\n      setById(projection.attempts, mutation.attempt);\n      return;\n    }'''
          if s.count(old)!=1: raise SystemExit('reducer attempt block mismatch')
          s=s.replace(old,new,1)
          s=s.replace('      removeAttemptRound(projection, mutation.attemptId);\n','')
          old='''    case "practice.answer.submitted": case "practice.answer.updated": {\n      const run = ensureRun(projection, mutation.runId);\n      ensureQuestion(projection, mutation.questionId);\n      if (mutation.kind === "practice.answer.submitted") rejectTombstoned(projection, "attempt", mutation.attempt.id);\n      if (mutation.attempt.runId !== mutation.runId || mutation.attempt.questionId !== mutation.questionId) fail("答案作答记录与 run/question 不一致");\n      if (mutation.kind === "practice.answer.submitted" && byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 已存在，提交必须使用新 id`);\n      if (mutation.kind === "practice.answer.updated" && !byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 不存在`);\n      setById(projection.attempts, mutation.attempt, mutation.kind === "practice.answer.submitted");\n      upsertAttemptRound(projection, mutation.attempt.id, mutation.reviewRoundId ?? run.reviewRoundId);\n      setById(projection.practiceRuns, runWithAnswer(run, mutation.questionId, mutation.answer), false);\n      return;\n    }'''
          new='''    case "practice.answer.submitted": {\n      const run = ensureRun(projection, mutation.runId);\n      ensureQuestion(projection, mutation.questionId);\n      rejectTombstoned(projection, "attempt", mutation.attempt.id);\n      if (mutation.attempt.runId !== mutation.runId || mutation.attempt.questionId !== mutation.questionId) fail("答案作答记录与 run/question 不一致");\n      if (mutation.attempt.reviewRoundId !== run.reviewRoundId) fail("答案作答轮次与练习记录不一致");\n      if (mutation.attempt.reviewRoundId) ensureRound(projection, mutation.attempt.reviewRoundId);\n      if (byId(projection.attempts, mutation.attempt.id)) fail(`作答 ${mutation.attempt.id} 已存在，提交必须使用新 id`);\n      setById(projection.attempts, mutation.attempt);\n      setById(projection.practiceRuns, runWithAnswer(run, mutation.questionId, mutation.answer), false);\n      return;\n    }'''
          if s.count(old)!=1: raise SystemExit('reducer answer block mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)

          # reducer-only attemptRoundIds is removed; Attempt.reviewRoundId is the fact.
          p=Path('src/lib/sync/change-set-projection-core.ts'); s=p.read_text()
          s=s.replace('  /** Attempt-to-round provenance is needed because Attempt is round-neutral. */\n  attemptRoundIds?: Record<string, string[]>;\n','')
          s=s.replace('    attemptRoundIds: clone(input.attemptRoundIds ?? {}),\n','')
          start=s.index('export function upsertAttemptRound(')
          end=s.index('\nexport function putTombstone', start)
          s=s[:start]+s[end+1:]
          s=s.replace('    attemptRoundIds: { ...base.attemptRoundIds },\n','')
          p.write_text(s)

          p=Path('src/lib/sync/change-set-derived.ts'); s=p.read_text()
          s=s.replace('  uniqueStrings,\n','')
          start=s.index('function deriveRoundProgress(')
          end=s.index('\n/** In-place recompute', start)
          replacement='''function deriveRoundProgress(projection: ChangeSetProjection): ReviewRoundProgress[] {\n  const roundsById = new Map(projection.reviewRounds.map((round) => [round.id, round]));\n  const grouped = new Map<string, ReviewRoundProgress>();\n  for (const attempt of sortAttempts(projection.attempts)) {\n    const roundId = attempt.reviewRoundId;\n    if (!roundId) continue;\n    if (!roundsById.has(roundId)) fail(`作答 ${attempt.id} 引用了不存在的轮次 ${roundId}`);\n    const key = `${roundId}:${attempt.questionId}`;\n    const current = grouped.get(key);\n    if (!current) {\n      grouped.set(key, {\n        key,\n        roundId,\n        questionId: attempt.questionId,\n        attempts: 1,\n        correct: attempt.correct ? 1 : 0,\n        wrong: attempt.correct ? 0 : 1,\n        firstAttemptAt: attempt.createdAt,\n        latestAttemptAt: attempt.createdAt,\n        giveUps: attempt.selected ? 0 : 1,\n        totalElapsedMs: Math.max(0, attempt.elapsedMs),\n        firstAttemptCorrect: attempt.correct,\n        hasBeenWrong: !attempt.correct,\n        currentCorrectStreak: attempt.correct ? 1 : 0,\n        correctStreakAfterWrong: 0,\n        recentOutcomes: [{ id: attempt.id, createdAt: attempt.createdAt, correct: attempt.correct, elapsedMs: Math.max(0, attempt.elapsedMs) }],\n      });\n      continue;\n    }\n    current.attempts += 1;\n    if (attempt.correct) current.correct += 1; else current.wrong += 1;\n    current.giveUps += attempt.selected ? 0 : 1;\n    current.totalElapsedMs += Math.max(0, attempt.elapsedMs);\n    current.hasBeenWrong ||= !attempt.correct;\n    current.currentCorrectStreak = attempt.correct ? current.currentCorrectStreak + 1 : 0;\n    current.correctStreakAfterWrong = current.hasBeenWrong ? current.currentCorrectStreak : 0;\n    current.recentOutcomes = [...current.recentOutcomes, { id: attempt.id, createdAt: attempt.createdAt, correct: attempt.correct, elapsedMs: Math.max(0, attempt.elapsedMs) }].slice(-32);\n    if (attempt.createdAt < current.firstAttemptAt) current.firstAttemptAt = attempt.createdAt;\n    if (attempt.createdAt > current.latestAttemptAt) current.latestAttemptAt = attempt.createdAt;\n  }\n  return [...grouped.values()].sort((a, b) => a.key.localeCompare(b.key));\n}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('src/lib/sync/change-set-cascade.ts'); s=p.read_text()
          s=s.replace('  const remainingAttemptIds = new Set(projection.attempts.map((attempt) => attempt.id));\n  projection.attemptRoundIds = Object.fromEntries(Object.entries(projection.attemptRoundIds ?? {}).filter(([id]) => remainingAttemptIds.has(id)));\n','')
          s=s.replace('  const attemptIds = new Set(projection.attempts.filter((attempt) => !keepQuestion(attempt.questionId)).map((attempt) => attempt.id));\n  projection.attempts = projection.attempts.filter((attempt) => keepQuestion(attempt.questionId));\n  projection.attemptRoundIds = Object.fromEntries(Object.entries(projection.attemptRoundIds ?? {}).filter(([attemptId]) => !attemptIds.has(attemptId)));\n','  projection.attempts = projection.attempts.filter((attempt) => keepQuestion(attempt.questionId));\n')
          p.write_text(s)

          p=Path('src/lib/sync/sync-dirty-install.ts'); s=p.read_text()
          s=s.replace('    case "attempt.create":\n    case "attempt.update":\n','    case "attempt.create":\n')
          s=s.replace('    case "practice.answer.submitted":\n    case "practice.answer.updated":\n','    case "practice.answer.submitted":\n')
          s=s.replace('  // union current and target question ids so a remote attempt.update that moves\n  // an attempt between questions cleans both derived sides.\n','  // Union current and target question ids for immutable attempt create/delete changes.\n')
          p.write_text(s)

          # Tests now model immutable attempt history and canonical round provenance.
          p=Path('scripts/tests/test-change-set.ts'); s=p.read_text()
          s=s.replace('const attempt = (id: string, correct: boolean): Attempt => ({ id, runId: run.id, questionId: "question-1", selected: correct ? "A" : "B", correct, elapsedMs: 10, createdAt: at, deviceId });', 'const attempt = (id: string, correct: boolean): Attempt => ({ id, runId: run.id, questionId: "question-1", reviewRoundId: round.id, selected: correct ? "A" : "B", correct, elapsedMs: 10, createdAt: at, deviceId });')
          s=s.replace('projection = reduceChangeSet(projection, await cs([{ kind: "practice.answer.submitted", attempt: attempt("attempt-1", false), answer: answer("event-1", false), runId: run.id, questionId: "question-1", reviewRoundId: round.id }]));', 'projection = reduceChangeSet(projection, await cs([{ kind: "practice.answer.submitted", attempt: attempt("attempt-1", false), answer: answer("event-1", false), runId: run.id, questionId: "question-1" }]));')
          old='''projection = reduceChangeSet(projection, await cs([{ kind: "practice.answer.updated", attempt: attempt("attempt-1", true), answer: answer("event-2", true), runId: run.id, questionId: "question-1", reviewRoundId: round.id }]));\nassert.equal(projection.attemptStats[0].correct, 1);\nassert.equal(projection.reviewRoundProgress[0].currentCorrectStreak, 1);\nprojection = reduceChangeSet(projection, await cs([{ kind: "practice.answer.deleted", attemptId: "attempt-1", runId: run.id, questionId: "question-1", reviewRoundId: round.id }]));'''
          new='''projection = reduceChangeSet(projection, await cs([{ kind: "practice.answer.submitted", attempt: attempt("attempt-2", true), answer: answer("event-2", true), runId: run.id, questionId: "question-1" }]));\nassert.equal(projection.attemptStats[0].total, 2);\nassert.equal(projection.attemptStats[0].correct, 1);\nassert.equal(projection.reviewRoundProgress[0].currentCorrectStreak, 1);\nprojection = reduceChangeSet(projection, await cs([\n  { kind: "practice.answer.deleted", attemptId: "attempt-2", runId: run.id, questionId: "question-1" },\n  { kind: "practice.answer.deleted", attemptId: "attempt-1", runId: run.id, questionId: "question-1" },\n]));'''
          if s.count(old)!=1: raise SystemExit('test-change-set immutable block mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/tests/test-projection-edge-cases.ts'); s=p.read_text()
          old='''  const updated = await reduce(after, { kind: "practice.answer.updated", attempt: { ...attempt, correct: false, selected: "B" }, answer: { ...answer, correct: false, selected: ["B"] }, runId: "r1", questionId: "q1" });\n  assert.equal(updated.attempts[0].correct, false);\n  assert.equal(updated.practiceRuns[0].answers.q1.correct, false);\n\n  const deleted = await reduce(updated, { kind: "practice.answer.deleted", attemptId: "a1", runId: "r1", questionId: "q1", deletedAt: AT });\n  assert.equal(deleted.attempts.length, 0);\n  assert.equal(deleted.practiceRuns[0].answers.q1, undefined);\n  assert.ok(deleted.tombstones.some((t) => t.entityType === "attempt" && t.entityId === "a1"));'''
          new='''  const secondAttempt = { ...attempt, id: "a2", correct: false, selected: "B" };\n  const updated = await reduce(after, { kind: "practice.answer.submitted", attempt: secondAttempt, answer: { ...answer, eventId: "e2", correct: false, selected: ["B"] }, runId: "r1", questionId: "q1" });\n  assert.equal(updated.attempts.length, 2);\n  assert.equal(updated.attempts.find((item) => item.id === "a1")?.correct, true, "earlier immutable attempt must remain unchanged");\n  assert.equal(updated.attempts.find((item) => item.id === "a2")?.correct, false);\n  assert.equal(updated.practiceRuns[0].answers.q1.correct, false);\n\n  const deletedLatest = await reduce(updated, { kind: "practice.answer.deleted", attemptId: "a2", runId: "r1", questionId: "q1", deletedAt: AT });\n  const deleted = await reduce(deletedLatest, { kind: "practice.answer.deleted", attemptId: "a1", runId: "r1", questionId: "q1", deletedAt: AT });\n  assert.equal(deleted.attempts.length, 0);\n  assert.equal(deleted.practiceRuns[0].answers.q1, undefined);\n  assert.ok(deleted.tombstones.some((t) => t.entityType === "attempt" && t.entityId === "a1"));'''
          if s.count(old)!=1: raise SystemExit('test-projection-edge immutable block mismatch')
          s=s.replace(old,new,1).replace('// answer submitted / updated / deleted','// answer submitted / immutable resubmission / deleted')
          p.write_text(s)

          p=Path('scripts/tests/test-sync-incremental-install.ts'); s=p.read_text()
          start=s.index('  // Attempt closure: moving an attempt between questions')
          end=s.index('\n  const cascadeKeys =', start)
          replacement='''  // Attempt closure: a new immutable attempt only dirties its own canonical key;\n  // local projections are rebuilt from the complete target facts, never trusted from wire arrays.\n  await resetDatabase();\n  const attemptQ1 = question("attempt-q1", "作答闭包旧题");\n  const attemptQ2 = question("attempt-q2", "作答闭包新题");\n  const attemptBank = { ...bankA, id: "attempt-bank", name: "Attempt", questionCount: 2 };\n  const round = { id: "round-1", name: "R", bankIds: [attemptBank.id], startedAt: "2026-08-30T00:00:00.000Z", status: "active" as const, createdAt: "2026-08-30T00:00:00.000Z", updatedAt: "2026-08-30T00:00:00.000Z", deviceId: "device-a" };\n  const run = { id: "run-1", bankId: attemptBank.id, bankIds: [attemptBank.id], bankName: "Attempt", mode: "sequential" as const, modeLabel: "练习", questionIds: [attemptQ1.id, attemptQ2.id], questionTypes: { [attemptQ1.id]: attemptQ1.type, [attemptQ2.id]: attemptQ2.type }, answers: {}, shuffleOptions: false, optionOrders: {}, startedAt: "2026-08-30T00:00:00.000Z", updatedAt: "2026-08-30T00:00:00.000Z", status: "in_progress" as const, revision: 0, reviewRoundId: round.id };\n  const oldAttempt = { id: "attempt-1", runId: run.id, questionId: attemptQ1.id, reviewRoundId: round.id, selected: "A", correct: false, elapsedMs: 1000, createdAt: "2026-08-30T00:00:01.000Z", deviceId: "device-a" };\n  const newAttempt = { ...oldAttempt, id: "attempt-2", questionId: attemptQ2.id, correct: true, createdAt: "2026-08-30T00:00:02.000Z", deviceId: "device-remote" };\n  const oldStats = { questionId: attemptQ1.id, total: 1, correct: 0, wrong: 1, giveUps: 0, totalElapsedMs: 1000, firstAttemptAt: oldAttempt.createdAt, firstAttemptCorrect: false, latestAttemptAt: oldAttempt.createdAt, hasBeenWrong: true, correctStreakAfterWrong: 0, currentCorrectStreak: 0, recentOutcomes: [{ id: oldAttempt.id, createdAt: oldAttempt.createdAt, correct: false, elapsedMs: 1000 }] };\n  const newStats = { questionId: attemptQ2.id, total: 1, correct: 1, wrong: 0, giveUps: 0, totalElapsedMs: 1000, firstAttemptAt: newAttempt.createdAt, firstAttemptCorrect: true, latestAttemptAt: newAttempt.createdAt, hasBeenWrong: false, correctStreakAfterWrong: 0, currentCorrectStreak: 1, recentOutcomes: [{ id: newAttempt.id, createdAt: newAttempt.createdAt, correct: true, elapsedMs: 1000 }] };\n  const oldDaily = { key: `2026-08-30:${attemptQ1.id}`, date: "2026-08-30", questionId: attemptQ1.id, total: 1, correct: 0, wrong: 1, giveUps: 0, totalElapsedMs: 1000 };\n  const newDaily = { key: `2026-08-30:${attemptQ2.id}`, date: "2026-08-30", questionId: attemptQ2.id, total: 1, correct: 1, wrong: 0, giveUps: 0, totalElapsedMs: 1000 };\n  const oldRoundProgress = { key: `${round.id}:${attemptQ1.id}`, roundId: round.id, questionId: attemptQ1.id, attempts: 1, correct: 0, wrong: 1, firstAttemptAt: oldAttempt.createdAt, latestAttemptAt: oldAttempt.createdAt, giveUps: 0, totalElapsedMs: 1000, firstAttemptCorrect: false, hasBeenWrong: true, currentCorrectStreak: 0, correctStreakAfterWrong: 0, recentOutcomes: oldStats.recentOutcomes };\n  const newRoundProgress = { key: `${round.id}:${attemptQ2.id}`, roundId: round.id, questionId: attemptQ2.id, attempts: 1, correct: 1, wrong: 0, firstAttemptAt: newAttempt.createdAt, latestAttemptAt: newAttempt.createdAt, giveUps: 0, totalElapsedMs: 1000, firstAttemptCorrect: true, hasBeenWrong: false, currentCorrectStreak: 1, correctStreakAfterWrong: 0, recentOutcomes: newStats.recentOutcomes };\n  await studyDb.banks.put(attemptBank);\n  await studyDb.questions.bulkPut([attemptQ1, attemptQ2]);\n  const runBundle = decomposePracticeRun(run, [oldAttempt]);\n  await studyDb.practiceRuns.put(runBundle.record);\n  await studyDb.practiceRunSources.bulkPut(runBundle.sources);\n  await studyDb.practiceRunItems.bulkPut(runBundle.items);\n  const { bankIds: _roundBankIds, finalQuestionIds: _roundItems, ...roundRecord } = round;\n  void _roundBankIds;\n  void _roundItems;\n  await studyDb.reviewRounds.put(roundRecord);\n  await studyDb.reviewRoundBanks.put({ roundId: round.id, bankId: attemptBank.id, position: 0 });\n  await studyDb.attempts.put(oldAttempt);\n  await studyDb.questionProgress.put(oldStats);\n  await studyDb.questionDailyProgress.put(oldDaily);\n  await studyDb.reviewRoundProgress.put(oldRoundProgress);\n  const attemptTarget: ChangeSetProjection = {\n    ...projection([attemptQ1, attemptQ2]),\n    banks: [attemptBank],\n    attempts: [oldAttempt, newAttempt],\n    attemptStats: [oldStats, newStats],\n    attemptDailyStats: [oldDaily, newDaily],\n    practiceRuns: [run],\n    reviewRounds: [round],\n    reviewRoundProgress: [oldRoundProgress, newRoundProgress],\n  } as ChangeSetProjection;\n  const attemptKeys = await deriveDirtyInstallKeys(attemptTarget, [changeSet([{ kind: "attempt.create", attempt: newAttempt }], 3)]);\n  assert.ok(attemptKeys);\n  assert.deepEqual(attemptKeys.attempts, [newAttempt.id]);\n  assert.deepEqual(attemptKeys.attemptStats, [attemptQ2.id]);\n  assert.deepEqual(attemptKeys.attemptDailyStats, [newDaily.key]);\n  assert.deepEqual(attemptKeys.reviewRoundProgress, [newRoundProgress.key]);\n  assert.equal(await installProjection(attemptTarget, { dirtyKeys: attemptKeys }), true);\n  assert.equal((await studyDb.attempts.get(oldAttempt.id))?.questionId, attemptQ1.id);\n  assert.equal((await studyDb.attempts.get(newAttempt.id))?.questionId, attemptQ2.id);\n  assert.equal((await studyDb.questionProgress.get(attemptQ1.id))?.wrong, 1);\n  assert.equal((await studyDb.questionProgress.get(attemptQ2.id))?.correct, 1);\n  assert.equal((await studyDb.questionDailyProgress.get([oldDaily.date, oldDaily.questionId]))?.questionId, attemptQ1.id);\n  assert.equal((await studyDb.questionDailyProgress.get([newDaily.date, newDaily.questionId]))?.questionId, attemptQ2.id);\n  assert.equal((await studyDb.reviewRoundProgress.get([oldRoundProgress.roundId, oldRoundProgress.questionId]))?.questionId, attemptQ1.id);\n  assert.equal((await studyDb.reviewRoundProgress.get([newRoundProgress.roundId, newRoundProgress.questionId]))?.questionId, attemptQ2.id);\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('scripts/tests/test-sync-gc.ts'); s=p.read_text().replace('  attemptRoundIds: {},\n','')
          p.write_text(s)
          PY
      - name: Verify immutable attempt cutover
        shell: bash
        run: |
          npm run typecheck
          npm run test:change-set
          npm run test:projection-edge
          npm run test:sync-incremental-install
          npm run test:sync-restore-full-claimed-guard
          if grep -RInE 'attempt\.update|practice\.answer\.updated|attemptRoundIds|upsertAttemptRound|removeAttemptRound|mutation\.reviewRoundId' src scripts/tests; then
            echo 'obsolete mutable-attempt compatibility remains' >&2
            exit 1
          fi
      - name: Commit cutover
        shell: bash
        run: |
          rm .github/workflows/immutable-attempt-cutover-one-shot.yml .github/workflows/audit-legacy-attempt-mutations.yml
