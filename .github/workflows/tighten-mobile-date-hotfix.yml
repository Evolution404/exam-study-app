name: Tighten mobile date hotfix

on:
  push:
    branches:
      - fix/mobile-native-input-overflow-20260917

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/mobile-native-input-overflow-20260917
          fetch-depth: 0
      - name: Keep only the structural fix and pay down CSS debt
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path('src/app/styles/base.css')
          text = base.read_text()
          added = '\n/* Native date/time controls keep an intrinsic width in Safari/WebKit.\n   They must always be allowed to shrink inside responsive grid/flex tracks. */\ninput:is([type="date"],[type="datetime-local"],[type="time"],[type="month"],[type="week"]) { min-width:0; max-width:100%; }\n'
          if text.count(added) != 1:
              raise SystemExit(f'global native-input addition count={text.count(added)}')
          base.write_text(text.replace(added, '\n', 1))

          bank = Path('src/app/bank/bank-main-3.css')
          text = bank.read_text()
          current = '.bank-custom-range label{min-width:0;display:grid;gap:5px;color:var(--color-text-muted);font-size:9px}'
          original = '.bank-custom-range label{display:grid;gap:5px;color:var(--color-text-muted);font-size:9px}'
          if text.count(current) != 1:
              raise SystemExit(f'bank label change count={text.count(current)}')
          bank.write_text(text.replace(current, original, 1))

          search = Path('src/app/search/search-main-2.css')
          text = search.read_text()
          redundant = '.search-filter-select-row .app-select-trigger{width:100%}\n'
          if text.count(redundant) != 1:
              raise SystemExit(f'redundant select width count={text.count(redundant)}')
          search.write_text(text.replace(redundant, '', 1))
          PY
          git diff --check
      - name: Commit tightened fix and remove workflow
        run: |
          git rm .github/workflows/tighten-mobile-date-hotfix.yml
          git add src/app/styles/base.css src/app/bank/bank-main-3.css src/app/search/search-main-2.css
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: constrain mobile date range without CSS debt"
          git push origin HEAD:fix/mobile-native-input-overflow-20260917
