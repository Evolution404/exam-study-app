name: Governance Audit

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "knip.json"
      - ".github/workflows/governance-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/code-css-governance-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Fetch PR merge metadata
        run: git fetch origin "refs/pull/${{ github.event.pull_request.number }}/merge"
      - name: Apply one-shot architecture migration when present
        run: |
          if [ -f scripts/tools/migrate-css-architecture-once.mjs ]; then
            node scripts/tools/migrate-css-architecture-once.mjs
          fi
          if [ -f scripts/tools/fix-split-style-tests-once.mjs ]; then
            node scripts/tools/fix-split-style-tests-once.mjs
          fi
      - name: Validate generated migration
        run: |
          npm run lint:css
          npm run test:fast
          npm run build
      - name: Commit generated migration when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: complete CSS architecture migration"
          git push origin HEAD:chore/code-css-governance-phase1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Structural dead-code gate
        run: npx knip --include files,dependencies,unlisted,unresolved
      - name: Export surface ratchet
        run: node scripts/tools/check-export-surface.mjs
      - name: Require committed export ratchet baseline
        run: git diff --exit-code -- scripts/tools/check-export-surface.mjs
      - name: CSS architecture ratchets
        run: node scripts/tools/check-css-architecture.mjs
      - name: Require committed CSS ratchet baseline
        run: git diff --exit-code -- scripts/tools/check-css-architecture.mjs
      - name: CSS governance baseline
        run: node scripts/tools/report-css-governance.mjs
