name: Governance Audit

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "knip.json"
      - ".github/workflows/governance-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Regenerate lockfile from package overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: refresh lockfile for patched uuid"
          git push origin "HEAD:${HEAD_REF}"
      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=moderate
      - name: Structural dead-code gate
        run: npx knip --include files,dependencies,unlisted,unresolved
      - name: Export surface ratchet
        run: node scripts/tools/check-export-surface.mjs
      - name: Require committed export ratchet baseline
        run: git diff --exit-code -- scripts/tools/check-export-surface.mjs
      - name: CSS architecture ratchets
        run: node scripts/tools/check-css-architecture.mjs
      - name: Require committed CSS ratchet baseline
        run: git diff --exit-code -- scripts/tools/check-css-architecture.mjs scripts/tools/css-architecture-baseline.json
      - name: CSS governance baseline
        run: node scripts/tools/report-css-governance.mjs
