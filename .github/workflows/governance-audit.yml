name: Governance Audit

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "knip.json"
      - ".github/workflows/governance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Strict dead-code audit
        run: npx knip --include files,exports,types,dependencies,unlisted,unresolved
      - name: CSS governance baseline
        if: always()
        run: node scripts/tools/report-css-governance.mjs
