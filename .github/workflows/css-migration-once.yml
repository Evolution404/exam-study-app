name: CSS Migration Once

on:
  push:
    branches:
      - chore/code-css-governance-phase1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply one-shot architecture migration
        run: node scripts/tools/migrate-css-architecture-once.mjs
      - name: CSS lint
        run: npm run lint:css
      - name: Fast checks
        run: npm run test:fast
      - name: Production build
        run: npm run build
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: complete CSS architecture migration"
          git push origin HEAD:chore/code-css-governance-phase1
