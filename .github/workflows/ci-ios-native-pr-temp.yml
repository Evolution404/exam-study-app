name: iOS Native Compile (temporary)

on:
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - ".github/workflows/ci-ios-native-pr-temp.yml"

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build and sync iOS web assets
        run: make ios-build
      - name: Compile iOS Simulator target
        run: make ios-build-simulator
