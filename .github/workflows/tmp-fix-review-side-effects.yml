name: Temporary side-effect fixes verifier
on:
  push:
    branches: [refactor/remove-obsolete-compat]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const edit = (path, fn) => { const before = fs.readFileSync(path, 'utf8'); const after = fn(before); if (after === before) throw new Error(`no change: ${path}`); fs.writeFileSync(path, after.endsWith('\n') ? after : `${after}\n`); };
          const one = (text, from, to, label) => { const count = text.split(from).length - 1; if (count !== 1) throw new Error(`${label}: ${count}`); return text.replace(from, to); };

          edit('src/lib/practice/practice-metrics.ts', text => {
            text = one(text, 'const QUALITY_FIRST_CORRECT = 0.9;\n', 'const QUALITY_FIRST_CORRECT = 0.9;\nconst QUALITY_TIMING_OUTLIER_CORRECT = 0.85;\n', 'timing constant');
            return one(text, '  if (!validBaselineElapsed(outcome.elapsedMs)) throw new Error("current difficulty outcomes require elapsedMs");\n', '  if (!validBaselineElapsed(outcome.elapsedMs)) return QUALITY_TIMING_OUTLIER_CORRECT;\n', 'timing outlier');
          });
          edit('scripts/tests/test-progress-metrics-boundaries.ts', text => one(text,
            '  assert.throws(() => difficultyFromOutcomes([{ correct: true, createdAt: T1, elapsedMs: Number.NaN }]), /elapsedMs/, "current outcomes reject invalid elapsedMs");\n',
            '  assert.throws(() => difficultyFromOutcomes([{ correct: true, createdAt: T1, elapsedMs: Number.NaN }]), /elapsedMs/, "current outcomes reject invalid elapsedMs");\n  assert.doesNotThrow(() => difficultyFromOutcomes([outcome(0, true, 20_000), outcome(13, true, 500)]), "sub-second valid timings must remain valid");\n  assert.doesNotThrow(() => difficultyFromOutcomes([outcome(0, true, 20_000), outcome(13, true, 25 * 60_000)]), "long valid timings must remain valid");\n', 'timing tests'));

          edit('src/lib/db/db-v7-question-import.ts', text => {
            text = one(text,
              '  if (record.kind === "choice") return Array.isArray(record.correctOptionIds) && record.correctOptionIds.every((id) => typeof id === "string" && id.length > 0);\n',
              '  if (record.kind === "choice") return Array.isArray(record.correctOptionIds) && record.correctOptionIds.length > 0 && record.correctOptionIds.every((id) => typeof id === "string" && id.length > 0) && new Set(record.correctOptionIds).size === record.correctOptionIds.length;\n', 'choice structure');
            return one(text, '  if (!solution || !solutionMatchesType(type, solution)) return undefined;\n',
              '  if (!solution || !solutionMatchesType(type, solution)) return undefined;\n  if (optionIds && new Set(optionIds).size !== optionIds.length) return undefined;\n  if (solution.kind === "choice") {\n    if (!optionIds?.length || !solution.correctOptionIds.length) return undefined;\n    const validOptionIds = new Set(optionIds);\n    if (new Set(solution.correctOptionIds).size !== solution.correctOptionIds.length || solution.correctOptionIds.some((id) => !validOptionIds.has(id))) return undefined;\n  }\n', 'choice membership');
          });
          edit('src/lib/sync/sync-v7-checkpoint-validation.ts', text => one(text,
            '    value.optionIds.forEach((id, optionIndex) => assertString(id, `state.questions[${index}].optionIds[${optionIndex}]`));\n  }\n  validateSolution(value.solution, `state.questions[${index}].solution`, value.type as QuestionV7["type"]);\n',
            '    value.optionIds.forEach((id, optionIndex) => assertString(id, `state.questions[${index}].optionIds[${optionIndex}]`));\n    if (new Set(value.optionIds as string[]).size !== value.optionIds.length) fail(`state.questions[${index}].optionIds must be unique`);\n  }\n  validateSolution(value.solution, `state.questions[${index}].solution`, value.type as QuestionV7["type"]);\n  if (value.solution.kind === "choice") {\n    if (!Array.isArray(value.optionIds)) fail(`state.questions[${index}].optionIds are required for choice questions`);\n    const validOptionIds = new Set(value.optionIds as string[]);\n    if (new Set(value.solution.correctOptionIds).size !== value.solution.correctOptionIds.length) fail(`state.questions[${index}].solution.correctOptionIds must be unique`);\n    value.solution.correctOptionIds.forEach((id) => { if (!validOptionIds.has(id)) fail(`state.questions[${index}].solution references missing option id ${id}`); });\n  }\n', 'checkpoint choice membership'));

          edit('scripts/tests/test-db-v7-extra.ts', text => one(text, 'await resetV7Database();\n\n',
            'await resetV7Database();\n\n// Current choice imports must contain at least one real option id.\n{\n  const base = { type: "单选", stem: "非法答案完整性", options: ["甲", "乙"], optionIds: ["opt-a", "opt-b"], tags: [] };\n  await assert.rejects(() => importQuestionBankV7("empty-choice.json", { questions: [{ ...base, solution: { kind: "choice", correctOptionIds: [] } }] }), /没有可导入的有效题目/);\n  await assert.rejects(() => importQuestionBankV7("missing-choice.json", { questions: [{ ...base, solution: { kind: "choice", correctOptionIds: ["missing"] } }] }), /没有可导入的有效题目/);\n  await assert.rejects(() => importQuestionBankV7("bad-letter.json", { questions: [{ ...base, solution: undefined, answer: "Z" }] }), /没有可导入的有效题目/);\n}\n\n', 'import integrity tests'));
          edit('scripts/tests/test-sync-v7-checkpoint-extra.ts', text => one(text, '// 5) 检查点不接受 blob 字段\n',
            '// 5) choice solution 必须引用当前题目的真实 option id\n{\n  const current = await createSyncCheckpointV7();\n  const invalid = structuredClone(current);\n  const question = invalid.state.questions[0]!;\n  question.type = "单选";\n  question.options = [[{ id: "choice-a", type: "text", text: "甲" }], [{ id: "choice-b", type: "text", text: "乙" }]];\n  question.optionIds = ["opt-a", "opt-b"];\n  question.solution = { kind: "choice", correctOptionIds: ["missing"] };\n  assert.throws(() => validateSyncCheckpointV7(invalid), /missing option id/, "checkpoint must reject missing choice option ids");\n}\n\n// 6) 检查点不接受 blob 字段\n', 'checkpoint integrity test'));

          for (const root of ['src', 'scripts']) {
            const walk = path => { for (const name of fs.readdirSync(path)) { const full = `${path}/${name}`; const stat = fs.statSync(full); if (stat.isDirectory()) walk(full); else if (/\.(?:ts|tsx|mjs|js)$/.test(name)) { let text = fs.readFileSync(full, 'utf8'); text = text.replaceAll('shijuan-study-device-id', 'shijuan-study-v7-device-id').replaceAll('shijuan-study-sequence', 'shijuan-study-v7-sequence'); fs.writeFileSync(full, text); } } };
            walk(root);
          }
          edit('scripts/tools/check-architecture.mjs', text => one(text,
            'if (/migrateLegacy|indexedDB\\.open|dropLegacyLocalDatabases|shijuan-study-v[67]/.test(dbV7Core)) {\n',
            'if (/migrateLegacy|indexedDB\\.open|dropLegacyLocalDatabases|["\u0027]shijuan-study-v[67]["\u0027]/.test(dbV7Core)) {\n', 'database namespace guard'));
          NODE
          git rm .github/workflows/tmp-fix-review-side-effects.yml
          ! grep -R --line-number --exclude-dir=node_modules 'shijuan-study-device-id\|shijuan-study-sequence' src scripts
          git diff --check
      - run: npm ci
      - name: Full verification
        run: |
          npm run test:sync
          npm run test:fast
          npm run build
          npm run lint:dead-code
          node scripts/tools/check-architecture.mjs
          node scripts/tools/check-export-surface.mjs
          node scripts/tools/check-workflow-hygiene.mjs
          git diff --check
      - name: Commit verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove cleanup side effects [latest-only-verified]'
          git push origin HEAD:refactor/remove-obsolete-compat
