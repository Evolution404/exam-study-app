name: Temporary Latest-Only Cutoff Verifier

on:
  push:
    branches:
      - refactor/remove-obsolete-compat

permissions:
  contents: write

jobs:
  verify-commit:
    if: contains(github.event.head_commit.message, '[latest-only-stage14]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply latest-only cutoff
        run: |
          python3 scripts/tmp-latest-only-cleanup.py
          python3 scripts/tmp-latest-only-fixes.py
          python3 scripts/tmp-latest-only-fixes2.py
          python3 scripts/tmp-latest-only-fixes3.py
          python3 scripts/tmp-latest-only-fixes4.py
          python3 scripts/tmp-latest-only-fixes5.py
          python3 scripts/tmp-latest-only-fixes6.py
          python3 scripts/tmp-latest-only-fixes7.py
          python3 scripts/tmp-latest-only-fixes8.py
          python3 scripts/tmp-latest-only-fixes9.py
          python3 scripts/tmp-latest-only-fixes10.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/db/db-v7-restore.ts')
          text = path.read_text(encoding='utf-8')
          old = 'await writeChunks(memberships, (chunk) => dbV7.bankQuestionMemberships.bulkPut(chunk), "写入题库关系");'
          new = 'await writeChunks(state.memberships, (chunk) => dbV7.bankQuestionMemberships.bulkPut(chunk), "写入题库关系");'
          if old not in text:
              raise RuntimeError('db-v7-restore memberships cutoff target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/db/db-v7-core.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Web Locks additionally serialize the localStorage compatibility mirror.', 'Web Locks additionally serialize the localStorage mirror.')
          text = text.replace('''/**
           * Startup health gate: the app awaits this before render so a namespace that
           * cannot open fails fast instead of mid-interaction. There is no local schema
           * migration — content arrives through the v9 remote restore.
           */''', '''/**
           * Startup health gate: the app awaits this before render so namespace-open
           * failures surface before interaction.
           */''')
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tests/test-progress-metrics-boundaries.ts')
          text = path.read_text(encoding='utf-8')
          marker = '"outcomes 为空时回退终身错误率公式");'
          marker_index = text.find(marker)
          if marker_index < 0:
              raise RuntimeError('empty-evidence difficulty fallback marker not found')
          start = text.rfind('  assert.equal(summarizeAttemptStats({', 0, marker_index)
          if start < 0:
              raise RuntimeError('empty-evidence difficulty fallback assertion start not found')
          end = text.find('\n', marker_index)
          if end < 0:
              end = len(text)
          else:
              end += 1
          if end < len(text) and text[end:end + 1] == '\n':
              end += 1
          text = text[:start] + text[end:]
          text = text.replace('  // 写入链把作答时间记进 recentOutcomes（legacy 链；V7 链由静态断言覆盖）。\n', '  // 写入链把作答时间记进 recentOutcomes。\n')
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tests/test-platform-transport.ts')
          text = path.read_text(encoding='utf-8')
          old = '    size: 0,\n'
          new = '    size: 0,\n    storedSize: 0,\n'
          if old not in text:
              raise RuntimeError('platform transport checkpoint size fixture not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tools/check-architecture.mjs')
          text = path.read_text(encoding='utf-8')
          impossible = '  || !/SYNC_V9_ASSET_PREFIX\\s*=\\s*SYNC_V9_ASSET_PREFIX/.test(syncV7HeadTypes)'
          if impossible not in text:
              raise RuntimeError('architecture self-alias artifact not found')
          path.write_text(text.replace(impossible, '', 1), encoding='utf-8')
          PY
          npx eslint src/lib/db/db-v7-practice.ts --fix
          python3 scripts/tmp-latest-only-diagnostic.py
          python3 scripts/tmp-latest-only-semantic-scan.py
          python3 scripts/tmp-latest-only-target-scan.py
          rm -f .github/workflows/tmp-deep-compat-audit.yml scripts/tmp-latest-only-cleanup.py scripts/tmp-latest-only-fixes.py scripts/tmp-latest-only-fixes2.py scripts/tmp-latest-only-fixes3.py scripts/tmp-latest-only-fixes4.py scripts/tmp-latest-only-fixes5.py scripts/tmp-latest-only-fixes6.py scripts/tmp-latest-only-fixes7.py scripts/tmp-latest-only-fixes8.py scripts/tmp-latest-only-fixes9.py scripts/tmp-latest-only-fixes10.py scripts/tmp-latest-only-diagnostic.py scripts/tmp-latest-only-semantic-scan.py scripts/tmp-latest-only-target-scan.py
          git diff --check
      - name: Focused current-format checks
        run: |
          npm run test:sync-v7-protocol
          npm run test:checkpoint-extra
          npm run test:image-assets
          npm run test:secure-credentials
          npm run test:persistent-config
          npm run test:ios-release
          npm run test:answer-ui
      - name: Full gates
        run: |
          npm run test:sync
          npm run test:fast
          npm run build
          npm run lint:dead-code
          node scripts/tools/check-architecture.mjs
          node scripts/tools/check-export-surface.mjs
          node scripts/tools/check-workflow-hygiene.mjs
          git diff --check
      - name: Commit verified cutoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: drop historical compatibility paths [latest-only-verified]"
          git push origin HEAD:refactor/remove-obsolete-compat
