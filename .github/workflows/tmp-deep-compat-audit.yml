name: Temporary Latest-Only Cutoff Verifier

on:
  push:
    branches:
      - refactor/remove-obsolete-compat

permissions:
  contents: write

jobs:
  verify-commit:
    if: contains(github.event.head_commit.message, '[latest-only-stage7]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Apply latest-only cutoff
        run: |
          python3 scripts/tmp-latest-only-cleanup.py
          python3 scripts/tmp-latest-only-fixes.py
          python3 scripts/tmp-latest-only-fixes2.py
          python3 scripts/tmp-latest-only-fixes3.py
          python3 scripts/tmp-latest-only-fixes4.py
          rm -f .github/workflows/tmp-deep-compat-audit.yml scripts/tmp-latest-only-cleanup.py scripts/tmp-latest-only-fixes.py scripts/tmp-latest-only-fixes2.py scripts/tmp-latest-only-fixes3.py scripts/tmp-latest-only-fixes4.py
          git diff --check
      - name: Focused current-format checks
        run: |
          npm run test:sync-v7-protocol
          npm run test:checkpoint-extra
          npm run test:image-assets
          npm run test:secure-credentials
          npm run test:persistent-config
          npm run test:ios-release
          npm run test:answer-ui
      - name: Full gates
        run: |
          npm run test:sync
          npm run test:fast
          npm run build
          npm run lint:dead-code
          node scripts/tools/check-architecture.mjs
          node scripts/tools/check-export-surface.mjs
          node scripts/tools/check-workflow-hygiene.mjs
          git diff --check
      - name: Commit verified cutoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: drop historical compatibility paths [latest-only-verified]"
          git push origin HEAD:refactor/remove-obsolete-compat
