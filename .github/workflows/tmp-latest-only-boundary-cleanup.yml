name: Temporary current-only boundary verifier
on:
  push:
    branches: [refactor/remove-obsolete-compat]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Apply current-only cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {text.count(old)}')
              return text.replace(old, new)

          p = Path('src/lib/question/question-bank-file-import.ts')
          s = p.read_text()
          s = replace_once(s,
              '      const bank = await importQuestionBankV7(importFileName(file.name), rows, { ...options, imageAssets: assets });',
              '      const canonicalRows = rows.map((row) => ({ stem: row.q, type: row.type, options: row.a, answer: row.ans, tags: row.tags, ...(row.note ? { note: row.note } : {}), ...(row.images?.length ? { images: row.images } : {}) }));\n      const bank = await importQuestionBankV7(importFileName(file.name), canonicalRows, { ...options, imageAssets: assets });',
              'xlsx boundary')
          start = s.index('  const raw: unknown = parsedJson.raw;')
          end_marker = '  const bank = await importQuestionBankV7(file.name, raw, options);'
          end = s.index(end_marker, start) + len(end_marker)
          strict_json = '  const raw = parsedJson.raw;\n  if (!raw || typeof raw !== "object" || Array.isArray(raw) || !Array.isArray((raw as Record<string, unknown>).questions)) throw new Error("JSON 题库必须使用当前 { name?, questions: [] } 格式。");\n  const questionRows = (raw as { questions: unknown[] }).questions;\n  if (questionRows.length > IMPORT_LIMITS.json.maxQuestions) throw new Error(`JSON 题库最多包含 ${IMPORT_LIMITS.json.maxQuestions} 道题。`);\n  const bank = await importQuestionBankV7(file.name, raw, options);'
          p.write_text(s[:start] + strict_json + s[end:])

          p = Path('src/lib/db/db-v7-question-import.ts')
          s = p.read_text()
          start = s.index('function rawQuestionRows(')
          end = s.index('const ASSET_ID_PATTERN', start)
          s = s[:start] + 'function rawQuestionRows(raw: unknown): { name?: string; rows: ImportedQuestionRowV7[] } {\n  if (Array.isArray(raw)) return { rows: raw as ImportedQuestionRowV7[] };\n  if (!raw || typeof raw !== "object") throw new Error("未找到当前 questions 题目数组。");\n  const record = raw as Record<string, unknown>;\n  if (!Array.isArray(record.questions)) throw new Error("未找到当前 questions 题目数组。");\n  return { name: typeof record.name === "string" ? record.name : undefined, rows: record.questions as ImportedQuestionRowV7[] };\n}\n\n' + s[end:]
          pairs = {
              'const rawStem = normalizeContentText(rowString(record, "stem", "question", "q", "题干"));': 'const rawStem = normalizeContentText(typeof record.stem === "string" ? record.stem : "");',
              'const rawOptions = rowOptions(record);': 'const rawOptions = record.options;',
              '  const optionTexts = optionBlocks.map((option) => deriveContentText(option));\n': '',
              'const rawType = rowString(record, "type", "questionType", "题型").trim();': 'const rawType = typeof record.type === "string" ? record.type.trim() : "";',
              'const rawAnswer = record.answer ?? record.ans ?? record.correctAnswer ?? record["答案"] ?? "";': 'const rawAnswer = record.answer ?? "";',
              '  const rawTags = record.tags ?? record["标签"];': '  const rawTags = record.tags;',
              '  const note = rowString(record, "note", "analysis", "解析").trim();': '  const note = typeof record.note === "string" ? record.note.trim() : "";',
              '\nexport const importTextJsonBankV7 = importQuestionBankV7;\nexport const importBankV7 = importQuestionBankV7;\n': '\n',
          }
          for old, new in pairs.items(): s = replace_once(s, old, new, old[:40])
          old_type = '  const type: QuestionTypeV7 = rawType === "判断" || rawType === "单选" || rawType === "多选" || rawType === "计算" || rawType === "填空" || rawType === "简答"\n    ? rawType\n    : optionTexts.length === 2 && optionTexts[0] === "正确" && optionTexts[1] === "错误"\n      ? "判断"\n      : answer.replace(/[^A-Z]/gi, "").length > 1 ? "多选" : "单选";'
          s = replace_once(s, old_type, '  if (rawType !== "判断" && rawType !== "单选" && rawType !== "多选" && rawType !== "计算" && rawType !== "填空" && rawType !== "简答") return undefined;\n  const type: QuestionTypeV7 = rawType;', 'type inference')
          for token in ['record.items','record.data','record.correctAnswer','record["答案"]','record["标签"]','rowString(','rowOptions(','questionType']:
              if token in s: raise SystemExit(f'historical import alias remains: {token}')
          if re.search(r'\brecord\.ans\b', s): raise SystemExit('record.ans remains')
          p.write_text(s)

          p = Path('src/lib/sync/github-v7-remote.ts')
          s = p.read_text()
          start = s.index('  /** Actual wire size of a stored blob')
          end = s.index('  readImmutableBlob(', start)
          if 'readBlobWireSize' not in s[start:end]: raise SystemExit('readBlobWireSize block mismatch')
          p.write_text(s[:start] + s[end:])

          def choice_draft(bank, qtype, stem, options, answer):
              count = len([x for x in options.split(',') if x.strip()])
              ids = [f'opt-{i}' for i in range(count)]
              selected = [ids[ord(c)-65] for c in answer if 0 <= ord(c)-65 < count]
              js = lambda xs: ', '.join(f'"{x}"' for x in xs)
              return f'createQuestionV7({bank}, {{ type: "{qtype}", stem: "{stem}", options: [{options}], optionIds: [{js(ids)}], solution: {{ kind: "choice", correctOptionIds: [{js(selected)}] }} }})'

          for filename in ['scripts/tests/test-db-v7.ts','scripts/tests/test-db-v7-extra.ts']:
              p = Path(filename); s = p.read_text()
              s = re.sub(r'\{ q: ', '{ stem: ', s); s = re.sub(r', a: ', ', options: ', s); s = re.sub(r', ans: ', ', answer: ', s)
              pattern = re.compile(r'createQuestionV7\(([^,\n]+), \{ type: "(单选|判断|多选)", stem: "([^"]*)", options: \[([^\]]*)\], answer: "([A-Z]+)" \}\)')
              s = pattern.sub(lambda m: choice_draft(*m.groups()), s)
              if filename.endswith('test-db-v7.ts'):
                  old = '  const calculationQuestion = await createQuestionV7(calculationBank.id, {\n    type: "计算",\n    stem: "两个结果分别为【空1】和【空2】",\n    options: [],\n    answer: ["1", "1"],\n  });\n  assert.equal(calculationQuestion.answer, "1\\n1");'
                  new = '  const calculationQuestion = await createQuestionV7(calculationBank.id, {\n    type: "计算",\n    stem: "两个结果分别为【空1】和【空2】",\n    options: [],\n    solution: { kind: "calculation", blanks: [{ id: "blank-1", expected: 1 }, { id: "blank-2", expected: 1 }] },\n  });\n  assert.deepEqual(calculationQuestion.solution, { kind: "calculation", blanks: [{ id: "blank-1", expected: 1 }, { id: "blank-2", expected: 1 }] });'
                  s = replace_once(s, old, new, 'calculation fixture')
              if re.search(r'createQuestionV7\([^\n]*\banswer:', s): raise SystemExit(f'direct answer fixture remains: {filename}')
              p.write_text(s)

          p = Path('scripts/tests/test-sync-stats-integration.ts')
          s = p.read_text()
          old = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              answer,
              tags: ["统计测试"],
            };
          }'''
          new = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            const optionIds = options.map((_, index) => `opt-${index}`);
            const correctOptionIds = answer
              .split("")
              .map((letter) => optionIds[letter.charCodeAt(0) - 65])
              .filter((id): id is string => Boolean(id));
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              optionIds,
              solution: { kind: "choice", correctOptionIds },
              tags: ["统计测试"],
            };
          }'''
          s = replace_once(s, old, new, 'stats singleChoice')
          p.write_text(s)

          p = Path('scripts/tests/test-sync-question-management.ts')
          s = p.read_text()
          old = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              answer,
              tags: ["试题管理"],
            };
          }'''
          new = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            const optionIds = options.map((_, index) => `opt-${index}`);
            const correctOptionIds = answer.split("").map((letter) => optionIds[letter.charCodeAt(0) - 65]).filter((id): id is string => Boolean(id));
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              optionIds,
              solution: { kind: "choice", correctOptionIds },
              tags: ["试题管理"],
            };
          }'''
          s = replace_once(s, old, new, 'question management singleChoice')
          s = s.replace('{ q:', '{ stem:').replace(', a:', ', type: "单选", options:').replace(', ans:', ', answer:')
          shared_import = '    await importQuestionBankV7("共享到Y.json", [{ stem: "X与Y共享题", type: "单选", options: ["对", "错"], answer: "A" }]); // 同指纹 → 复用 qShared，建立 Y 关系'
          shared_membership = '    await createQuestionV7(bankY.id, singleChoice("X与Y共享题", "A", ["对", "错"])); // 显式复用 qShared，建立 Y 关系'
          s = replace_once(s, shared_import, shared_membership, 'explicit shared membership')
          p.write_text(s)

          p = Path('scripts/tests/test-sync-coalescing.ts')
          s = p.read_text()
          for tag in ['合并测试', '混合合并', '压缩触发']:
              old = f'    answer: "A",\n    tags: ["{tag}"],'
              new = f'    optionIds: ["opt-0", "opt-1", "opt-2", "opt-3"],\n    solution: {{ kind: "choice", correctOptionIds: ["opt-0"] }},\n    tags: ["{tag}"],'
              s = replace_once(s, old, new, f'coalescing {tag}')
          s = s.replace('{ q:', '{ stem:').replace(', a:', ', type: "单选", options:').replace(', ans:', ', answer:')
          p.write_text(s)

          p = Path('scripts/tests/test-sync-fault-tolerance.ts')
          s = p.read_text()
          old = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              answer,
              tags: ["故障测试"],
            };
          }'''
          new = '''function singleChoice(stem: string, answer: string, options: string[]): Parameters<typeof createQuestionV7>[1] {
            const optionIds = options.map((_, index) => `opt-${index}`);
            const correctOptionIds = answer.split("").map((letter) => optionIds[letter.charCodeAt(0) - 65]).filter((id): id is string => Boolean(id));
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: options.map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              optionIds,
              solution: { kind: "choice", correctOptionIds },
              tags: ["故障测试"],
            };
          }'''
          s = replace_once(s, old, new, 'fault tolerance singleChoice')
          p.write_text(s)

          p = Path('scripts/tests/test-sync-integrity.ts')
          s = p.read_text()
          old = '''function singleChoice(stem: string, answer: string): Parameters<typeof createQuestionV7>[1] {
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: ["对", "错"].map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              answer,
              tags: ["完整性"],
            };
          }'''
          new = '''function singleChoice(stem: string, answer: string): Parameters<typeof createQuestionV7>[1] {
            return {
              type: "单选",
              content: [{ id: "stem-0", type: "text", text: stem }],
              options: ["对", "错"].map((text, index) => [{ id: `opt-${index}`, type: "text", text }]),
              optionIds: ["opt-0", "opt-1"],
              solution: { kind: "choice", correctOptionIds: [answer === "A" ? "opt-0" : "opt-1"] },
              tags: ["完整性"],
            };
          }'''
          s = replace_once(s, old, new, 'integrity singleChoice')
          p.write_text(s)

          p = Path('src/lib/question/question-content.ts')
          s = p.read_text()
          s = replace_once(s, '  answer: string;\n}', '  solution: QuestionV7["solution"];\n}', 'fingerprint input solution')
          s = replace_once(s, '    answer: normalizeContentText(input.answer),', '    solution: input.solution,', 'fingerprint payload solution')
          p.write_text(s)

          p = Path('src/lib/db/db-v7-question-draft.ts')
          s = p.read_text()
          s = replace_once(s, '  const contentFingerprint = questionContentFingerprint({ type: draft.type, content, options, answer: JSON.stringify(solution) });', '  const contentFingerprint = questionContentFingerprint({ type: draft.type, content, options, solution });', 'draft fingerprint solution')
          p.write_text(s)

          p = Path('src/app/bank/bank-library/question-manager.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { matchesTagSelection, type TagMatchMode } from "@/lib/question/tag-filter";', 'import { matchesTagSelection, type TagMatchMode } from "@/lib/question/tag-filter";\nimport { solutionAnswerText } from "@/lib/question/question-utils";', 'question manager solution import')
          s = replace_once(s,
              '  const blankCanonical: QuestionV7 = { id: "draft", type: "单选", content: [{ id: "stem-0", type: "text", text: "" }], options: [0, 1, 2, 3].map((index) => [{ id: `option-${index}-0`, type: "text", text: "" }]), answer: "A", tags: [], favorite: false, contentFingerprint: "0".repeat(64), updatedAt: new Date().toISOString(), deviceId: "draft" };',
              '  const blankCanonical: QuestionV7 = { id: "draft", type: "单选", content: [{ id: "stem-0", type: "text", text: "" }], options: [0, 1, 2, 3].map((index) => [{ id: `option-${index}-0`, type: "text", text: "" }]), optionIds: ["option-0", "option-1", "option-2", "option-3"], solution: { kind: "choice", correctOptionIds: ["option-0"] }, tags: [], favorite: false, contentFingerprint: "0".repeat(64), updatedAt: new Date().toISOString(), deviceId: "draft" };',
              'question manager blank canonical')
          s = replace_once(s, '<small>答案 {question.answer} · 作答 {summary.total} 次', '<small>答案 {solutionAnswerText(question.solution, question.optionIds ?? [])} · 作答 {summary.total} 次', 'question manager answer display')
          p.write_text(s)

          p = Path('src/app/practice/practice-history.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { formatCalculationAnswers } from "@/lib/question/question-utils";', 'import { formatCalculationAnswers, solutionAnswerText } from "@/lib/question/question-utils";', 'practice history solution import')
          s = replace_once(s,
              'question.type === "计算" ? formatCalculationAnswers(question.answer) : question.answer',
              'question.solution.kind === "calculation" ? formatCalculationAnswers(question.solution.blanks.map((blank) => String(blank.expected))) : solutionAnswerText(question.solution, question.optionIds ?? [])',
              'practice history canonical answer')
          p.write_text(s)

          p = Path('src/app/shell/views/practice.tsx')
          s = p.read_text()
          s = replace_once(s,
              'import { areCalculationAnswersCorrect, calculationAnswers, calculationBlankIndexes, fillAnswersAreCorrect, formatCalculationAnswers, questionSolution, stableQuestionOptionIds } from "@/lib/question/question-utils";',
              'import { areCalculationAnswersCorrect, calculationBlankIndexes, fillAnswersAreCorrect, formatCalculationAnswers, stableQuestionOptionIds } from "@/lib/question/question-utils";',
              'practice remove answer adapters')
          s = replace_once(s, '  const solution = questionSolution(question.canonical);', '  const solution = question.canonical.solution;', 'practice direct solution')
          s = replace_once(s,
              '  const expectedCalculationAnswers = solution.kind === "calculation" ? solution.blanks.map((blank) => String(blank.expected)) : question.type === "计算" ? calculationAnswers(question.answer) : [];',
              '  const expectedCalculationAnswers = solution.kind === "calculation" ? solution.blanks.map((blank) => String(blank.expected)) : [];',
              'practice calculation solution')
          s = replace_once(s,
              '          : value === [...question.answer].sort().join("");',
              '          : solution.kind === "choice" && (() => {\n            const selectedOptionIds = valueList.map((letter) => optionIds[letter.charCodeAt(0) - 65]).filter((id): id is string => Boolean(id));\n            return selectedOptionIds.length === correctOptionIds.size && selectedOptionIds.every((id) => correctOptionIds.has(id));\n          })();',
              'practice choice correctness')
          p.write_text(s)

          p = Path('src/app/sync/sync-event-manager.tsx')
          s = p.read_text()
          s = replace_once(s, 'import "@/app/styles/sync-events-1.css";', 'import { solutionAnswerText, stableQuestionOptionIds } from "@/lib/question/question-utils";\nimport "@/app/styles/sync-events-1.css";', 'sync event solution import')
          s = replace_once(s,
              '  const [questionAnswer, setQuestionAnswer] = useState(mutation.kind === "question.upsert" ? mutation.question.answer : "");',
              '  const [questionAnswer, setQuestionAnswer] = useState(mutation.kind === "question.upsert" ? solutionAnswerText(mutation.question.solution, stableQuestionOptionIds(mutation.question)) : "");',
              'sync event answer text')
          p.write_text(s)

          p = Path('src/lib/sync/sync-application.ts')
          s = p.read_text()
          s = replace_once(s, 'import { questionContentFingerprint } from "../question/question-content";', 'import { questionContentFingerprint } from "../question/question-content";\nimport { solutionFromInput, stableQuestionOptionIds } from "../question/question-utils";', 'sync application solution import')
          s = replace_once(s,
              '        const question = { ...mutation.question, answer: edit.answer, tags: edit.tags, content, updatedAt: new Date().toISOString() };',
              '        const optionIds = stableQuestionOptionIds(mutation.question);\n        const solution = solutionFromInput(mutation.question.type, edit.answer, mutation.question.options, optionIds);\n        const question = { ...mutation.question, optionIds, solution, tags: edit.tags, content, updatedAt: new Date().toISOString() };',
              'sync application canonical solution')
          p.write_text(s)

          for filename in [
              'src/app/bank/bank-library/question-manager.tsx',
              'src/app/practice/practice-history.tsx',
              'src/app/shell/views/practice.tsx',
              'src/app/sync/sync-event-manager.tsx',
              'src/lib/sync/sync-application.ts',
              'src/lib/question/question-content.ts',
              'src/lib/db/db-v7-question-draft.ts',
          ]:
              text = Path(filename).read_text()
              if re.search(r'\bquestion\.answer\b|\bmutation\.question\.answer\b', text):
                  raise SystemExit(f'persisted question.answer remains: {filename}')
          PY
      - run: npm ci
      - run: npm run test:xlsx
      - run: npm run test:sync
      - run: npm run test:fast
      - run: npm run build
      - name: Report semantic residue
        run: |
          rg -n -i 'legacy|migrat|compatibil|superseded|one[- ]shot|一次性|迁移|兼容' src scripts || true
          rg -n -i 'fallback|回退' src scripts || true
          rg -n 'questionSolution\(|legacyAnswerForSolution|readBlobWireSize|bankQuestionMemberships|practiceRunStats.*\?\?|storedSize\s*\?\?' src scripts || true
      - name: Commit verified cleanup
        run: |
          rm .github/workflows/tmp-latest-only-boundary-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/question/question-bank-file-import.ts src/lib/db/db-v7-question-import.ts src/lib/sync/github-v7-remote.ts scripts/tests/test-db-v7.ts scripts/tests/test-db-v7-extra.ts scripts/tests/test-sync-stats-integration.ts scripts/tests/test-sync-question-management.ts scripts/tests/test-sync-coalescing.ts scripts/tests/test-sync-fault-tolerance.ts scripts/tests/test-sync-integrity.ts src/lib/question/question-content.ts src/lib/db/db-v7-question-draft.ts src/app/bank/bank-library/question-manager.tsx src/app/practice/practice-history.tsx src/app/shell/views/practice.tsx src/app/sync/sync-event-manager.tsx src/lib/sync/sync-application.ts .github/workflows/tmp-latest-only-boundary-cleanup.yml
          git diff --cached --check
          git commit -m "refactor: enforce current-only question and import boundaries [latest-only-verified]"
          git push origin HEAD:refactor/remove-obsolete-compat