name: Temporary latest-only boundary cleanup

on:
  push:
    branches:
      - refactor/remove-obsolete-compat

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/remove-obsolete-compat
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Remove historical import and stored-size fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/question/question-bank-file-import.ts')
          text = path.read_text()
          old = '      const bank = await importQuestionBankV7(importFileName(file.name), rows, { ...options, imageAssets: assets });'
          new = '''      const canonicalRows = rows.map((row) => ({
        stem: row.q,
        type: row.type,
        options: row.a,
        answer: row.ans,
        tags: row.tags,
        ...(row.note ? { note: row.note } : {}),
        ...(row.images?.length ? { images: row.images } : {}),
      }));
      const bank = await importQuestionBankV7(importFileName(file.name), canonicalRows, { ...options, imageAssets: assets });'''
          if text.count(old) != 1:
            raise SystemExit('xlsx canonical boundary match failed')
          text = text.replace(old, new)
          old = '''  const raw: unknown = parsedJson.raw;
  const questionRows = Array.isArray(raw)
    ? raw
    : raw && typeof raw === "object" && Array.isArray((raw as Record<string, unknown>).questions)
      ? (raw as { questions: unknown[] }).questions
      : raw && typeof raw === "object" && Array.isArray((raw as Record<string, unknown>).items)
        ? (raw as { items: unknown[] }).items
        : raw && typeof raw === "object" && Array.isArray((raw as Record<string, unknown>).data)
          ? (raw as { data: unknown[] }).data
          : undefined;
  if (questionRows && questionRows.length > IMPORT_LIMITS.json.maxQuestions) throw new Error(`JSON 题库最多包含 ${IMPORT_LIMITS.json.maxQuestions} 道题。`);
  const bank = await importQuestionBankV7(file.name, raw, options);'''
          new = '''  const raw = parsedJson.raw;
  if (!raw || typeof raw !== "object" || Array.isArray(raw) || !Array.isArray((raw as Record<string, unknown>).questions)) {
    throw new Error("JSON 题库必须使用当前 { name?, questions: [] } 格式。");
  }
  const questionRows = (raw as { questions: unknown[] }).questions;
  if (questionRows.length > IMPORT_LIMITS.json.maxQuestions) throw new Error(`JSON 题库最多包含 ${IMPORT_LIMITS.json.maxQuestions} 道题。`);
  const bank = await importQuestionBankV7(file.name, raw, options);'''
          if text.count(old) != 1:
            raise SystemExit('json current-shape boundary match failed')
          path.write_text(text.replace(old, new))

          path = Path('src/lib/db/db-v7-question-import.ts')
          text = path.read_text()
          old = '''function rawQuestionRows(raw: unknown): { name?: string; rows: ImportedQuestionRowV7[] } {
  if (typeof raw === "string") {
    try {
      return rawQuestionRows(JSON.parse(raw) as unknown);
    } catch {
      throw new Error("JSON 题库内容无效。");
    }
  }
  if (Array.isArray(raw)) return { rows: raw as ImportedQuestionRowV7[] };
  if (!raw || typeof raw !== "object") throw new Error("未找到题目数组。支持数组或 { questions: [] } 格式。");
  const record = raw as Record<string, unknown>;
  const questions = record.questions ?? record.items ?? record.data;
  if (!Array.isArray(questions)) throw new Error("未找到题目数组。支持数组或 { questions: [] } 格式。");
  return { name: typeof record.name === "string" ? record.name : undefined, rows: questions as ImportedQuestionRowV7[] };
}

function rowString(row: Record<string, unknown>, ...keys: string[]): string {
  for (const key of keys) {
    if (row[key] === undefined || row[key] === null) continue;
    if (Array.isArray(row[key])) return row[key].join("");
    return String(row[key]);
  }
  return "";
}

function rowOptions(row: Record<string, unknown>): unknown {
  return row.options ?? row.a ?? row.choices ?? row["选项"];
}
'''
          new = '''function rawQuestionRows(raw: unknown): { name?: string; rows: ImportedQuestionRowV7[] } {
  if (Array.isArray(raw)) return { rows: raw as ImportedQuestionRowV7[] };
  if (!raw || typeof raw !== "object") throw new Error("未找到当前 questions 题目数组。");
  const record = raw as Record<string, unknown>;
  if (!Array.isArray(record.questions)) throw new Error("未找到当前 questions 题目数组。");
  return { name: typeof record.name === "string" ? record.name : undefined, rows: record.questions as ImportedQuestionRowV7[] };
}
'''
          if text.count(old) != 1:
            raise SystemExit('import aliases helper block match failed')
          text = text.replace(old, new)
          text = text.replace('const rawStem = normalizeContentText(rowString(record, "stem", "question", "q", "题干"));', 'const rawStem = normalizeContentText(typeof record.stem === "string" ? record.stem : "");')
          text = text.replace('const rawOptions = rowOptions(record);', 'const rawOptions = record.options;')
          text = text.replace('const rawType = rowString(record, "type", "questionType", "题型").trim();', 'const rawType = typeof record.type === "string" ? record.type.trim() : "";')
          text = text.replace('const rawAnswer = record.answer ?? record.ans ?? record.correctAnswer ?? record["答案"] ?? "";', 'const rawAnswer = record.answer ?? "";')
          old = '''  const type: QuestionTypeV7 = rawType === "判断" || rawType === "单选" || rawType === "多选" || rawType === "计算" || rawType === "填空" || rawType === "简答"
    ? rawType
    : optionTexts.length === 2 && optionTexts[0] === "正确" && optionTexts[1] === "错误"
      ? "判断"
      : answer.replace(/[^A-Z]/gi, "").length > 1 ? "多选" : "单选";'''
          new = '''  if (rawType !== "判断" && rawType !== "单选" && rawType !== "多选" && rawType !== "计算" && rawType !== "填空" && rawType !== "简答") return undefined;
  const type: QuestionTypeV7 = rawType;'''
          if text.count(old) != 1:
            raise SystemExit('type inference fallback match failed')
          text = text.replace(old, new)
          text = text.replace('  const rawTags = record.tags ?? record["标签"];', '  const rawTags = record.tags;')
          text = text.replace('  const note = rowString(record, "note", "analysis", "解析").trim();', '  const note = typeof record.note === "string" ? record.note.trim() : "";')
          text = text.replace('\nexport const importTextJsonBankV7 = importQuestionBankV7;\nexport const importBankV7 = importQuestionBankV7;\n', '\n')
          # optionTexts is no longer used for type inference.
          text = text.replace('  const optionTexts = optionBlocks.map((option) => deriveContentText(option));\n', '')
          forbidden = ['record.items', 'record.data', 'record.ans', 'record.correctAnswer', 'record["答案"]', 'record["标签"]', '"questionType"', '"题型"', '"question", "q", "题干"', 'rowOptions(', 'rowString(']
          for token in forbidden:
            if token in text:
              raise SystemExit(f'historical import alias remains: {token}')
          path.write_text(text)

          path = Path('src/lib/sync/github-v7-remote.ts')
          text = path.read_text()
          pattern = re.compile(r'\n  /\*\* Actual wire size of a stored blob \(the envelope, before inflation\) —\n   \*  one-time measurement used to backfill `storedSize` on legacy descriptors\. \*/\n  async readBlobWireSize\(blobSha: string\): Promise<number> \{\n    assertSha1\(blobSha, "blobSha"\);\n    const response = await this\.request\(blobPath\(this\.owner, this\.repo, blobSha\), \{ method: "GET" \}, GITHUB_V7_RAW_MEDIA_TYPE\);\n    this\.requireOk\(response, `read blob wire size \$\{blobSha\}`\);\n    return \(await response\.arrayBuffer\(\)\)\.byteLength;\n  \}\n')
          text, count = pattern.subn('\n', text)
          if count != 1:
            raise SystemExit(f'readBlobWireSize removal match count={count}')
          if 'readBlobWireSize' in text:
            raise SystemExit('readBlobWireSize remains')
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run test:xlsx
      - run: npm run test:sync
      - run: npm run test:fast
      - run: npm run build
      - name: Semantic residue report
        run: |
          echo '--- historical compatibility terms ---'
          rg -n -i 'legacy|migrat|compatibil|superseded|one[- ]shot|一次性|迁移|兼容' src scripts || true
          echo '--- fallback terms ---'
          rg -n -i 'fallback|回退' src scripts || true
      - name: Commit verified cleanup and remove temporary workflow
        run: |
          rm .github/workflows/tmp-latest-only-boundary-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/question/question-bank-file-import.ts src/lib/db/db-v7-question-import.ts src/lib/sync/github-v7-remote.ts .github/workflows/tmp-latest-only-boundary-cleanup.yml
          git diff --cached --check
          git commit -m "refactor: enforce current-only import boundaries [latest-only-verified]"
          git push origin HEAD:refactor/remove-obsolete-compat
