name: Phase 2 checkpoint test fix

on:
  push:
    branches:
      - refactor/database-facts-projections-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-facts-projections-20260917
          fetch-depth: 0
      - name: Correct checkpoint format contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tests/test-sync-checkpoint-extra.ts')
          text = path.read_text()
          old = 'import { SYNC_FORMAT_VERSION } from "../../src/lib/sync/sync-head-types";\nimport type { SyncCheckpoint } from "../../src/lib/sync/sync-checkpoint-types";'
          new = 'import { SYNC_CHECKPOINT_FORMAT, type SyncCheckpoint } from "../../src/lib/sync/sync-checkpoint-types";'
          if text.count(old) != 1:
              raise SystemExit('checkpoint format import contract did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace('SYNC_FORMAT_VERSION', 'SYNC_CHECKPOINT_FORMAT')
          text = text.replace('// 1) 新建检查点必须使用当前同步格式且可 round-trip，包括新增正式题型', '// 1) 新建检查点必须使用当前检查点格式且可 round-trip，包括新增正式题型')
          if 'SYNC_FORMAT_VERSION' in text:
              raise SystemExit('sync head format constant must not be used by checkpoint format tests')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/phase2-checkpoint-test-fix.yml
          git add scripts/tests/test-sync-checkpoint-extra.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: use checkpoint format contract"
          git push origin HEAD:refactor/database-facts-projections-20260917
