name: Finalize remote restore and reconcile perf

on:
  push:
    branches: [fix/ios-sync-local-install-progress]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-sync-local-install-progress
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Apply verified patch
        run: python3 scripts/tools/finalize-remote-restore-perf.py
      - run: npm ci
      - name: Checkpoint question-type regression
        run: npm run test:checkpoint-extra
      - name: Remote restore question-type integration
        run: npm run test:sync-restore-question-types
      - name: Incremental reconcile regression
        run: npm run test:sync-incremental-install
      - name: Sync progress regression
        run: npm run test:sync-progress
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture and registration
        run: npm run test:architecture
      - name: Production build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(sync): restore all question types and reduce reconcile churn"
          git push origin HEAD:fix/ios-sync-local-install-progress
