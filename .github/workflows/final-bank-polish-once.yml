name: Final bank polish once

on:
  pull_request:
    paths: [.github/workflows/final-bank-polish-once.yml]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Preserve historical round labels while filtering future choices
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/app/shell/app-shell.tsx')
          s = p.read_text()
          old = '<PreferencesView preferences={preferences} rounds={reviewRounds} banks={enabledBanks}'
          new = '<PreferencesView preferences={preferences} rounds={reviewRounds} banks={banks}'
          if old not in s:
              raise SystemExit('PreferencesView enabled-bank anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/app/practice/review-round-manager.tsx')
          s = p.read_text()
          old = 'import type { ReviewRound, ReviewRoundStatus } from "@/lib/db/v7-types";'
          new = 'import { isBankEnabled, type ReviewRound, type ReviewRoundStatus } from "@/lib/db/v7-types";'
          if old not in s:
              raise SystemExit('review-round import anchor missing')
          s = s.replace(old, new, 1)
          old = 'export type ReviewRoundBank = Pick<Bank, "id" | "name" | "questionCount"> & Partial<Pick<Bank, "displayName">>;'
          new = 'export type ReviewRoundBank = Pick<Bank, "id" | "name" | "questionCount"> & Partial<Pick<Bank, "displayName">> & { enabled?: boolean };'
          if old not in s:
              raise SystemExit('ReviewRoundBank anchor missing')
          s = s.replace(old, new, 1)
          old = '  const visibleRounds = useMemo(() => visibleReviewRounds(rounds), [rounds]);'
          new = '  const visibleRounds = useMemo(() => visibleReviewRounds(rounds), [rounds]);\n  const selectableBanks = useMemo(() => banks.filter(isBankEnabled), [banks]);'
          if old not in s:
              raise SystemExit('visibleRounds anchor missing')
          s = s.replace(old, new, 1)
          old = '{banks.map((bank) => <label key={bank.id}'
          new = '{selectableBanks.map((bank) => <label key={bank.id}'
          if old not in s:
              raise SystemExit('bank picker map anchor missing')
          s = s.replace(old, new, 1)
          old = '{banks.length === 0 && <p>还没有可选题库。</p>}'
          new = '{selectableBanks.length === 0 && <p>还没有已启用的可选题库。</p>}'
          if old not in s:
              raise SystemExit('bank picker empty anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify types and focused UI contracts
        run: npm run typecheck && npm run test:v7-ui
      - name: Commit polish to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/shell/app-shell.tsx src/app/practice/review-round-manager.tsx
          git commit -m 'fix: keep disabled banks visible in round history'
          git push origin HEAD:${{ github.head_ref }}
