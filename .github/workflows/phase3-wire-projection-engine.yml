name: Phase 3 wire projection engine

on:
  push:
    branches:
      - refactor/database-projection-sync-v10-20260917

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-projection-sync-v10-20260917
          fetch-depth: 0
      - name: Wire projection engine and register test
        run: |
          python - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          text = package.read_text()
          marker = '    "test:projection-edge": "tsx scripts/tests/test-projection-edge-cases.ts",\n'
          replacement = marker + '    "test:projection-rebuild": "tsx scripts/tests/test-projection-rebuild.ts",\n'
          if text.count(marker) != 1:
              raise SystemExit(f'package projection marker count={text.count(marker)}')
          package.write_text(text.replace(marker, replacement, 1))

          practice = Path('src/lib/db/db-practice.ts')
          text = practice.read_text()
          old_imports = 'import { updatePracticeRunStatsInTx } from "./db-practice-stats";\nimport { addAttemptToStats, addDailyStats, updateReviewRoundProgressForAttemptInTx } from "./db-attempt-projections";\n'
          new_imports = 'import { applyAttemptProjectionInTx, applyPracticeRunProjectionInTx } from "./projection-engine";\n'
          if text.count(old_imports) != 1:
              raise SystemExit(f'projection import marker count={text.count(old_imports)}')
          text = text.replace(old_imports, new_imports, 1)
          if text.count('  datePart,\n') != 1:
              raise SystemExit(f'datePart import marker count={text.count("  datePart,\\n")}')
          text = text.replace('  datePart,\n', '', 1)
          direct_attempt = '    await studyDb.questionProgress.put(addAttemptToStats(await studyDb.questionProgress.get(input.questionId), attempt));\n    await studyDb.questionDailyProgress.put(addDailyStats(await studyDb.questionDailyProgress.get([datePart(timestamp), input.questionId]), attempt));\n'
          if text.count(direct_attempt) != 1:
              raise SystemExit(f'direct attempt projection marker count={text.count(direct_attempt)}')
          text = text.replace(direct_attempt, '    await applyAttemptProjectionInTx(attempt);\n', 1)
          if text.count('await updatePracticeRunStatsInTx(') < 1:
              raise SystemExit('practice run projection calls not found')
          text = text.replace('await updatePracticeRunStatsInTx(', 'await applyPracticeRunProjectionInTx(')
          old_review = '      await updateReviewRoundProgressForAttemptInTx(reviewRoundId, input.questionId, attempt);\n'
          if text.count(old_review) != 1:
              raise SystemExit(f'review projection marker count={text.count(old_review)}')
          text = text.replace(old_review, '', 1)
          practice.write_text(text)
          PY
          git diff --check
      - name: Commit wiring and remove one-shot workflow
        run: |
          git rm .github/workflows/phase3-wire-projection-engine.yml
          git add package.json src/lib/db/db-practice.ts
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: route projection writes through engine"
          git push origin HEAD:refactor/database-projection-sync-v10-20260917
