name: Deepen PR29 sync safety

on:
  push:
    branches: [fix/ios-sync-local-install-progress]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-sync-local-install-progress
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply deeper sync fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch target in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Bound reconcile planning memory and only update changed image descriptors.
          p = Path('src/lib/db/db-v7-reconcile.ts')
          text = p.read_text()
          text = text.replace(
              'const RECONCILE_BATCH_SIZE = 150;\nconst RECONCILE_STALL_TIMEOUT_MS = 30_000;',
              'const RECONCILE_BATCH_SIZE = 150;\nconst RECONCILE_PLAN_READ_BATCH_SIZE = 500;\nconst RECONCILE_STALL_TIMEOUT_MS = 30_000;',
              1,
          )
          old_plan = '''async function planTable<T>(table: Table<T, string>, incoming: readonly T[], keyOf: (row: T) => string | undefined): Promise<ReconcilePlan<T>> {\n  const current = await table.toArray();\n  const currentByKey = new Map<string, T>();\n  for (const row of current) {\n    const key = keyOf(row);\n    if (key === undefined) throw new Error(`本机 ${table.name} 存在缺少主键的记录，无法安全增量同步。`);\n    currentByKey.set(key, row);\n  }\n  const incomingKeys = new Set<string>();\n  const puts: T[] = [];\n\n  for (const row of incoming) {\n    const key = keyOf(row);\n    if (key === undefined) throw new Error(`远端 ${table.name} 存在缺少主键的记录，无法安全增量同步。`);\n    incomingKeys.add(key);\n    const old = currentByKey.get(key);\n    if (old === undefined || !equivalent(old, row)) puts.push(row);\n  }\n\n  const deletes = [...currentByKey.keys()].filter((key) => !incomingKeys.has(key));\n  return { puts, deletes };\n}\n'''
          new_plan = '''async function planTable<T>(table: Table<T, string>, incoming: readonly T[], keyOf: (row: T) => string | undefined): Promise<ReconcilePlan<T>> {\n  // Read only primary keys up front, then compare incoming rows in bounded chunks.\n  // This keeps WKWebView from materializing an entire large object store (notably\n  // attempts) in JS merely to discover that nearly every row is unchanged.\n  const rawCurrentKeys = await table.toCollection().primaryKeys();\n  const currentKeys = rawCurrentKeys.map((key) => {\n    if (typeof key !== "string") throw new Error(`本机 ${table.name} 存在非字符串主键，无法安全增量同步。`);\n    return key;\n  });\n  const incomingKeys = new Set<string>();\n  const puts: T[] = [];\n\n  for (let index = 0; index < incoming.length; index += RECONCILE_PLAN_READ_BATCH_SIZE) {\n    const rows = incoming.slice(index, index + RECONCILE_PLAN_READ_BATCH_SIZE);\n    const keys = rows.map((row) => {\n      const key = keyOf(row);\n      if (key === undefined) throw new Error(`远端 ${table.name} 存在缺少主键的记录，无法安全增量同步。`);\n      if (incomingKeys.has(key)) throw new Error(`远端 ${table.name} 存在重复主键 ${key}，无法安全增量同步。`);\n      incomingKeys.add(key);\n      return key;\n    });\n    const current = await table.bulkGet(keys);\n    for (let offset = 0; offset < rows.length; offset += 1) {\n      const old = current[offset];\n      if (old === undefined || !equivalent(old, rows[offset])) puts.push(rows[offset]);\n    }\n  }\n\n  const deletes = currentKeys.filter((key) => !incomingKeys.has(key));\n  return { puts, deletes };\n}\n\nfunction canonicalImageDescriptor(asset: {\n  id: string; mimeType: string; size: number; width: number; height: number; remote?: unknown;\n}): Record<string, unknown> {\n  return {\n    id: asset.id, mimeType: asset.mimeType, size: asset.size, width: asset.width, height: asset.height,\n    ...(asset.remote !== undefined ? { remote: asset.remote } : {}),\n  };\n}\n\nasync function planImageAssets(incoming: V7RestoreState["imageAssets"]): Promise<{\n  updates: V7RestoreState["imageAssets"]; inserts: V7RestoreState["imageAssets"]; deletes: string[];\n}> {\n  const rawCurrentKeys = await dbV7.imageAssets.toCollection().primaryKeys();\n  const currentKeys = rawCurrentKeys.map((key) => {\n    if (typeof key !== "string") throw new Error("本机 imageAssets 存在非字符串主键，无法安全增量同步。");\n    return key;\n  });\n  const currentIds = new Set(currentKeys);\n  const incomingIds = new Set<string>();\n  const updates: V7RestoreState["imageAssets"] = [];\n  const inserts: V7RestoreState["imageAssets"] = [];\n  const existing: V7RestoreState["imageAssets"] = [];\n\n  for (const asset of incoming) {\n    if (incomingIds.has(asset.id)) throw new Error(`远端 imageAssets 存在重复主键 ${asset.id}，无法安全增量同步。`);\n    incomingIds.add(asset.id);\n    if (currentIds.has(asset.id)) existing.push(asset);\n    else inserts.push(asset);\n  }\n\n  // Blob bytes remain local cache data. Compare only the small descriptor and\n  // do so in bounded chunks, so unchanged images produce zero IndexedDB writes\n  // without materializing every cached Blob at once.\n  for (let index = 0; index < existing.length; index += RECONCILE_PLAN_READ_BATCH_SIZE) {\n    const rows = existing.slice(index, index + RECONCILE_PLAN_READ_BATCH_SIZE);\n    const current = await dbV7.imageAssets.bulkGet(rows.map((asset) => asset.id));\n    for (let offset = 0; offset < rows.length; offset += 1) {\n      const old = current[offset];\n      if (!old) inserts.push(rows[offset]);\n      else if (!equivalent(canonicalImageDescriptor(old), canonicalImageDescriptor(rows[offset]))) updates.push(rows[offset]);\n    }\n  }\n\n  return { updates, inserts, deletes: currentKeys.filter((id) => !incomingIds.has(id)) };\n}\n'''
          if old_plan not in text:
              raise SystemExit('planTable patch target missing')
          text = text.replace(old_plan, new_plan, 1)
          old_images = '''  // Images keep cached Blob bytes. Inspect only keys while planning; descriptor\n  // updates below use bulkUpdate and never round-trip every Blob through JS.\n  const existingAssetKeys = await dbV7.imageAssets.toCollection().primaryKeys();\n  const existingAssetIds = new Set(existingAssetKeys.filter((key): key is string => typeof key === "string"));\n  const incomingAssetIds = new Set(state.imageAssets.map((asset) => asset.id));\n  const removedAssetIds = [...existingAssetIds].filter((id) => !incomingAssetIds.has(id));\n  const existingDescriptors = state.imageAssets.filter((asset) => existingAssetIds.has(asset.id));\n  const newDescriptors = state.imageAssets.filter((asset) => !existingAssetIds.has(asset.id));\n'''
          new_images = '''  const imagePlan = await planImageAssets(state.imageAssets);\n'''
          if old_images not in text:
              raise SystemExit('image planning target missing')
          text = text.replace(old_images, new_images, 1)
          text = text.replace(
              '    + removedAssetIds.length + existingDescriptors.length + newDescriptors.length;',
              '    + imagePlan.deletes.length + imagePlan.updates.length + imagePlan.inserts.length;',
              1,
          )
          old_apply = '''      for (let index = 0; index < removedAssetIds.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = removedAssetIds.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkDelete(chunk);\n        progress(chunk.length, "清理图片索引");\n      }\n      for (let index = 0; index < existingDescriptors.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = existingDescriptors.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkUpdate(chunk.map((asset) => ({\n          key: asset.id,\n          changes: {\n            mimeType: asset.mimeType,\n            size: asset.size,\n            width: asset.width,\n            height: asset.height,\n            remote: asset.remote,\n            ...(asset.blob ? { blob: asset.blob } : {}),\n          },\n        })));\n        progress(chunk.length, "更新图片索引");\n      }\n      for (let index = 0; index < newDescriptors.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = newDescriptors.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkPut(chunk);\n        progress(chunk.length, "写入图片索引");\n      }\n'''
          new_apply = '''      for (let index = 0; index < imagePlan.deletes.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = imagePlan.deletes.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkDelete(chunk);\n        progress(chunk.length, "清理图片索引");\n      }\n      for (let index = 0; index < imagePlan.updates.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = imagePlan.updates.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkUpdate(chunk.map((asset) => ({\n          key: asset.id,\n          changes: {\n            mimeType: asset.mimeType,\n            size: asset.size,\n            width: asset.width,\n            height: asset.height,\n            remote: asset.remote,\n          },\n        })));\n        progress(chunk.length, "更新图片索引");\n      }\n      for (let index = 0; index < imagePlan.inserts.length; index += RECONCILE_BATCH_SIZE) {\n        const chunk = imagePlan.inserts.slice(index, index + RECONCILE_BATCH_SIZE);\n        await dbV7.imageAssets.bulkPut(chunk);\n        progress(chunk.length, "写入图片索引");\n      }\n'''
          if old_apply not in text:
              raise SystemExit('image apply target missing')
          text = text.replace(old_apply, new_apply, 1)
          p.write_text(text)

          # 2) Full remote restore means FULL history, and it reports real reconcile progress.
          p = Path('src/lib/sync/sync-v7-orchestrator.ts')
          text = p.read_text()
          old_restore = '''    const historySyncStart = historySyncStartFor(settings);\n    const downloaded = await downloadRemoteV7(client, read.head, undefined, (fraction, label) => report(progress, "download", label, bandPercent(bands.download, fraction), bands.download[1]), { historySyncStart });\n    const projection = filterProjectionHistoryV7(replayInWireOrder(await projectionFromCheckpoint(downloaded.checkpoint), downloaded.changes, (done, total) => report(progress, "merge", `正在回放远端变更（${done}/${total}）`, bandPercent(bands.merge, total ? done / total : 1), bands.merge[1])), historySyncStart);\n    report(progress, "merge", `正在写入 ${projection.questions.length.toLocaleString("zh-CN")} 道题到本机`, bandPercent(bands.install, 0.3), bands.install[1]);\n    const installed = await installProjection(projection, { queueGuard: queueSnapshot, clearChangeSets: true });\n'''
          new_restore = '''    // Explicit "remote full restore" deliberately ignores the device-local history\n    // window. Ordinary sync continues to honor historySyncStart, but a recovery\n    // action must restore every remote attempt/run exactly as its UI promises.\n    const downloaded = await downloadRemoteV7(client, read.head, undefined, (fraction, label) => report(progress, "download", label, bandPercent(bands.download, fraction), bands.download[1]), {});\n    const projection = replayInWireOrder(await projectionFromCheckpoint(downloaded.checkpoint), downloaded.changes, (done, total) => report(progress, "merge", `正在回放远端变更（${done}/${total}）`, bandPercent(bands.merge, total ? done / total : 1), bands.merge[1]));\n    report(progress, "merge", `正在比较本机数据（远端 ${projection.questions.length.toLocaleString("zh-CN")} 道题、${projection.attempts.length.toLocaleString("zh-CN")} 条作答）`, bandPercent(bands.install, 0.02), bands.install[1]);\n    const installed = await installProjection(projection, {\n      queueGuard: queueSnapshot,\n      clearChangeSets: true,\n      onProgress: ({ completed, total, label }) => {\n        const fraction = total ? completed / total : 1;\n        report(progress, "merge", `${label}（${completed.toLocaleString("zh-CN")}/${total.toLocaleString("zh-CN")}）`, bandPercent(bands.install, fraction), bands.install[1]);\n      },\n    });\n'''
          if old_restore not in text:
              raise SystemExit('restore progress/history target missing')
          text = text.replace(old_restore, new_restore, 1)
          text = text.replace(
              '    await saveRemoteCache(settings, checkpoint, read.cache);',
              '    await saveRemoteCache({ ...settings, historySyncStart: undefined }, checkpoint, read.cache);',
              1,
          )
          text = text.replace(
              ', skippedArchivedPracticeRuns: downloaded.skippedArchivedPracticeRuns, historySyncStart };',
              ', skippedArchivedPracticeRuns: downloaded.skippedArchivedPracticeRuns };',
              1,
          )
          p.write_text(text)

          # 3) Runtime regression: image no-op, exact descriptor update, bounded planning.
          p = Path('scripts/tests/test-sync-incremental-install.ts')
          text = p.read_text()
          text = text.replace(
              'function projection(questions: QuestionV7[]): ChangeSetProjectionV7 {',
              'function projection(questions: QuestionV7[], imageAssets: ChangeSetProjectionV7["imageAssets"] = []): ChangeSetProjectionV7 {',
              1,
          ).replace('    imageAssets: [],', '    imageAssets,', 1)
          marker = '''  assert.equal(finalProgressLabel, "本机数据无需改写", "property-order-only differences must not create needless IndexedDB writes");\n'''
          addition = '''  assert.equal(finalProgressLabel, "本机数据无需改写", "property-order-only differences must not create needless IndexedDB writes");\n\n  const imageDescriptor = { id: "a".repeat(64), mimeType: "image/webp" as const, size: 4, width: 1, height: 1 };\n  await dbV7.imageAssets.put({ ...imageDescriptor, blob: new Blob(["img"], { type: "image/webp" }) });\n  let imageBulkUpdateRows = 0;\n  const originalImageBulkUpdate = dbV7.imageAssets.bulkUpdate.bind(dbV7.imageAssets);\n  dbV7.imageAssets.bulkUpdate = ((updates) => {\n    imageBulkUpdateRows += updates.length;\n    return originalImageBulkUpdate(updates);\n  }) as typeof dbV7.imageAssets.bulkUpdate;\n  try {\n    let imageNoOpLabel = "";\n    const imageNoOp = await installProjection(projection([reorderedFirst], [imageDescriptor]), {\n      onProgress: (progress) => { imageNoOpLabel = progress.label; },\n    });\n    assert.equal(imageNoOp, true);\n    assert.equal(imageBulkUpdateRows, 0, "unchanged image descriptors must not generate IndexedDB writes");\n    assert.equal(imageNoOpLabel, "本机数据无需改写", "unchanged image descriptors must remain a true no-op");\n    assert.ok((await dbV7.imageAssets.get(imageDescriptor.id))?.blob instanceof Blob, "no-op reconcile must preserve the cached Blob");\n\n    const changedDescriptor = { ...imageDescriptor, width: 2 };\n    await installProjection(projection([reorderedFirst], [changedDescriptor]));\n    assert.equal(imageBulkUpdateRows, 1, "a genuinely changed image descriptor must update exactly once");\n    const changedImage = await dbV7.imageAssets.get(imageDescriptor.id);\n    assert.equal(changedImage?.width, 2);\n    assert.ok(changedImage?.blob instanceof Blob, "descriptor updates must preserve the cached Blob bytes");\n  } finally {\n    dbV7.imageAssets.bulkUpdate = originalImageBulkUpdate;\n  }\n\n  const manyQuestions = Array.from({ length: 501 }, (_, index) => question(`bulk-${index}`, `分块比较 ${index}`));\n  let questionBulkGetCalls = 0;\n  const originalQuestionBulkGet = dbV7.questions.bulkGet.bind(dbV7.questions);\n  dbV7.questions.bulkGet = ((keys) => {\n    questionBulkGetCalls += 1;\n    return originalQuestionBulkGet(keys);\n  }) as typeof dbV7.questions.bulkGet;\n  try {\n    await installProjection(projection(manyQuestions));\n  } finally {\n    dbV7.questions.bulkGet = originalQuestionBulkGet;\n  }\n  assert.ok(questionBulkGetCalls >= 2, "large projection planning must compare rows in bounded bulkGet chunks rather than materializing the whole table");\n'''
          if marker not in text:
              raise SystemExit('incremental test insertion target missing')
          text = text.replace(marker, addition, 1)
          p.write_text(text)

          # 4) Full restore regression: new question types, real progress, history-range override, crash-state self-heal.
          p = Path('scripts/tests/test-sync-restore-question-types.ts')
          text = p.read_text()
          text = text.replace(
              'import { createBankV7, createQuestionV7, dbV7, resetV7Database } from "../../src/lib/db/db-v7";',
              'import { createBankV7, createPracticeRunV7, createQuestionV7, dbV7, recordPracticeAnswerV7, resetV7Database, setPracticeRunStatusV7 } from "../../src/lib/db/db-v7";',
              1,
          )
          text = text.replace(
              '  await createQuestionV7(bank.id, {\n    type: "填空",',
              '  const fillQuestion = await createQuestionV7(bank.id, {\n    type: "填空",',
              1,
          )
          after_questions = '''  await createQuestionV7(bank.id, {\n    type: "简答",\n    content: [{ id: "short-stem", type: "text", text: "远程恢复简答题" }],\n    options: [],\n    answer: "简答参考答案",\n    tags: ["恢复"],\n  });\n  await syncWithGitHub(settings, "qa-token");\n'''
          replacement = '''  await createQuestionV7(bank.id, {\n    type: "简答",\n    content: [{ id: "short-stem", type: "text", text: "远程恢复简答题" }],\n    options: [],\n    answer: "简答参考答案",\n    tags: ["恢复"],\n  });\n  const oldRun = await createPracticeRunV7({\n    bankId: bank.id, bankIds: [bank.id], questionIds: [fillQuestion.id],\n    startedAt: "2025-01-01T00:00:00.000Z", updatedAt: "2025-01-01T00:00:00.000Z",\n  });\n  await recordPracticeAnswerV7({\n    runId: oldRun.id, questionId: fillQuestion.id, bankId: bank.id, selected: ["旧答案"],\n    correct: true, elapsedMs: 1000, createdAt: "2025-01-01T00:01:00.000Z",\n  });\n  await setPracticeRunStatusV7(oldRun.id, "completed");\n  await syncWithGitHub(settings, "qa-token");\n'''
          if after_questions not in text:
              raise SystemExit('restore test question target missing')
          text = text.replace(after_questions, replacement, 1)
          old_call = '''  currentDeviceId = "restore-types-b";\n  await resetV7Database();\n  await restoreFullHistoryFromGitHub(settings, "qa-token");\n\n  const restored = await dbV7.questions.toArray();\n'''
          new_call = '''  currentDeviceId = "restore-types-b";\n  await resetV7Database();\n  const restoreProgress: string[] = [];\n  const rangedSettings = { ...settings, historySyncStart: "2026-01-01" };\n  await restoreFullHistoryFromGitHub(rangedSettings, "qa-token", (item) => { restoreProgress.push(item.label); });\n\n  assert.ok(restoreProgress.some((label) => /(更新题目|更新作答记录|本机增量更新完成)/.test(label) && /（\\d+\\/\\d+）/.test(label)), "remote restore must expose real local completed/total progress");\n  const restored = await dbV7.questions.toArray();\n'''
          if old_call not in text:
              raise SystemExit('restore call target missing')
          text = text.replace(old_call, new_call, 1)
          end_marker = '''  assert.equal(restored.length, 2, "remote restore should recover both questions");\n\n  console.log("remote restore question-type regression passed");\n'''
          end_replacement = '''  assert.equal(restored.length, 2, "remote restore should recover both questions");\n  assert.equal(await dbV7.attempts.count(), 1, "explicit full remote restore must ignore historySyncStart and recover older attempts");\n  assert.equal(await dbV7.practiceRuns.count(), 1, "explicit full remote restore must recover older completed runs");\n\n  // Simulate a crash after projection install but before sync metadata/cache was\n  // persisted. The next sync must self-heal from remote state and preserve a new\n  // local edit created in that interrupted state.\n  await dbV7.syncMeta.clear();\n  const localAfterCrash = await createQuestionV7(bank.id, {\n    type: "单选",\n    content: [{ id: "crash-stem", type: "text", text: "恢复中断后新增题" }],\n    options: [[{ id: "crash-a", type: "text", text: "A" }], [{ id: "crash-b", type: "text", text: "B" }]],\n    answer: "A",\n    tags: ["恢复"],\n  });\n  let questionClearCalls = 0;\n  const originalQuestionClear = dbV7.questions.clear.bind(dbV7.questions);\n  dbV7.questions.clear = (() => {\n    questionClearCalls += 1;\n    return originalQuestionClear();\n  }) as typeof dbV7.questions.clear;\n  try {\n    await syncWithGitHub(settings, "qa-token");\n  } finally {\n    dbV7.questions.clear = originalQuestionClear;\n  }\n  assert.ok(await dbV7.questions.get(localAfterCrash.id), "metadata-interrupted recovery must preserve a newly queued local edit");\n  assert.equal(await dbV7.attempts.count(), 1, "metadata-interrupted recovery must retain restored remote history");\n  assert.equal(questionClearCalls, 0, "metadata-interrupted recovery must reconcile without clearing the projection");\n\n  console.log("remote restore question-type/history/progress/crash-recovery regression passed");\n'''
          if end_marker not in text:
              raise SystemExit('restore test final target missing')
          text = text.replace(end_marker, end_replacement, 1)
          p.write_text(text)
          PY
      - run: npm ci
      - name: Incremental reconcile regression
        run: npm run test:sync-incremental-install
      - name: Full remote restore regression
        run: npm run test:sync-restore-question-types
      - name: Sync progress regression
        run: npm run test:sync-progress
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture and registration
        run: npm run test:architecture
      - name: Production build
        run: npm run build
      - name: Commit verified deeper fixes
        shell: bash
        run: |
          git rm .github/workflows/deepen-pr29-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db/db-v7-reconcile.ts src/lib/sync/sync-v7-orchestrator.ts scripts/tests/test-sync-incremental-install.ts scripts/tests/test-sync-restore-question-types.ts
          git commit -m "fix(sync): bound reconcile memory and harden full restore"
          git push origin HEAD:fix/ios-sync-local-install-progress
