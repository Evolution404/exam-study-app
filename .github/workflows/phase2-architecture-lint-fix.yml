name: Phase 2 architecture lint fix

on:
  push:
    branches:
      - refactor/database-facts-projections-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-facts-projections-20260917
          fetch-depth: 0
      - name: Remove redundant regex escape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tools/check-architecture.mjs')
          lines = path.read_text().splitlines(keepends=True)
          indexes = [i for i, line in enumerate(lines) if line.startswith('if (/message:')]
          if len(indexes) != 1:
              raise SystemExit(f'expected one message protocol guard, found {len(indexes)}')
          index = indexes[0]
          if lines[index].count('\\"') != 1:
              raise SystemExit(f'expected one redundant quote escape, found {lines[index].count(chr(92) + chr(34))}')
          lines[index] = lines[index].replace('\\"', '"', 1)
          path.write_text(''.join(lines))
          PY
          git diff --check
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/phase2-architecture-lint-fix.yml
          git add scripts/tools/check-architecture.mjs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: fix architecture guard lint"
          git push origin HEAD:refactor/database-facts-projections-20260917
