name: Apply v8 compression compatibility

on:
  push:
    branches: [sync/v8-history-archive]
  pull_request:
    branches: [sync/v7-live-gc]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v8-compression-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/v8-history-archive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatibility migration
        run: |
          if grep -q 'decodedCheckpoint = await decodeRemoteCheckpoint' src/lib/sync/sync-v7-tools.ts; then
            echo 'v8 compression compatibility already applied'
          else
            node scripts/tools/fix-v8-compression-migration.mjs
          fi
      - run: npm run typecheck
      - run: npm run test:sync-compression
      - run: npx tsx scripts/tests/test-sync-v8-history.ts
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/lib/sync/sync-v7-tools.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(sync): support v8 checkpoints in compression migration [v8-compression-generated]'
          git push origin HEAD:sync/v8-history-archive
