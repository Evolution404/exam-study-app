# Final PR26 short-answer regression fix. The same atomic run also removes
# transitional shared color declarations already owned by Practice.
name: PR26 Short Answer Regression

on:
  push:
    branches: [refactor/search-residual-ownership]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[short-answer-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/search-residual-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Fix short-answer UX, type coverage and remove transitional CSS debt
        shell: python
        run: |
          from pathlib import Path

          manager = Path('src/app/bank/bank-library/question-manager.tsx')
          text = manager.read_text()
          old = 'options={["全部", "单选", "多选", "判断", "计算"].map((value) => ({ value, label: value }))}'
          new = 'options={["全部", "单选", "多选", "判断", "填空", "简答", "计算"].map((value) => ({ value, label: value }))}'
          if old not in text:
              raise SystemExit('question-manager type option list not found')
          manager.write_text(text.replace(old, new, 1))

          practice = Path('src/app/shell/views/practice.tsx')
          text = practice.read_text()
          old = '''{submitted && <><div className={`result-box ${correct ? "success" : "error"}`}><strong>{correct ? (autoAdvancing ? "回答正确，即将进入下一题" : "回答正确") : gaveUp ? "已标记为不会，并计入错题" : "这次没有答对"}</strong>{correct ? <p>正确答案：{displayAnswer}</p> : preferences.showAnswerOnWrong ? <p>正确答案：{displayAnswer}｜你的选择：{selectedAnswer || "不会"}</p> : <p>正确答案已按配置隐藏｜你的选择：{selectedAnswer || "不会"}</p>}</div><div className="attempt-summary">'''
          new = '''{submitted && <><div className={`result-box ${correct ? "success" : "error"}`}>{question.type === "简答" ? <><strong>{shortOutcome === "correct" ? (autoAdvancing ? "已标记正确，即将进入下一题" : "已标记正确") : shortOutcome === "skipped" ? "已跳过，并计入错题" : "已标记错误"}</strong><p>本题按自评记录，参考答案见上方。</p></> : <><strong>{correct ? (autoAdvancing ? "回答正确，即将进入下一题" : "回答正确") : gaveUp ? "已标记为不会，并计入错题" : "这次没有答对"}</strong>{correct ? <p>正确答案：{displayAnswer}</p> : preferences.showAnswerOnWrong ? <p>正确答案：{displayAnswer}｜你的选择：{selectedAnswer || "不会"}</p> : <p>正确答案已按配置隐藏｜你的选择：{selectedAnswer || "不会"}</p>}</>}</div><div className="attempt-summary">'''
          if old not in text:
              raise SystemExit('practice generic result box block not found')
          practice.write_text(text.replace(old, new, 1))

          css = Path('src/app/practice/practice-main-2.css')
          text = css.read_text()
          marker = '\n/* Short-answer practice owns its complete layout and self-grading presentation. */\n'
          if marker not in text:
              text += marker + '''.short-answer-card{margin:16px 0 4px;display:grid;gap:14px}\n.short-answer-card>label{display:grid;gap:8px}\n.short-answer-card>label>span{color:var(--color-text-muted);font-size:12px;font-weight:700}\n.short-answer-card textarea{width:100%;min-height:168px;box-sizing:border-box;border:1px solid var(--color-border);border-radius:14px;padding:14px 16px;resize:vertical;color:var(--color-text);background:var(--color-surface-raised);font:inherit;font-size:15px;line-height:1.75;outline:none}\n.short-answer-card textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 12%,transparent)}\n.short-answer-card textarea:disabled{resize:none;color:var(--color-text);background:var(--color-surface-muted);opacity:1}\n.short-reference{padding:17px 19px;border:1px solid color-mix(in srgb,var(--color-primary) 22%,var(--color-border));border-radius:14px;color:var(--color-text);background:var(--color-primary-soft)}\n.short-reference strong{display:block;margin-bottom:7px;font-size:13px}\n.short-reference p{margin:0;white-space:pre-wrap;color:var(--color-text-muted);font-size:12px;line-height:1.75}\n.short-grade-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.short-grade-actions .secondary{min-height:42px;padding:9px 13px}\n.practice-actions:has(.short-grade-actions)>div{flex-wrap:wrap;justify-content:flex-end}\n@media(max-width:760px){.short-answer-card textarea{min-height:150px;font-size:16px}.short-grade-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.short-grade-actions .secondary{width:100%;padding-inline:8px}.practice-actions:has(.short-grade-actions)>div{width:100%}}\n'''
          css.write_text(text)

          # Remove only declarations that are already overridden later by practice-main-2.css.
          # Structural layout remains shared; Practice is the sole owner of state colors.
          cleanup = {
            'src/app/styles/shared-core-1.css': [
              ('.options button { position:relative; min-height:58px; border:1px solid var(--p-dedbd3); border-radius:13px; background:var(--p-fff); padding:10px 50px 10px 15px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}', '.options button { position:relative; min-height:58px; border:1px solid; border-radius:13px; padding:10px 50px 10px 15px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}'),
              ('.options button>span{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--p-efede7);font-weight:700}', '.options button>span{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;font-weight:700}'),
              ('.options .selected { border-color:var(--p-5d846f); background:var(--p-eef4f0); }\n', ''),
              ('.options .selected>span,.options .right>span { background:var(--p-3f6d56); color:var(--p-fff); }\n', ''),
              ('.options .right { border-color:var(--p-66a17e); background:var(--p-edf7f0); }\n', ''),
              ('.options .wrong { border-color:var(--p-c67c5a); background:var(--p-fff2ed); }\n', ''),
              ('.options .wrong>span { background:var(--p-b96641); color:var(--p-fff); }\n', ''),
            ],
            'src/app/styles/shared-core-2.css': [
              ('.overview-legend { padding:12px 24px; border-bottom:1px solid var(--p-e7e3db); display:flex; flex-wrap:wrap; gap:17px; color:var(--p-767e79); font-size:10px; }', '.overview-legend { padding:12px 24px; border-bottom:1px solid; display:flex; flex-wrap:wrap; gap:17px; font-size:10px; }'),
              ('.overview-legend i { width:11px; height:11px; border:1px solid var(--p-c8ccc8); border-radius:50%; background:var(--p-fff); }', '.overview-legend i { width:11px; height:11px; border:1px solid; border-radius:50%; }'),
              ('.overview-legend i.correct { border-color:var(--p-4f9770); background:var(--p-4f9770); }\n', ''),
              ('.overview-legend i.wrong { border-color:var(--p-ce7053); background:var(--p-ce7053); }\n', ''),
              ('.overview-legend i.pending { border-color:var(--p-d09a4a); background:var(--p-f1c776); }\n', ''),
              ('.overview-number-grid button { aspect-ratio:1; min-width:0; border:1px solid var(--p-ccd0cc); border-radius:50%; color:var(--p-56605a); background:var(--p-fff); cursor:pointer; font-weight:700; }', '.overview-number-grid button { aspect-ratio:1; min-width:0; border:1px solid; border-radius:50%; cursor:pointer; font-weight:700; }'),
              ('.overview-number-grid button.correct { border-color:var(--p-4f9770); color:var(--p-fff); background:var(--p-4f9770); }\n', ''),
              ('.overview-number-grid button.wrong { border-color:var(--p-ce7053); color:var(--p-fff); background:var(--p-ce7053); }\n', ''),
              ('.overview-number-grid button.pending { border-color:var(--p-d09a4a); color:var(--p-755627); background:var(--p-f3ce88); }\n', ''),
              ('.overview-empty { margin:0; padding:13px; border:1px dashed var(--p-d5d4cd); border-radius:10px; color:var(--p-969994); font-size:11px; text-align:center; }', '.overview-empty { margin:0; padding:13px; border:1px dashed; border-radius:10px; font-size:11px; text-align:center; }'),
            ],
            'src/app/styles/shared-core-3.css': [
              ('.history-filters button{border:1px solid var(--p-d8d8d1);border-radius:99px;padding:7px 10px;display:flex;gap:6px;color:var(--p-66716a);background:var(--p-fff);cursor:pointer;white-space:nowrap}', '.history-filters button{border:1px solid;border-radius:99px;padding:7px 10px;display:flex;gap:6px;cursor:pointer;white-space:nowrap}'),
              ('.history-filters button span{min-width:18px;border-radius:99px;color:var(--p-758079);background:var(--p-eceae4);font-size:9px}', '.history-filters button span{min-width:18px;border-radius:99px;font-size:9px}'),
              ('.history-filters button.active{border-color:var(--p-527a64);color:var(--p-315f47);background:var(--p-e5efe8)}\n', ''),
              ('.history-swipe-content{position:relative;background:var(--p-fff);touch-action:pan-y;transition:transform .18s ease;will-change:transform}', '.history-swipe-content{position:relative;touch-action:pan-y;transition:transform .18s ease;will-change:transform}'),
              ('.history-card-actions button{width:31px;height:31px;border:1px solid var(--p-cbdad1);border-radius:9px;display:grid;place-items:center;color:var(--p-35644d);background:var(--color-surface-muted);cursor:pointer}', '.history-card-actions button{width:31px;height:31px;border:1px solid;border-radius:9px;display:grid;place-items:center;cursor:pointer}'),
              ('.history-card-actions .abandon{border-color:var(--p-ead4cb);color:var(--p-a45238);background:var(--p-fbf0eb)}\n', ''),
              ('.run-status.in_progress{color:var(--p-3e684f);background:var(--p-dfece4)}\n', ''),
              ('.run-status.completed{color:var(--p-456086);background:var(--p-e2e7f1)}\n', ''),
              ('.run-status.abandoned{color:var(--p-8a5a48);background:var(--p-f0e4dd)}\n', ''),
            ],
          }
          for filename, replacements in cleanup.items():
              p = Path(filename)
              source = p.read_text()
              for old_rule, new_rule in replacements:
                  if old_rule not in source:
                      raise SystemExit(f'transitional rule not found in {filename}: {old_rule[:70]}')
                  source = source.replace(old_rule, new_rule, 1)
              p.write_text(source)

          test = Path('scripts/tests/test-search-filters.ts')
          text = test.read_text()
          old_scan = '''const stylesRoot = new URL("../../src/app/styles/", import.meta.url);\nconst componentStyles = fs.readdirSync(stylesRoot)\n  .filter((file) => file.endsWith(".css"))\n  .sort()\n  .map((file) => fs.readFileSync(new URL(file, stylesRoot), "utf8"))\n  .join("\\n");'''
          new_scan = '''const appStylesRoot = new URL("../../src/app/", import.meta.url);\nconst componentStyles = fs.readdirSync(appStylesRoot, { recursive: true })\n  .filter((file) => file.endsWith(".css"))\n  .sort()\n  .map((file) => fs.readFileSync(new URL(file, appStylesRoot), "utf8"))\n  .join("\\n");'''
          if old_scan in text:
              text = text.replace(old_scan, new_scan, 1)
          elif 'const appStylesRoot = new URL("../../src/app/", import.meta.url);' not in text:
              raise SystemExit('search-filter stylesheet scan block not found')

          anchor = 'const questionManagerSource = fs.readFileSync(new URL("../../src/app/bank/bank-library/question-manager.tsx", import.meta.url), "utf8");\n'
          extra_source = 'const practiceViewSource = fs.readFileSync(new URL("../../src/app/shell/views/practice.tsx", import.meta.url), "utf8");\n'
          if extra_source not in text:
              if anchor not in text:
                  raise SystemExit('questionManagerSource anchor not found')
              text = text.replace(anchor, anchor + extra_source, 1)

          assertion_anchor = 'assert.match(questionManagerSource, /<TagMultiSelect[^>]*selected=\\{selectedTags\\}/, "题库管理筛选必须支持可搜索标签多选");\n'
          regressions = '''assert.match(questionManagerSource, /options=\\{\\["全部", "单选", "多选", "判断", "填空", "简答", "计算"\\]/, "题库管理题型筛选必须覆盖全部正式 QuestionType，包含填空和简答");\nassert.match(componentStyles, /\\.short-answer-card>label\\{display:grid;gap:8px\\}/, "简答题回答区必须使用自有布局，不得退回浏览器默认 label 流式布局");\nassert.match(componentStyles, /\\.short-answer-card textarea\\{[^}]*width:100%[^}]*min-height:168px/, "简答题文本框必须占满回答区并具有稳定可用高度");\nassert.match(componentStyles, /\\.short-reference\\{[^}]*background:var\\(--color-primary-soft\\)/, "简答参考答案必须使用独立的轻量参考卡片");\nassert.match(componentStyles, /\\.short-grade-actions\\{[^}]*display:flex[^}]*flex-wrap:wrap/, "简答自评按钮必须有稳定布局而不是浏览器默认堆叠");\nassert.match(practiceViewSource, /question\\.type === "简答" \\? <><strong>\\{shortOutcome === "correct"/, "简答提交结果必须走自评专用摘要");\nassert.match(practiceViewSource, /本题按自评记录，参考答案见上方。/, "简答结果框不得重复整段参考答案");\n'''
          if regressions not in text:
              if assertion_anchor not in text:
                  raise SystemExit('test assertion anchor not found')
              text = text.replace(assertion_anchor, assertion_anchor + regressions, 1)
          test.write_text(text)

      - name: Fast checks
        run: npm run test:fast
      - name: CSS architecture
        run: node scripts/tools/check-css-architecture.mjs
      - name: Production build
        run: npm run build

      - name: Commit verified fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr26-short-answer-regression.yml
          git add src/app/bank/bank-library/question-manager.tsx src/app/shell/views/practice.tsx src/app/practice/practice-main-2.css src/app/styles/shared-core-1.css src/app/styles/shared-core-2.css src/app/styles/shared-core-3.css scripts/tests/test-search-filters.ts scripts/tools/css-architecture-baseline.json
          git commit -m "fix(practice): restore short-answer UX and reduce CSS debt [short-answer-fixed]"
          git push origin HEAD:refactor/search-residual-ownership
