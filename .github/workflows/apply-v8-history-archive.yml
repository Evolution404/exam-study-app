name: Apply v8 history archive

on:
  push:
    branches: [sync/v8-history-archive]
  pull_request:
    branches: [sync/v7-live-gc]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v8-history-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/v8-history-archive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply integration migration
        run: |
          if grep -q 'SYNC_V8_HISTORY_PREFIX' src/lib/sync/sync-v7-head.ts; then
            echo 'v8 history integration already applied'
          else
            node scripts/tools/apply-v8-history-archive.mjs
          fi
      - run: npm run typecheck
      - run: npm run test:architecture
      - run: npm run test:sync-v7-protocol
      - run: npx tsx scripts/tests/test-sync-v8-history.ts
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/lib/sync/sync-v7-head.ts src/lib/sync/github-v7-remote.ts src/lib/sync/sync-v7-download.ts src/lib/sync/sync-v7-orchestrator.ts scripts/tools/check-architecture.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(sync): wire bounded v8 history checkpoints [v8-history-generated]'
          git push origin HEAD:sync/v8-history-archive
