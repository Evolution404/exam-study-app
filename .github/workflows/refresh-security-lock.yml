name: Refresh security lock

on:
  push:
    branches: [fix/security-transitive-deps]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/security-transitive-deps
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Refresh vulnerable transitive packages only
        run: npm update fast-uri js-yaml --package-lock-only --ignore-scripts
      - name: Verify patched versions and clean audit
        run: |
          node -e 'const l=require("./package-lock.json"); const p=l.packages; if(p["node_modules/fast-uri"]?.version!=="3.1.7") throw new Error(`fast-uri=${p["node_modules/fast-uri"]?.version}`); if(p["node_modules/js-yaml"]?.version!=="4.3.2") throw new Error(`js-yaml=${p["node_modules/js-yaml"]?.version}`);'
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          test "$(git diff --name-only)" = "package-lock.json"
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: patch vulnerable transitive dependencies"
          git push origin HEAD:fix/security-transitive-deps
