name: Apply bank enabled feature once

on:
  push:
    branches: [fix/ios-dark-startup-status-bar]
    paths: [.github/workflows/apply-bank-enabled-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ios-dark-startup-status-bar
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Apply bank visibility lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if s.count(old) < count:
                  raise SystemExit(f"missing replacement in {path}: {old[:100]!r}")
              s = s.replace(old, new, count)
              p.write_text(s)

          # Bank domain: optional wire field; missing means enabled for old checkpoints.
          replace('src/lib/db/v7-types.ts',
          '''export interface BankV7 extends Omit<LegacyBank, "questionCount"> {
            sortOrder: number;
            questionCount: number;
          }
          ''',
          '''export interface BankV7 extends Omit<LegacyBank, "questionCount"> {
            sortOrder: number;
            questionCount: number;
            /** Disabled banks stay synchronized/managed but are excluded from new study scopes. */
            enabled?: boolean;
          }

          export function isBankEnabled(bank: Pick<BankV7, "enabled">): boolean {
            return bank.enabled !== false;
          }
          ''')

          replace('src/lib/db/db-v7-bank.ts',
          '''import type { BankFolderV7, BankQuestionMembership, BankV7, QuestionV7 } from "./v7-types";''',
          '''import { isBankEnabled, type BankFolderV7, type BankQuestionMembership, type BankV7, type QuestionV7 } from "./v7-types";''')
          replace('src/lib/db/db-v7-bank.ts',
          '''    sortOrder: Number.isFinite(values.sortOrder) ? Number(values.sortOrder) : await dbV7.banks.count(),
            questionCount: 0,
          ''',
          '''    sortOrder: Number.isFinite(values.sortOrder) ? Number(values.sortOrder) : await dbV7.banks.count(),
            questionCount: 0,
            enabled: values.enabled ?? true,
          ''')
          replace('src/lib/db/db-v7-bank.ts',
          '''changes: Partial<Pick<BankV7, "name" | "displayName" | "description" | "color" | "folderId" | "sortOrder">>''',
          '''changes: Partial<Pick<BankV7, "name" | "displayName" | "description" | "color" | "folderId" | "sortOrder" | "enabled">>''')
          replace('src/lib/db/db-v7-bank.ts',
          '''export async function getQuestionsForBanksV7(bankIds: readonly string[]): Promise<QuestionV7[]> {
            const result: QuestionV7[] = [];
            const seen = new Set<string>();
            for (const bankId of uniqueStrings(bankIds)) {
          ''',
          '''export async function getQuestionsForBanksV7(bankIds: readonly string[]): Promise<QuestionV7[]> {
            const result: QuestionV7[] = [];
            const seen = new Set<string>();
            const requestedIds = uniqueStrings(bankIds);
            const enabledIds = (await dbV7.banks.bulkGet(requestedIds))
              .filter((bank): bank is BankV7 => Boolean(bank) && isBankEnabled(bank!))
              .map((bank) => bank.id);
            for (const bankId of enabledIds) {
          ''')

          # New imported banks default enabled; appending into an existing disabled bank must not re-enable it.
          replace('src/lib/db/db-v7-question.ts',
          '''      sortOrder: await dbV7.banks.count(),
                questionCount: 0,
                importedAt: timestamp,
          ''',
          '''      sortOrder: await dbV7.banks.count(),
                questionCount: 0,
                enabled: true,
                importedAt: timestamp,
          ''')

          # Checkpoint accepts old missing field but rejects dirty non-booleans.
          replace('src/lib/sync/sync-v7-checkpoint.ts',
          '''  assertSafeInt(value.questionCount, `state.banks[${index}].questionCount`);
            assertDate(value.importedAt, `state.banks[${index}].importedAt`);
          ''',
          '''  assertSafeInt(value.questionCount, `state.banks[${index}].questionCount`);
            if (value.enabled !== undefined && typeof value.enabled !== "boolean") fail(`state.banks[${index}].enabled must be boolean`);
            assertDate(value.importedAt, `state.banks[${index}].importedAt`);
          ''')

          # Management facade exposes the same canonical predicate and synced update field.
          replace('src/app/bank/bank-library/bank-library-shared.ts',
          '''import type { AttemptStatsV7, BankFolderV7, NoteV7, PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";''',
          '''import { isBankEnabled, type AttemptStatsV7, type BankFolderV7, type NoteV7, type PracticeRunV7, type QuestionTypeV7 } from "@/lib/db/v7-types";''')
          replace('src/app/bank/bank-library/bank-library-shared.ts',
          '''export type AttemptStats = AttemptStatsV7 & { bankId: string };

          export type BankQuickMode''',
          '''export type AttemptStats = AttemptStatsV7 & { bankId: string };
          export { isBankEnabled };

          export type BankQuickMode''')
          replace('src/app/bank/bank-library/bank-library-shared.ts',
          '''Partial<Pick<BankV7, "name" | "displayName" | "description" | "color" | "folderId" | "sortOrder">>''',
          '''Partial<Pick<BankV7, "name" | "displayName" | "description" | "color" | "folderId" | "sortOrder" | "enabled">>''')

          # AppShell owns the split between all managed banks and enabled study banks.
          replace('src/app/shell/app-shell.tsx',
          '''import type { ActivePractice, GitHubSettings } from "@/types/types";''',
          '''import type { ActivePractice, GitHubSettings } from "@/types/types";
          import { isBankEnabled } from "@/lib/db/v7-types";''')
          replace('src/app/shell/app-shell.tsx',
          '''  const banks = useLiveQuery(async () => (await dbV7.banks.toArray()).sort((a, b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999) || a.importedAt.localeCompare(b.importedAt)), []) ?? [];
            const validSelectedBankIds = selectedBankIds.filter((id) => banks.some((bank) => bank.id === id));
            const activeBankIds = validSelectedBankIds;
          ''',
          '''  const bankRows = useLiveQuery(async () => (await dbV7.banks.toArray()).sort((a, b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999) || a.importedAt.localeCompare(b.importedAt)), []);
            const banks = bankRows ?? [];
            const enabledBanks = banks.filter(isBankEnabled);
            const validSelectedBankIds = selectedBankIds.filter((id) => enabledBanks.some((bank) => bank.id === id));
            const activeBankIds = validSelectedBankIds;

            useEffect(() => {
              if (bankRows === undefined) return;
              const next = selectedBankIds.filter((id) => bankRows.some((bank) => bank.id === id && isBankEnabled(bank)));
              if (next.length === selectedBankIds.length && next.every((id, index) => id === selectedBankIds[index])) return;
              setSelectedBankIds(next);
              localStorage.setItem("study-current-banks", JSON.stringify(next));
            }, [bankRows, selectedBankIds]);
          ''')
          # Study-facing views get enabled banks; BankLibrary keeps all banks.
          for old, new in [
              ('<ShellTopbar banks={banks}', '<ShellTopbar banks={enabledBanks}'),
              ('<Dashboard groupSize={preferences.groupSize}', '<Dashboard groupSize={preferences.groupSize}'),
          ]:
              if old in Path('src/app/shell/app-shell.tsx').read_text():
                  replace('src/app/shell/app-shell.tsx', old, new)
          # Dashboard bank prop replacement scoped to its render line.
          replace('src/app/shell/app-shell.tsx', 'stats={stats} banks={banks} latestPracticeRun=', 'stats={stats} banks={enabledBanks} latestPracticeRun=')
          replace('src/app/shell/app-shell.tsx', 'rounds={reviewRounds} banks={banks} currentBankIds=', 'rounds={reviewRounds} banks={enabledBanks} currentBankIds=')
          replace('src/app/shell/app-shell.tsx', 'onStartTag={(tag) => { const bankIds = banks.map((bank) => bank.id);', 'onStartTag={(tag) => { const bankIds = enabledBanks.map((bank) => bank.id);')
          replace('src/app/shell/app-shell.tsx', '<PreferencesView preferences={preferences} rounds={reviewRounds} banks={banks}', '<PreferencesView preferences={preferences} rounds={reviewRounds} banks={enabledBanks}')
          replace('src/app/shell/app-shell.tsx', '<SearchView key={`search-${searchRevision}`} query={query} onQueryChange={setQuery} banks={banks}', '<SearchView key={`search-${searchRevision}`} query={query} onQueryChange={setQuery} banks={enabledBanks}')

          # Existing review rounds may reference a bank that was later disabled; intersect before new run setup.
          replace('src/app/practice/practice-setup.tsx',
          '''if (round) { setBankIds([...round.bankIds]); onBankChange([...round.bankIds]); }''',
          '''if (round) { const nextBankIds = round.bankIds.filter((id) => banks.some((bank) => bank.id === id)); setBankIds(nextBankIds); onBankChange(nextBankIds); }''')

          # Management view: filter chips + synced toggle. Filtered views never reorder subsets.
          replace('src/app/bank/bank-library-view.tsx',
          '''import { FileText, FileUp, FolderPlus, Library, Plus } from "lucide-react";''',
          '''import { FileText, FileUp, FolderPlus, Library, Plus } from "lucide-react";''')
          replace('src/app/bank/bank-library-view.tsx',
          '''import { bankTitle, deleteBankFolder, reorderBanks, sortedBanks, type Bank, type BankFolder } from "./bank-library/bank-library-shared";''',
          '''import { bankTitle, deleteBankFolder, isBankEnabled, reorderBanks, saveBank, sortedBanks, type Bank, type BankFolder } from "./bank-library/bank-library-shared";''')
          replace('src/app/bank/bank-library-view.tsx',
          '''  const [showUnfiled, setShowUnfiled] = useState(false);
            const ordered = sortedBanks(banks);
          ''',
          '''  const [showUnfiled, setShowUnfiled] = useState(false);
            const [bankFilter, setBankFilter] = useState<"all" | "enabled" | "disabled">("all");
            const ordered = sortedBanks(banks);
            const enabledCount = banks.filter(isBankEnabled).length;
            const disabledCount = banks.length - enabledCount;
            const visibleOrdered = ordered.filter((bank) => bankFilter === "all" ? true : bankFilter === "enabled" ? isBankEnabled(bank) : !isBankEnabled(bank));
            const visibleFolders = bankFilter === "all" ? folders : folders.filter((folder) => visibleOrdered.some((bank) => bank.folderId === folder.id));
            const reorderEnabled = bankFilter === "all";
          ''')
          replace('src/app/bank/bank-library-view.tsx',
          '''  function moveBank(bank: Bank, offset: number) {
          ''',
          '''  async function toggleBankEnabled(bank: Bank) {
              const enabled = !isBankEnabled(bank);
              try {
                await saveBank(bank.id, { enabled });
                onNotice(enabled ? `题库“${bankTitle(bank)}”已启用` : `题库“${bankTitle(bank)}”已停用，将不再出现在首页、练习和搜索中`);
              } catch (error) {
                onNotice(error instanceof Error ? `题库状态保存失败：${error.message}` : "题库状态保存失败");
              }
            }

            function moveBank(bank: Bank, offset: number) {
              if (!reorderEnabled) return;
          ''')
          replace('src/app/bank/bank-library-view.tsx',
          '''<div className="bank-management-tools"><div><strong>整理工具</strong><small>题库分组、模板与未归档内容</small></div><div className="bank-management-tools-actions"><button onClick={() => setFolderDialog("new")}><FolderPlus size={16} />新建文件夹</button><ExcelTemplateAction onNotice={onNotice} /><button className={showUnfiled ? "active" : ""} onClick={() => setShowUnfiled((value) => !value)}><FileText size={16} />{showUnfiled ? "隐藏未归档" : "未归档题目"}</button></div></div>''',
          '''<div className="bank-management-tools"><div><strong>整理工具</strong><small>{enabledCount} 个启用 · {disabledCount} 个停用</small></div><div className="bank-management-tools-actions"><button className={bankFilter === "all" ? "active" : ""} onClick={() => setBankFilter("all")}>全部 {banks.length}</button><button className={bankFilter === "enabled" ? "active" : ""} onClick={() => setBankFilter("enabled")}>已启用 {enabledCount}</button><button className={bankFilter === "disabled" ? "active" : ""} onClick={() => setBankFilter("disabled")}>已停用 {disabledCount}</button><button onClick={() => setFolderDialog("new")}><FolderPlus size={16} />新建文件夹</button><ExcelTemplateAction onNotice={onNotice} /><button className={showUnfiled ? "active" : ""} onClick={() => setShowUnfiled((value) => !value)}><FileText size={16} />{showUnfiled ? "隐藏未归档" : "未归档题目"}</button></div></div>''')
          replace('src/app/bank/bank-library-view.tsx',
          '''    {banks.length ? <div className="bank-folder-list">
                {folders.map((folder) => <BankFolderSection key={folder.id} folder={folder} banks={ordered.filter((bank) => bank.folderId === folder.id)} draggedBankId={draggedBankId} onDrag={setDraggedBankId} onDrop={(beforeId) => draggedBankId && void placeBank(draggedBankId, folder.id, beforeId)} onOpen={(bank) => setActiveBankId(bank.id)} onMove={moveBank} onEditFolder={() => setFolderDialog(folder)} onDeleteFolder={() => setPendingFolderDelete(folder)} />)}
                <BankFolderSection banks={ordered.filter((bank) => !bank.folderId || !folders.some((folder) => folder.id === bank.folderId))} draggedBankId={draggedBankId} onDrag={setDraggedBankId} onDrop={(beforeId) => draggedBankId && void placeBank(draggedBankId, undefined, beforeId)} onOpen={(bank) => setActiveBankId(bank.id)} onMove={moveBank} />
              </div> :''',
          '''    {banks.length ? (visibleOrdered.length ? <div className="bank-folder-list">
                {visibleFolders.map((folder) => <BankFolderSection key={folder.id} folder={folder} banks={visibleOrdered.filter((bank) => bank.folderId === folder.id)} draggedBankId={draggedBankId} onDrag={setDraggedBankId} onDrop={(beforeId) => draggedBankId && reorderEnabled && void placeBank(draggedBankId, folder.id, beforeId)} onOpen={(bank) => setActiveBankId(bank.id)} onMove={moveBank} onToggleEnabled={(bank) => void toggleBankEnabled(bank)} reorderEnabled={reorderEnabled} onEditFolder={() => setFolderDialog(folder)} onDeleteFolder={() => setPendingFolderDelete(folder)} />)}
                <BankFolderSection banks={visibleOrdered.filter((bank) => !bank.folderId || !folders.some((folder) => folder.id === bank.folderId))} draggedBankId={draggedBankId} onDrag={setDraggedBankId} onDrop={(beforeId) => draggedBankId && reorderEnabled && void placeBank(draggedBankId, undefined, beforeId)} onOpen={(bank) => setActiveBankId(bank.id)} onMove={moveBank} onToggleEnabled={(bank) => void toggleBankEnabled(bank)} reorderEnabled={reorderEnabled} />
              </div> : <div className="folder-drop-empty">{bankFilter === "enabled" ? "暂无启用题库" : bankFilter === "disabled" ? "暂无停用题库" : "暂无题库"}</div>) :''')

          # Card-level compact toggle; no new stylesheet so CSS budget stays flat.
          p = Path('src/app/bank/bank-library/bank-folder-section.tsx')
          s = p.read_text()
          s = s.replace('''import { bankTitle, fullDate, type Bank, type BankFolder } from "./bank-library-shared";''', '''import { bankTitle, fullDate, isBankEnabled, type Bank, type BankFolder } from "./bank-library-shared";''')
          start = s.index('function SortableBankItem(')
          end = s.index('\n\nexport function BankFolderSection', start)
          new_item = r'''function SortableBankItem({ bank, index, total, onOpen, onMove, onToggleEnabled, reorderEnabled }: { bank: Bank; index: number; total: number; onOpen: (bank: Bank) => void; onMove: (bank: Bank, offset: number) => void; onToggleEnabled: (bank: Bank) => void; reorderEnabled: boolean }) {
            const enabled = isBankEnabled(bank);
            const { attributes, listeners, setNodeRef, transform, transition, isDragging } = useSortable({ id: bank.id, disabled: !reorderEnabled });
            return <article ref={setNodeRef} data-drag-id={bank.id} data-drag-index={index} style={{ transform: CSS.Transform.toString(transform), transition, opacity: isDragging ? 0.6 : undefined }} className={isDragging ? "drag-active" : ""}><button type="button" className="bank-drag" disabled={!reorderEnabled} aria-label={reorderEnabled ? `拖动${bankTitle(bank)}排序` : `${bankTitle(bank)}筛选视图不可排序`} style={{ opacity: reorderEnabled ? 1 : .28, cursor: reorderEnabled ? "grab" : "default" }} {...attributes} {...listeners}><GripVertical size={18} /></button><button className="bank-management-main" onClick={() => onOpen(bank)}><span className="bank-color" style={{ background: bank.color || "#dfe9e2", opacity: enabled ? 1 : .55 }}><BookOpenCheck size={18} /></span><span><strong>{bankTitle(bank)}</strong><small>{bank.questionCount.toLocaleString()} 题 · {fullDate(bank.importedAt)}{enabled ? "" : " · 已停用"}</small></span><ChevronRight size={17} /></button><div style={{ paddingRight: 7, display: "flex", alignItems: "center", gap: 4 }}><button type="button" aria-pressed={enabled} aria-label={`${enabled ? "停用" : "启用"}${bankTitle(bank)}`} onClick={() => onToggleEnabled(bank)} style={{ minWidth: 44, height: 28, border: "1px solid var(--color-border)", borderRadius: 8, padding: "0 8px", color: enabled ? "var(--color-primary)" : "var(--color-text-muted)", background: enabled ? "var(--color-primary-soft)" : "var(--color-surface-muted)", cursor: "pointer", fontSize: 10, fontWeight: 700 }}>{enabled ? "启用" : "停用"}</button>{reorderEnabled && <div className="bank-order-buttons" style={{ paddingRight: 0 }}><button aria-label="向上移动" disabled={index === 0} onClick={() => onMove(bank, -1)}><ArrowUp size={14} /></button><button aria-label="向下移动" disabled={index === total - 1} onClick={() => onMove(bank, 1)}><ArrowDown size={14} /></button></div>}</div></article>;
          }'''
          s = s[:start] + new_item + s[end:]
          s = s.replace('''export function BankFolderSection({ folder, banks, draggedBankId, onDrag, onDrop, onOpen, onMove, onEditFolder, onDeleteFolder }: { folder?: BankFolder; banks: Bank[]; draggedBankId?: string; onDrag: (id?: string) => void; onDrop: (beforeId?: string) => void; onOpen: (bank: Bank) => void; onMove: (bank: Bank, offset: number) => void; onEditFolder?: () => void; onDeleteFolder?: () => void }) {''', '''export function BankFolderSection({ folder, banks, draggedBankId, onDrag, onDrop, onOpen, onMove, onToggleEnabled, reorderEnabled = true, onEditFolder, onDeleteFolder }: { folder?: BankFolder; banks: Bank[]; draggedBankId?: string; onDrag: (id?: string) => void; onDrop: (beforeId?: string) => void; onOpen: (bank: Bank) => void; onMove: (bank: Bank, offset: number) => void; onToggleEnabled: (bank: Bank) => void; reorderEnabled?: boolean; onEditFolder?: () => void; onDeleteFolder?: () => void }) {''')
          s = s.replace('''  function reorder(from: number, to: number) {
              if (from < 0''', '''  function reorder(from: number, to: number) {
              if (!reorderEnabled) return;
              if (from < 0''')
          s = s.replace('''  function handleDragStart(event: DragStartEvent) {
              onDrag''', '''  function handleDragStart(event: DragStartEvent) {
              if (!reorderEnabled) return;
              onDrag''')
          s = s.replace('''  function handleDragOver(event: DragOverEvent) {
              const { active''', '''  function handleDragOver(event: DragOverEvent) {
              if (!reorderEnabled) return;
              const { active''')
          s = s.replace('''  function handleDragEnd(event: DragEndEvent) {
              const { active''', '''  function handleDragEnd(event: DragEndEvent) {
              if (!reorderEnabled) { onDrag(undefined); return; }
              const { active''')
          s = s.replace('''<SortableBankItem key={bank.id} bank={bank} index={index} total={ordered.length} onOpen={onOpen} onMove={onMove} />''', '''<SortableBankItem key={bank.id} bank={bank} index={index} total={ordered.length} onOpen={onOpen} onMove={onMove} onToggleEnabled={onToggleEnabled} reorderEnabled={reorderEnabled} />''')
          p.write_text(s)

          # Source/data tests lock semantics without creating a new test registration surface.
          replace('scripts/tests/test-v7-ui-data-flow.ts',
          '''import { resumeIndexAfterLastAnswer } from "../../src/lib/practice/practice-resume";''',
          '''import { resumeIndexAfterLastAnswer } from "../../src/lib/practice/practice-resume";
          import { isBankEnabled } from "../../src/lib/db/v7-types";''')
          replace('scripts/tests/test-v7-ui-data-flow.ts',
          '''const scope = normalizeProgressScope(undefined);''',
          '''assert.equal(isBankEnabled({}), true, "旧题库缺少 enabled 字段时必须默认启用");
          assert.equal(isBankEnabled({ enabled: true }), true);
          assert.equal(isBankEnabled({ enabled: false }), false);

          const scope = normalizeProgressScope(undefined);''')
          replace('scripts/tests/test-v7-ui-data-flow.ts',
          '''const study = source("shell/app-shell.tsx");
          assert.match(study, /importTargetBankIdRef/,''',
          '''const study = source("shell/app-shell.tsx");
          assert.match(study, /const enabledBanks = banks\.filter\(isBankEnabled\)/, "AppShell 必须集中定义学习可见题库");
          assert.match(study, /BankLibraryView banks=\{banks\}/, "题库管理必须继续接收全部题库");
          assert.match(study, /Dashboard[\s\S]*?banks=\{enabledBanks\}/, "首页只显示启用题库");
          assert.match(study, /PracticeSetupView[\s\S]*?banks=\{enabledBanks\}/, "新练习只使用启用题库");
          assert.match(study, /SearchView[\s\S]*?banks=\{enabledBanks\}/, "搜索只使用启用题库");
          assert.match(study, /localStorage\.setItem\("study-current-banks", JSON\.stringify\(next\)\)/, "远端停用后必须清理本机幽灵选择");
          assert.match(bank, /已启用 \{enabledCount\}/, "题库管理应提供启用筛选");
          assert.match(bank, /已停用 \{disabledCount\}/, "题库管理应提供停用筛选");
          assert.match(bank, /saveBank\(bank\.id, \{ enabled \}\)/, "启停必须走同步题库更新");
          assert.match(study, /importTargetBankIdRef/,''')

          replace('scripts/tests/test-db-v7.ts',
          '''  splitQuestionV7,
            saveNoteV7,''',
          '''  splitQuestionV7,
            updateBankV7,
            saveNoteV7,''')
          # Append isolated lifecycle test at end so it cannot perturb earlier exact-count assertions.
          p = Path('scripts/tests/test-db-v7.ts')
          s = p.read_text()
          s += r'''

          // Disabled bank is a synced visibility state, not a delete: management can still read it,
          // while new multi-bank study queries exclude it. Re-enabling restores study eligibility.
          {
            const visibilityBank = await createBankV7("题库启停测试");
            assert.equal(visibilityBank.enabled, true, "new banks explicitly default enabled");
            const visibilityQuestion = await createQuestionV7(visibilityBank.id, { type: "单选", stem: "停用题库仍保留内容", options: ["A", "B"], answer: "A" });
            await updateBankV7(visibilityBank.id, { enabled: false });
            assert.equal((await dbV7.banks.get(visibilityBank.id))?.enabled, false);
            assert.equal((await getQuestionsForBanksV7([visibilityBank.id])).length, 0, "disabled bank must be excluded from new study queries");
            assert.equal((await getBankQuestionsV7(visibilityBank.id)).length, 1, "disabled bank must remain readable in management");
            await updateBankV7(visibilityBank.id, { enabled: true });
            assert.deepEqual((await getQuestionsForBanksV7([visibilityBank.id])).map((question) => question.id), [visibilityQuestion.id]);
          }
          '''
          p.write_text(s)

          print('bank enabled feature applied')
          PY
      - run: npm ci
      - name: Focused data and UI tests
        run: npm run test:db-v7 && npm run test:v7-ui && npm run typecheck
      - name: Commit generated feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts/tests
          git commit -m "feat: add synced bank enable state"
          git push origin HEAD:fix/ios-dark-startup-status-bar
