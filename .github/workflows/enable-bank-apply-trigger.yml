name: Enable bank feature application

on:
  pull_request:
    paths: [.github/workflows/enable-bank-apply-trigger.yml]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Normalize patch script against current import layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tools/apply-bank-enabled-once.py')
          s = p.read_text()
          s = s.replace(
            'import type { AttemptStatsV7, BankFolderV7, NoteV7, PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";',
            'import type { AttemptStatsV7, BankFolderV7, BankV7, NoteV7, PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";',
          )
          s = s.replace(
            'import { isBankEnabled, type AttemptStatsV7, type BankFolderV7, type NoteV7, type PracticeRunV7, type QuestionTypeV7 } from "@/lib/db/v7-types";',
            'import { isBankEnabled, type AttemptStatsV7, type BankFolderV7, type BankV7, type NoteV7, type PracticeRunV7, type QuestionTypeV7 } from "@/lib/db/v7-types";',
          )
          p.write_text(s)
          PY
      - name: Apply bank enable/disable feature
        run: python scripts/tools/apply-bank-enabled-once.py
      - run: npm ci
      - name: Focused verification
        run: npm run test:db-v7 && npm run test:v7-ui && npm run typecheck
      - name: Commit feature to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts/tests
          git commit -m 'feat: add synced bank enable state'
          git push origin HEAD:${{ github.head_ref }}
