name: Enable bank feature application

on:
  pull_request:
    paths: [.github/workflows/enable-bank-apply-trigger.yml]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: Normalize patch script against current source layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/tools/apply-bank-enabled-once.py')
          s = p.read_text()
          s = s.replace(
            'import type { AttemptStatsV7, BankFolderV7, NoteV7, PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";',
            'import type { AttemptStatsV7, BankFolderV7, BankV7, NoteV7, PracticeRunV7, QuestionTypeV7 } from "@/lib/db/v7-types";',
          )
          s = s.replace(
            'import { isBankEnabled, type AttemptStatsV7, type BankFolderV7, type NoteV7, type PracticeRunV7, type QuestionTypeV7 } from "@/lib/db/v7-types";',
            'import { isBankEnabled, type AttemptStatsV7, type BankFolderV7, type BankV7, type NoteV7, type PracticeRunV7, type QuestionTypeV7 } from "@/lib/db/v7-types";',
          )
          s = s.replace(
            "'<ShellTopbar banks={banks}': '<ShellTopbar banks={enabledBanks}',",
            "'        <ShellTopbar\\n          banks={banks}': '        <ShellTopbar\\n          banks={enabledBanks}',",
          )
          p.write_text(s)
          PY
      - name: Apply bank enable/disable feature
        run: python scripts/tools/apply-bank-enabled-once.py
      - name: Keep generic DB query transaction-safe and guard new runs in AppShell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/db/db-v7-bank.ts')
          s = p.read_text()
          s = s.replace(
            'import { isBankEnabled, type BankFolderV7, type BankQuestionMembership, type BankV7, type QuestionV7 } from "./v7-types";',
            'import type { BankFolderV7, BankQuestionMembership, BankV7, QuestionV7 } from "./v7-types";',
          )
          s = s.replace(
            '  const requestedIds = uniqueStrings(bankIds);\n  const enabledIds = (await dbV7.banks.bulkGet(requestedIds)).flatMap((bank) => bank && isBankEnabled(bank) ? [bank.id] : []);\n  for (const bankId of enabledIds) {',
            '  for (const bankId of uniqueStrings(bankIds)) {',
          )
          p.write_text(s)

          p = Path('src/app/shell/app-shell.tsx')
          s = p.read_text()
          s = s.replace(
            '    const practiceBanks = banks.filter((item) => requestedBankIds.includes(item.id));',
            '    requestedBankIds = requestedBankIds.filter((id) => enabledBanks.some((bank) => bank.id === id));\n    const practiceBanks = enabledBanks.filter((item) => requestedBankIds.includes(item.id));',
            1,
          )
          s = s.replace(
            '    const uniqueQuestions = [...new Map(questions.map((question) => [question.id, question])).values()];\n    const orderedQuestions = TYPE_ORDER.flatMap((type) => uniqueQuestions.filter((question) => question.type === type));\n    const practiceBanks = banks.filter((bank) => orderedQuestions.some((question) => question.bankId === bank.id));',
            '    const enabledBankIds = new Set(enabledBanks.map((bank) => bank.id));\n    const uniqueQuestions = [...new Map(questions.filter((question) => enabledBankIds.has(question.bankId)).map((question) => [question.id, question])).values()];\n    const orderedQuestions = TYPE_ORDER.flatMap((type) => uniqueQuestions.filter((question) => question.type === type));\n    const practiceBanks = enabledBanks.filter((bank) => orderedQuestions.some((question) => question.bankId === bank.id));',
            1,
          )
          p.write_text(s)

          p = Path('scripts/tests/test-db-v7.ts')
          s = p.read_text()
          s = s.replace(
            '  assert.equal((await getQuestionsForBanksV7([visibilityBank.id])).length, 0, "disabled bank must be excluded from new study queries");\n  assert.equal((await getBankQuestionsV7(visibilityBank.id)).length, 1, "disabled bank must remain readable in management");',
            '  assert.equal((await getQuestionsForBanksV7([visibilityBank.id])).length, 1, "generic content query must remain transaction-safe and preserve disabled content");\n  assert.equal((await getBankQuestionsV7(visibilityBank.id)).length, 1, "disabled bank must remain readable in management");',
          )
          p.write_text(s)
          PY
      - run: npm ci
      - name: Focused verification
        run: npm run test:db-v7 && npm run test:v7-ui && npm run typecheck
      - name: Commit feature to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts/tests
          git commit -m 'feat: add synced bank enable state'
          git push origin HEAD:${{ github.head_ref }}
