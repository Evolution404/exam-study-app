name: Enable bank feature application

on:
  pull_request:
    paths: [.github/workflows/enable-bank-apply-trigger.yml]

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Enable the one-shot workflow on PR events
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-bank-enabled-once.yml')
          s = p.read_text()
          old = 'on:\n  push:\n    branches: [fix/ios-dark-startup-status-bar]\n    paths: [.github/workflows/apply-bank-enabled-once.yml]\n'
          new = 'on:\n  pull_request:\n    paths: [.github/workflows/apply-bank-enabled-once.yml]\n'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/apply-bank-enabled-once.yml
          git commit -m 'chore: enable one-shot bank feature workflow'
          git push origin HEAD:${{ github.head_ref }}
