name: CSS Dark Input Finalize

on:
  push:
    branches: [refactor/search-residual-ownership]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[dark-input-finalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/search-residual-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Make dark form background feature-overridable
        shell: python
        run: |
          from pathlib import Path

          dark = Path('src/app/styles/dark-overrides.css')
          s = dark.read_text()
          old = 'background:var(--p-111813)!important'
          new = 'background:var(--dark-input-bg,var(--p-111813))!important'
          if old not in s:
              raise SystemExit('dark generic input background not found')
          s = s.replace(old, new, 1)
          redundant = 'html[data-theme="dark"] .question-manager-search input{color:var(--color-text);background:transparent!important}\n'
          s = s.replace(redundant, '')
          dark.write_text(s)

          targets = list(Path('src/app/search').glob('search-main-*.css'))
          changed = 0
          for p in targets:
              text = p.read_text()
              next_text = text.replace('.searchbox { position:relative;', '.searchbox { --dark-input-bg:transparent; position:relative;')
              next_text = next_text.replace('.search-home-query { position:sticky;', '.search-home-query { --dark-input-bg:transparent; position:sticky;')
              if next_text != text:
                  changed += 1
                  p.write_text(next_text)
          if changed < 2:
              raise SystemExit(f'expected Search dark-input ownership in 2 split files, changed={changed}')
      - run: node scripts/tools/check-css-architecture.mjs
      - run: npm run build
      - name: Commit final dark input ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/tools/css-architecture-baseline.json
          git commit -m "fix(css): preserve feature-owned transparent dark inputs [dark-input-finalized]"
          git push origin HEAD:refactor/search-residual-ownership
