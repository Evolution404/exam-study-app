name: Phase3 conditional projection rebuild
on:
  push:
    branches: [refactor/database-projection-sync-v10-20260917]
    paths: [.github/workflows/phase3-rebuild-condition-one-shot.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/database-projection-sync-v10-20260917
          fetch-depth: 0
      - name: Patch conditional projection rebuild
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/db/db-reconcile.ts')
          s=p.read_text()
          marker='''async function projectionIsEmpty(): Promise<boolean> {\n'''
          idx=s.index(marker)
          end=s.index('\n}\n', idx)+3
          helper='''\nasync function localProjectionsNeedRebuild(): Promise<boolean> {\n  const [\n    attemptCount,\n    practiceRunCount,\n    questionProgressCount,\n    questionDailyProgressCount,\n    bankPracticeStatsCount,\n    reviewRoundAttemptCount,\n    reviewRoundProgressCount,\n  ] = await Promise.all([\n    studyDb.attempts.count(),\n    studyDb.practiceRuns.count(),\n    studyDb.questionProgress.count(),\n    studyDb.questionDailyProgress.count(),\n    studyDb.bankPracticeStats.count(),\n    studyDb.attempts.where("reviewRoundId").above("").count(),\n    studyDb.reviewRoundProgress.count(),\n  ]);\n  return (attemptCount > 0 && (questionProgressCount === 0 || questionDailyProgressCount === 0))\n    || (practiceRunCount > 0 && bankPracticeStatsCount === 0)\n    || (reviewRoundAttemptCount > 0 && reviewRoundProgressCount === 0);\n}\n'''
          s=s[:end]+helper+s[end:]
          old='''  if (!reconciled) return false;\n  options.onProgress?.({ completed: totalOps, total: totalOps, label: "重建本地学习统计" });\n  await rebuildAllProjections();\n  options.onProgress?.({ completed: totalOps, total: totalOps, label: "本机投影重建完成" });\n  return true;\n}'''
          new='''  if (!reconciled) return false;\n  const shouldRebuildProjections = rowOps > 0 || await localProjectionsNeedRebuild();\n  if (shouldRebuildProjections) {\n    options.onProgress?.({ completed: totalOps, total: totalOps, label: "重建本地学习统计" });\n    await rebuildAllProjections();\n    options.onProgress?.({ completed: totalOps, total: totalOps, label: "本机投影重建完成" });\n  }\n  return true;\n}'''
          if s.count(old)!=1: raise SystemExit('rebuild tail mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase3-rebuild-condition-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db/db-reconcile.ts .github/workflows/phase3-rebuild-condition-one-shot.yml
          git commit -m "fix: preserve no-op reconcile without stale projections"
          git push origin HEAD:refactor/database-projection-sync-v10-20260917
