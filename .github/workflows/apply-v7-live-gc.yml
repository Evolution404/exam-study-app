name: Apply v7 live GC

on:
  push:
    branches: [sync/v7-live-gc]
  pull_request:
    branches: [refactor/sync-ui-boundary]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[v7-gc-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/v7-live-gc
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migration
        run: |
          if grep -q 'listImmutableDirectory' src/lib/sync/github-v7-remote.ts; then
            echo 'v7 GC migration already applied'
          else
            node scripts/tools/apply-v7-live-gc.mjs
          fi
      - run: npm run typecheck
      - run: npm run test:sync-v7-protocol
      - run: npx tsx scripts/tests/test-sync-v7-gc.ts
      - name: Commit generated GC integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/lib/sync/github-v7-remote.ts src/lib/sync/sync-v7-orchestrator.ts src/lib/sync/sync-v7-coalesce.ts scripts/tools/mock-github-server.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(sync): wire post-CAS v7 live GC [v7-gc-generated]'
          git push origin HEAD:sync/v7-live-gc
