name: CSS Split Once

on:
  push:
    branches:
      - refactor/search-residual-ownership

permissions:
  contents: write

jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, '[css-split]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/search-residual-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/tools/split-css-once.mjs
      - run: node scripts/tools/check-css-architecture.mjs
      - run: npm run build
      - name: Commit split styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app scripts/tools/check-css-architecture.mjs scripts/tools/css-architecture-baseline.json
          git commit -m "refactor(css): split final large stylesheets [css-split]"
          git push origin HEAD:refactor/search-residual-ownership
