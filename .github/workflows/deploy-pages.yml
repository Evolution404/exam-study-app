name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Fast checks
        run: npm run test:fast
      - name: Install Chromium for PWA smoke
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get update
            sudo apt-get install -y chromium
            chromium --version
          fi
      - name: PWA preview smoke
        run: npm run test:pwa-smoke
      - name: Rebuild GitHub Pages artifact
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build for Cloudflare Pages
        run: CF_PAGES=1 npm run build
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4 pages deploy dist --project-name exam-study-app --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 部署后立即清空边缘缓存。部署过渡期 /assets/* 可能被当成 SPA 回退
      # 返回 200 index.html，并因 _headers 的 immutable 规则被边缘缓存一年——
      # 下次加载永久命中污染条目（本会话已中招一次）。purge 清掉任何此类残留。
      # 尽力而为：token 若缺 Zone·Cache Purge 权限则打 warning，不使部署误报失败。
      - name: Purge Cloudflare edge cache
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          ZONE_NAME="980923.xyz"
          ZONE_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::无法解析 zone ${ZONE_NAME} 的 id，跳过边缘缓存清理"
            exit 0
          fi
          BODY=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}' \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache")
          if jq -e '.success' <<<"$BODY" >/dev/null; then
            echo "已清除 Cloudflare 边缘缓存（zone ${ZONE_NAME}，purge_everything）"
          else
            MSG=$(jq -r '.errors[0].message' <<<"$BODY")
            echo "::warning::缓存清理未生效：${MSG}（若为权限不足，请在 Cloudflare 给该 token 增加 Zone·Cache Purge 权限）"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
