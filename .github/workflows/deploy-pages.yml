name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The current artifact is the only build that blocks the initial deploy.
  # Verification is deliberately post-deploy so a broken release can be
  # detected against the exact artifact that users just received.
  build:
    runs-on: ubuntu-latest
    outputs:
      rollback_sha: ${{ steps.rollback-ref.outputs.sha }}
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Production build (current)
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload current artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: current
          path: dist
      - name: Resolve rollback commit
        id: rollback-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            rollback_sha="$EVENT_BEFORE"
          else
            rollback_sha="$(git rev-parse HEAD^)"
          fi
          if ! git cat-file -e "$rollback_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$rollback_sha"
          fi
          git cat-file -e "$rollback_sha^{commit}"
          echo "sha=$rollback_sha" >> "$GITHUB_OUTPUT"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy current Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: current

  # Cloudflare is a second production target. It has its own root-base build,
  # but it never gates the current GitHub Pages artifact or its first deploy.
  deploy_cloudflare:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      previous_deployment_id: ${{ steps.record-production.outputs.deployment_id }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: exam-study-app
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
      - name: Setup Node dependencies
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: ./.github/actions/node-deps
      - name: Record current production deployment
        id: record-production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -u
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/deployments?env=production&per_page=20"
          response="$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$endpoint" 2>/dev/null || true)"
          previous_id="$(jq -r '[.result[]? | select(.environment == "production" or .environment == null)] | sort_by(.created_on // "") | reverse | .[0].id // empty' <<<"$response" 2>/dev/null || true)"
          if [[ -n "$previous_id" ]]; then
            echo "deployment_id=$previous_id" >> "$GITHUB_OUTPUT"
            echo "已记录 Cloudflare 当前 production deployment: $previous_id"
          else
            echo "::warning::无法记录 Cloudflare 当前 production deployment，失败验证时将跳过 Cloudflare 回退"
          fi
      - name: Build for Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: CF_PAGES=1 npm run build
      - name: Deploy current Cloudflare Pages version
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --commit-dirty=true
      # 部署过渡期 /assets/* 可能被当成 SPA 回退并因 _headers 的 immutable
      # 规则被缓存一年；清理残留，防止旧资源继续污染线上页面。
      - name: Purge Cloudflare edge cache
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_ZONE_NAME: 980923.xyz
        run: bash scripts/tools/purge-cloudflare-cache.sh

  # The native release shares only the common build gate with both web deploys.
  # All three production targets therefore publish concurrently.
  ios_release:
    name: Build and publish SideStore IPA
    runs-on: macos-15
    needs: build
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.tag }}
      previous_release_tag: ${{ steps.previous-release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_VERSION_PREFIX: "1.0"
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Resolve deterministic iOS version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(git rev-list --count HEAD)"
          version="${IOS_VERSION_PREFIX}.${build_number}"
          tag="ios-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          {
            echo "## iOS Release"
            echo
            echo "- Version: \`${version}\`"
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record previous SideStore release
        id: previous-release
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          releases_file="$RUNNER_TEMP/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases_file"
          previous_tag="$(jq -r --arg current "$CURRENT_TAG" '[.[] | select(.draft == false and (.tag_name | startswith("ios-v")) and .tag_name != $current)][0].tag_name // empty' "$releases_file")"
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous_tag" ]]; then
            echo "测试失败时将恢复 SideStore latest 到 ${previous_tag}"
          else
            echo "::warning::未找到此前 SideStore Release；首次发布失败时没有可恢复的 IPA"
          fi
      - name: Build unsigned SideStore IPA
        shell: bash
        run: |
          set -euo pipefail
          make ios-ipa \
            IOS_MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            IOS_BUILD_NUMBER="${{ steps.version.outputs.build_number }}" \
            IOS_ICLOUD_DIR="$RUNNER_TEMP/no-icloud"
      - name: Generate SideStore source
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/ios-release-notes.md"
          {
            echo "与网站提交 ${GITHUB_SHA::12} 同步发布。"
            echo
            git log -1 --pretty=%B
          } > "$notes_file"
          node scripts/tools/generate-sidestore-source.mjs \
            --ipa artifacts/ios/shijuan.ipa \
            --output artifacts/ios/sidestore-source.json \
            --version "${{ steps.version.outputs.version }}" \
            --date "$(git show -s --format=%cs HEAD)" \
            --notes-file "$notes_file"
          cp "$notes_file" artifacts/ios/release-notes.md
      - name: Publish immutable GitHub Release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/tools/publish-sidestore-release.sh

  # These checks intentionally share the same three dependencies and therefore
  # run concurrently only after GitHub Pages, Cloudflare Pages and IPA publish.
  fast_check:
    name: Fast checks (post-deploy)
    runs-on: ubuntu-latest
    needs: [deploy, deploy_cloudflare, ios_release]
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Fast checks
        run: npm run test:fast

  pwa_smoke:
    name: PWA smoke (post-deploy)
    runs-on: ubuntu-latest
    needs: [deploy, deploy_cloudflare, ios_release]
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Install Playwright Chromium
        run: npm exec -- playwright-core install --with-deps chromium
      - name: PWA preview smoke
        run: npm run test:pwa-smoke

  sidestore_smoke:
    name: SideStore smoke (post-deploy)
    runs-on: ubuntu-latest
    needs: [deploy, deploy_cloudflare, ios_release]
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v6
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Verify Cloudflare SideStore endpoints
        run: node scripts/tools/verify-sidestore-release.mjs --version "${{ needs.ios_release.outputs.version }}"

  # A Pages deployment is rolled back only when it succeeded and a post-
  # deployment verification failed. If the initial build/deploy failed, this
  # job is skipped because no new Pages version was successfully published.
  rollback_github_pages:
    name: Roll back GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'success' && (needs.fast_check.result == 'failure' || needs.pwa_smoke.result == 'failure' || needs.sidestore_smoke.result == 'failure') }}
    needs: [build, deploy, fast_check, pwa_smoke, sidestore_smoke]
    steps:
      - name: Checkout rollback commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.rollback_sha }}
          fetch-depth: 0
      - name: Setup Node dependencies
        uses: ./.github/actions/node-deps
      - name: Build rollback artifact
        env:
          GITHUB_SHA: ${{ needs.build.outputs.rollback_sha }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload rollback artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: rollback
          path: dist
      - name: Deploy rollback artifact
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: rollback

  # Cloudflare can restore an immutable deployment without rebuilding. Missing
  # credentials or a missing recorded ID safely skips this job.
  rollback_cloudflare:
    name: Roll back Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy_cloudflare.result == 'success' && (needs.fast_check.result == 'failure' || needs.pwa_smoke.result == 'failure' || needs.sidestore_smoke.result == 'failure') && needs.deploy_cloudflare.outputs.previous_deployment_id != '' }}
    needs: [deploy, deploy_cloudflare, fast_check, pwa_smoke, sidestore_smoke]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: exam-study-app
      PREVIOUS_DEPLOYMENT_ID: ${{ needs.deploy_cloudflare.outputs.previous_deployment_id }}
    steps:
      - name: Restore previous Cloudflare production deployment
        run: bash scripts/tools/rollback-cloudflare-pages.sh
      - name: Purge Cloudflare edge cache after rollback
        env:
          CLOUDFLARE_ZONE_NAME: 980923.xyz
        run: bash scripts/tools/purge-cloudflare-cache.sh

  # Release assets remain immutable. A failed version is rolled back by moving
  # GitHub's latest pointer to the previously published tag, which immediately
  # restores both stable SideStore proxy URLs without deleting history.
  rollback_ios_release:
    name: Roll back SideStore IPA
    runs-on: ubuntu-latest
    if: ${{ always() && needs.ios_release.result == 'success' && (needs.fast_check.result == 'failure' || needs.pwa_smoke.result == 'failure' || needs.sidestore_smoke.result == 'failure') && needs.ios_release.outputs.previous_release_tag != '' }}
    needs: [ios_release, fast_check, pwa_smoke, sidestore_smoke]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIOUS_RELEASE_TAG: ${{ needs.ios_release.outputs.previous_release_tag }}
    steps:
      - name: Restore previous SideStore latest release
        run: bash scripts/tools/rollback-sidestore-latest.sh
