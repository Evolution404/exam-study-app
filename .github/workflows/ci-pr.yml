name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Regenerate XLSX template
        run: npm run template:xlsx
      - name: Upload regenerated XLSX template
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-xlsx-template
          path: public/题库模板.xlsx
          if-no-files-found: error
      - name: Production build
        run: npm run build
      - name: Fast checks
        run: npm run test:fast
      - name: Install Playwright browsers
        run: npm exec -- playwright-core install --with-deps chromium webkit
      - name: Browser smoke (Playwright Chromium)
        env:
          BROWSER_GROUPS: desktop
        run: node scripts/tests/run-browser-local.mjs
      - name: Browser smoke (Playwright WebKit)
        env:
          BROWSER_ENGINE: webkit
          BROWSER_GROUPS: practice-combo,topbar-mobile,search-pin
        run: node scripts/tests/run-browser-local.mjs
      - name: PWA preview smoke
        run: npm run test:pwa-smoke
