name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Fast checks
        run: npm run test:fast
      - name: Install Playwright Chromium
        run: npm exec -- playwright-core install --with-deps chromium
      - name: Browser smoke (Playwright Chromium)
        run: npm run test:browser-smoke
      - name: PWA preview smoke
        run: npm run test:pwa-smoke
