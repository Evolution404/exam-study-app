name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Fast checks
        run: npm run test:fast
      - name: Install Chromium for browser smoke
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            sudo apt-get update
            sudo apt-get install -y chromium
            chromium --version
          fi
      - name: Browser smoke (Ubuntu Chromium)
        run: npm run test:browser-smoke
      - name: PWA preview smoke
        run: npm run test:pwa-smoke
