name: Pull request CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Regenerate XLSX template
        run: npm run template:xlsx
      - name: Persist regenerated XLSX template once
        shell: bash
        run: |
          if git diff --quiet -- public/题库模板.xlsx; then
            echo "template already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/题库模板.xlsx
          git commit -m "chore: regenerate xlsx template"
          git push origin HEAD:${{ github.head_ref }}
      - name: Production build
        run: npm run build
      - name: Fast checks
        run: npm run test:fast
      - name: Install Playwright browsers
        run: npm exec -- playwright-core install --with-deps chromium webkit
      - name: Browser smoke (Playwright Chromium)
        env:
          BROWSER_GROUPS: desktop
        run: node scripts/tests/run-browser-local.mjs
      - name: Browser smoke (Playwright WebKit)
        env:
          BROWSER_ENGINE: webkit
          BROWSER_GROUPS: practice-combo,topbar-mobile,search-pin
        run: node scripts/tests/run-browser-local.mjs
      - name: PWA preview smoke
        run: npm run test:pwa-smoke
